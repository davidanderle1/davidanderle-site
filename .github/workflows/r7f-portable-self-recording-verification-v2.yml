name: R7F immutable portable self-recording independent verification v2

on:
  push:
    branches:
      - r7f-portable-self-recording-v2-20260901
    paths:
      - '.github/workflows/r7f-portable-self-recording-verification-v2.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: r7f-portable-self-recording-v2-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC
  SOURCE_DATE_EPOCH: '1787961600'
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact immutable R7F commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0

      - name: Load and validate immutable builder lock
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence artifact
          test "$(node --version)" = 'v24.20.0'
          test "$(npm --version)" = '11.19.0'
          python3 -m py_compile \
            .github/scripts/r7f-v3-tree-guard.py \
            .github/scripts/r7f-independent-link-audit.py \
            .github/scripts/r7f-independent-dist-audit.py \
            .github/scripts/r7f-independent-source-audit.py \
            .github/scripts/r7f-evidence-gates.py \
            .github/scripts/r7f-independent-axe-fingerprint-dynamic.py
          bash -n .github/scripts/r7f-v3.sh
          bash -n .github/scripts/r7f-v4.sh
          bash -n .github/scripts/r7f-v6-final.sh
          bash -n .github/scripts/r7f-v6-final-locked.sh
          node --check .github/scripts/r7f-independent-portable-self-recording-audit-v2.mjs

          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          lock_path=Path('.github/r7f-v6-builder-input.json')
          att_path=Path('.github/r7f-v6-r7e-external-audit.json')
          full_path=Path('.github/r7e-portable-self-recording-v4-full-external-audit.json')
          lock=json.loads(lock_path.read_text())
          att=json.loads(att_path.read_text())
          full=json.loads(full_path.read_text())
          sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          att_sha=sha(att_path); full_sha=sha(full_path)
          portable=lock.get('portableSelfRecording') or {}
          checks={
            'lock-schema':lock.get('schema')=='R7F_BUILDER_INPUT_V5_FULL_HISTORY_DYNAMIC_FINGERPRINT',
            'repository':lock.get('repository')==os.environ['GITHUB_REPOSITORY'],
            'builder-branch':lock.get('builderBranch')=='r7e-portable-self-recording-final-20260901',
            'builder-workflow':lock.get('builderWorkflowPath')=='.github/workflows/r7e-portable-authoritative-executor-v4.yml',
            'builder-commit':lock.get('builderHeadSha')=='ea592cde4f4a09f18442308ff14e1eeb2621bf33',
            'builder-run':lock.get('builderRunId')==33509839046,
            'main-artifact':lock.get('builderArtifactId')==9801257055,
            'lineage-artifact':portable.get('lineageArtifactId')==9801258515,
            'attestation-hash':lock.get('r7eExternalAuditSha256')==portable.get('externalAuditAttestationSha256')==att_sha,
            'full-audit-hash':portable.get('fullExternalAuditSha256')==att.get('fullAudit',{}).get('sha256')==full_sha,
            'attestation-pass':att.get('passed') is True and att.get('decision')=='R7E_FULL_HISTORY_EXTERNAL_AUDIT_PASS' and att.get('specificDecision')=='R7E_PORTABLE_SELF_RECORDING_V4_EXTERNAL_AUDIT_PASS' and att.get('blockers')==[],
            'full-audit-pass':full.get('passed') is True and full.get('decision')=='R7E_PORTABLE_SELF_RECORDING_V4_EXTERNAL_AUDIT_PASS',
            'full-audit-63':full.get('metrics',{}).get('checkCount')==63 and full.get('metrics',{}).get('passedCheckCount')==63,
            'tuple-schema':portable.get('schema')=='R7E_PORTABLE_SELF_RECORDING_AUTHORITATIVE_TUPLE_V4',
          }
          failed=[name for name,passed in checks.items() if not passed]
          result={'schema':'R7F_V2_IMMUTABLE_INPUT_PREFLIGHT','passed':not failed,'checks':checks,'failedChecks':failed,'hashes':{'lock':sha(lock_path),'attestation':att_sha,'fullExternalAudit':full_sha}}
          Path('evidence/r7f-v2-input-preflight.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          if failed: raise SystemExit(1)

          values={
            'BUILDER_BRANCH':lock['builderBranch'],
            'BUILDER_WORKFLOW_PATH':lock['builderWorkflowPath'],
            'BUILDER_RUN_ID':lock['builderRunId'],
            'BUILDER_COMMIT':lock['builderHeadSha'],
            'BUILDER_ARTIFACT_ID':lock['builderArtifactId'],
            'BUILDER_ARTIFACT_NAME':lock['builderArtifactName'],
            'BUILDER_ARTIFACT_DIGEST':lock['builderArtifactDigest'],
            'BUILDER_SOURCE_ARCHIVE_SHA256':lock['builderSourceArchiveSha256'],
            'BUILDER_FROZEN_SOURCE_TREE_SHA256':lock['builderFrozenSourceTreeSha256'],
            'BUILDER_FROZEN_SOURCE_TAR_SHA256':lock['builderFrozenSourceTarSha256'],
            'BUILDER_VERIFIED_DIST_TREE_SHA256':lock['builderVerifiedDistTreeSha256'],
            'BUILDER_STRESS_DIST_TREE_SHA256':lock['builderStressDistTreeSha256'],
            'BUILDER_AXE_ADJUDICATION_FILE_SHA256':lock['builderAxeAdjudicationFileSha256'],
            'BUILDER_AXE_SEMANTIC_INVENTORY_SHA256':lock['builderAxeSemanticInventorySha256'],
            'BUILDER_AXE_NODE_SET_SHA256':lock['builderAxeNodeFingerprintSetSha256'],
            'BUILDER_AXE_BINDING_SET_SHA256':lock['builderAxeBindingFingerprintSetSha256'],
            'BUILDER_AXE_INCOMPLETE_NODE_COUNT':lock['builderAxeIncompleteNodeCount'],
            'R7E_EXTERNAL_AUDIT_SHA256':lock['r7eExternalAuditSha256'],
            'BUILDER_LINEAGE_ARTIFACT_ID':portable['lineageArtifactId'],
            'BUILDER_LINEAGE_ARTIFACT_NAME':portable['lineageArtifactName'],
            'BUILDER_LINEAGE_ARTIFACT_DIGEST':portable['lineageArtifactDigest'],
            'BUILDER_TUPLE_FILE':portable['tupleFile'],
            'BUILDER_TUPLE_SHA256':portable['tupleSha256'],
            'BUILDER_GENERATED_PLAN_SHA256':portable['generatedPlanSha256'],
            'BUILDER_GENERATED_PLAN_EXECUTION_SHA256':portable['generatedPlanExecutionSha256'],
            'BUILDER_GENERATOR_SHA256':portable['generatorSha256'],
            'BUILDER_EXECUTOR_SHA256':portable['executorSha256'],
            'BUILDER_EXECUTOR_INFRASTRUCTURE_SHA256':portable['executorInfrastructureSha256'],
            'BUILDER_MAIN_INTERNAL_MANIFEST_SHA256':portable['mainInternalManifestSha256'],
            'BUILDER_LINEAGE_INTERNAL_MANIFEST_SHA256':portable['lineageInternalManifestSha256'],
            'BUILDER_PACKAGE_VALIDATION_SHA256':portable['packageValidationSha256'],
            'BUILDER_FULL_EXTERNAL_AUDIT_SHA256':portable['fullExternalAuditSha256'],
          }
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as handle:
            for key,value in values.items(): handle.write(f'{key}={value}\n')
          PY
          sha256sum \
            .github/r7f-v6-builder-input.json \
            .github/r7f-v6-r7e-external-audit.json \
            .github/r7e-portable-self-recording-v4-full-external-audit.json \
            .github/scripts/r7f-independent-portable-self-recording-audit-v2.mjs \
            .github/workflows/r7f-portable-self-recording-verification-v2.yml \
            > evidence/r7f-v2-committed-infrastructure.sha256

      - name: Authenticate exact R7E run and both artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/${BUILDER_BRANCH}" --jq '.commit.sha')" = "$BUILDER_COMMIT"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILDER_RUN_ID}" > evidence/r7e-v4-run-metadata.json
          jq -e --arg commit "$BUILDER_COMMIT" --arg branch "$BUILDER_BRANCH" --arg path "$BUILDER_WORKFLOW_PATH" '
            .head_sha==$commit and .head_branch==$branch and .path==$path and .status=="completed" and .conclusion=="success"
          ' evidence/r7e-v4-run-metadata.json >/dev/null

          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BUILDER_ARTIFACT_ID}" > evidence/r7e-v4-main-artifact-metadata.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BUILDER_LINEAGE_ARTIFACT_ID}" > evidence/r7e-v4-lineage-artifact-metadata.json
          jq -e --argjson id "$BUILDER_ARTIFACT_ID" --arg name "$BUILDER_ARTIFACT_NAME" --arg digest "$BUILDER_ARTIFACT_DIGEST" --argjson run "$BUILDER_RUN_ID" --arg commit "$BUILDER_COMMIT" '
            .id==$id and .name==$name and .digest==$digest and .expired==false and .workflow_run.id==$run and .workflow_run.head_sha==$commit
          ' evidence/r7e-v4-main-artifact-metadata.json >/dev/null
          jq -e --argjson id "$BUILDER_LINEAGE_ARTIFACT_ID" --arg name "$BUILDER_LINEAGE_ARTIFACT_NAME" --arg digest "$BUILDER_LINEAGE_ARTIFACT_DIGEST" --argjson run "$BUILDER_RUN_ID" --arg commit "$BUILDER_COMMIT" '
            .id==$id and .name==$name and .digest==$digest and .expired==false and .workflow_run.id==$run and .workflow_run.head_sha==$commit
          ' evidence/r7e-v4-lineage-artifact-metadata.json >/dev/null

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BUILDER_LINEAGE_ARTIFACT_ID}/zip" \
            --output /tmp/r7e-v4-lineage.zip
          test "sha256:$(sha256sum /tmp/r7e-v4-lineage.zip | awk '{print $1}')" = "$BUILDER_LINEAGE_ARTIFACT_DIGEST"
          rm -rf builder-lineage
          mkdir builder-lineage
          unzip -q /tmp/r7e-v4-lineage.zip -d builder-lineage
          (
            cd builder-lineage
            sha256sum --check --strict EXECUTOR_LINEAGE_SHA256SUMS.txt
          ) | tee evidence/r7e-v4-lineage-manifest-check.txt
          test "$(sha256sum builder-lineage/EXECUTOR_LINEAGE_SHA256SUMS.txt | awk '{print $1}')" = "$BUILDER_LINEAGE_INTERNAL_MANIFEST_SHA256"
          test "$(sha256sum "builder-lineage/${BUILDER_TUPLE_FILE}" | awk '{print $1}')" = "$BUILDER_TUPLE_SHA256"
          test "$(sha256sum builder-lineage/generated-authoritative-plan.yml | awk '{print $1}')" = "$BUILDER_GENERATED_PLAN_SHA256"
          test "$(sha256sum builder-lineage/generated-plan-execution.json | awk '{print $1}')" = "$BUILDER_GENERATED_PLAN_EXECUTION_SHA256"
          jq -e --arg commit "$BUILDER_COMMIT" --argjson run "$BUILDER_RUN_ID" --argjson id "$BUILDER_ARTIFACT_ID" --arg digest "$BUILDER_ARTIFACT_DIGEST" '
            .schema=="R7E_PORTABLE_SELF_RECORDING_AUTHORITATIVE_TUPLE_V4" and .passed==true and
            .commit==$commit and .runId==$run and .artifact.id==$id and .artifact.digest==$digest and
            .branchHeadUnchanged==true and .generatedPlan.executedRunStepCount==18
          ' "builder-lineage/${BUILDER_TUPLE_FILE}" >/dev/null

      - name: Independently reproduce builder generator and executor semantics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf builder-infrastructure-replay
          mkdir -p builder-infrastructure-replay/.github/scripts builder-infrastructure-replay/.github/workflows
          fetch_file() {
            local source_path="$1" target_path="$2"
            gh api "repos/${GITHUB_REPOSITORY}/contents/${source_path}?ref=${BUILDER_COMMIT}" --jq '.content' \
              | tr -d '\n' | base64 --decode > "$target_path"
          }
          fetch_file '.github/scripts/materialize-portable-r7e-workflow.py' builder-infrastructure-replay/.github/scripts/materialize-portable-r7e-workflow.py
          fetch_file '.github/scripts/execute-generated-r7e-plan.py' builder-infrastructure-replay/.github/scripts/execute-generated-r7e-plan.py
          fetch_file '.github/workflows/r7e-full-history-reconciled-verification.yml' builder-infrastructure-replay/.github/workflows/r7e-full-history-reconciled-verification.yml
          fetch_file '.github/workflows/r7e-portable-json-schema-verification.yml' builder-infrastructure-replay/.github/workflows/r7e-portable-json-schema-verification.yml
          fetch_file '.github/workflows/r7e-portable-authoritative-executor-v4.yml' builder-infrastructure-replay/.github/workflows/r7e-portable-authoritative-executor-v4.yml
          test "$(sha256sum builder-infrastructure-replay/.github/scripts/materialize-portable-r7e-workflow.py | awk '{print $1}')" = "$BUILDER_GENERATOR_SHA256"
          test "$(sha256sum builder-infrastructure-replay/.github/scripts/execute-generated-r7e-plan.py | awk '{print $1}')" = "$BUILDER_EXECUTOR_SHA256"
          test "$(sha256sum builder-infrastructure-replay/.github/workflows/r7e-portable-json-schema-verification.yml | awk '{print $1}')" = "$BUILDER_GENERATED_PLAN_SHA256"
          cmp --silent builder-infrastructure-replay/.github/workflows/r7e-portable-json-schema-verification.yml builder-lineage/generated-authoritative-plan.yml
          (
            cd builder-infrastructure-replay
            cp .github/workflows/r7e-portable-json-schema-verification.yml /tmp/r7f-builder-committed-plan.yml
            python3 .github/scripts/materialize-portable-r7e-workflow.py
            cmp --silent /tmp/r7f-builder-committed-plan.yml .github/workflows/r7e-portable-json-schema-verification.yml
            cat > .executor-positive.yml <<'YAML'
          jobs:
            verify:
              runs-on: ubuntu-24.04
              steps:
                - name: positive
                  run: printf positive > .executor-positive-marker
                - name: failure-only
                  if: failure()
                  run: exit 91
                - name: always
                  if: always()
                  run: printf always > .executor-always-marker
          YAML
            sed -i 's/^          //' .executor-positive.yml
            python3 .github/scripts/execute-generated-r7e-plan.py .executor-positive.yml .executor-positive.json
            jq -e '.passed==true and .executedRunStepCount==2 and .skippedConditionCount==1 and .firstFailure==null' .executor-positive.json >/dev/null
            cat > .executor-negative.yml <<'YAML'
          jobs:
            verify:
              runs-on: ubuntu-24.04
              steps:
                - name: deliberate
                  run: exit 7
                - name: success-only
                  run: exit 92
                - name: failure-handler
                  if: failure()
                  run: printf handled > .executor-failure-marker
                - name: always-handler
                  if: always()
                  run: printf always > .executor-failure-always-marker
          YAML
            sed -i 's/^          //' .executor-negative.yml
            set +e
            python3 .github/scripts/execute-generated-r7e-plan.py .executor-negative.yml .executor-negative.json
            status=$?
            set -e
            test "$status" -ne 0
            jq -e '.passed==false and .executedRunStepCount==3 and .skippedConditionCount==1 and .firstFailure.name=="deliberate" and .firstFailure.exitCode==7' .executor-negative.json >/dev/null
          )
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('builder-infrastructure-replay')
          sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          checks={
            'generator-hash':sha(root/'.github/scripts/materialize-portable-r7e-workflow.py')==os.environ['BUILDER_GENERATOR_SHA256'],
            'executor-hash':sha(root/'.github/scripts/execute-generated-r7e-plan.py')==os.environ['BUILDER_EXECUTOR_SHA256'],
            'generated-plan-hash':sha(root/'.github/workflows/r7e-portable-json-schema-verification.yml')==os.environ['BUILDER_GENERATED_PLAN_SHA256'],
            'generated-plan-lineage-parity':(root/'.github/workflows/r7e-portable-json-schema-verification.yml').read_bytes()==Path('builder-lineage/generated-authoritative-plan.yml').read_bytes(),
            'positive-executor-test':json.loads((root/'.executor-positive.json').read_text()).get('passed') is True,
            'negative-executor-test':json.loads((root/'.executor-negative.json').read_text()).get('passed') is False,
          }
          failed=[k for k,v in checks.items() if not v]
          result={'schema':'R7F_INDEPENDENT_BUILDER_INFRASTRUCTURE_REPLAY_V1','passed':not failed,'checks':checks,'failedChecks':failed,'builderCommit':os.environ['BUILDER_COMMIT']}
          Path('evidence/independent-builder-infrastructure-replay.json').write_text(json.dumps(result,indent=2)+'\n')
          if failed: raise SystemExit(1)
          PY

      - name: Execute proven locked independent R7F
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/r7f-v6-final-locked.sh

      - name: Verify portable self-recording layer and adversarial controls
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/r7f-independent-portable-self-recording-audit-v2.mjs \
            builder verifier-run1 "builder-lineage/${BUILDER_TUPLE_FILE}" \
            evidence/independent-portable-self-recording-v2.json
          jq -e '.passed==true and .metrics.schemaFileCount==9 and .metrics.compiledSchemaCount==8 and .metrics.recordCount==12 and .metrics.executionStepCount==18' \
            evidence/independent-portable-self-recording-v2.json >/dev/null

          rm -rf negative-plan-builder negative-schema-verifier
          cp "builder-lineage/${BUILDER_TUPLE_FILE}" /tmp/negative-tuple-digest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/negative-tuple-digest.json'); x=json.loads(p.read_text()); x['artifact']['digest']='sha256:'+'0'*64; p.write_text(json.dumps(x,indent=2)+'\n')
          PY
          set +e
          node .github/scripts/r7f-independent-portable-self-recording-audit-v2.mjs builder verifier-run1 /tmp/negative-tuple-digest.json evidence/negative-tuple-digest.json
          s1=$?
          set -e
          test "$s1" -ne 0
          jq -e '.passed==false and (.failedChecks|index("tuple-main-artifact")!=null)' evidence/negative-tuple-digest.json >/dev/null

          cp -al builder negative-plan-builder
          python3 - <<'PY'
          from pathlib import Path
          p=Path('negative-plan-builder/R7E_EVIDENCE/generated-authoritative-plan.yml'); data=p.read_text(); q=p.with_suffix('.mutated'); q.write_text(data+'\n# deliberate R7F plan mutation\n'); q.replace(p)
          PY
          set +e
          node .github/scripts/r7f-independent-portable-self-recording-audit-v2.mjs negative-plan-builder verifier-run1 "builder-lineage/${BUILDER_TUPLE_FILE}" evidence/negative-generated-plan.json
          s2=$?
          set -e
          test "$s2" -ne 0
          jq -e '.passed==false and ((.failedChecks|index("tuple-plan-hash")!=null) or (.failedChecks|index("execution-plan-hash")!=null))' evidence/negative-generated-plan.json >/dev/null

          cp -al verifier-run1 negative-schema-verifier
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('negative-schema-verifier/schemas/profile.schema.json'); x=json.loads(p.read_text()); x['title']='R7F DELIBERATE SCHEMA MUTATION'; q=p.with_suffix('.mutated'); q.write_text(json.dumps(x,indent=2)+'\n'); q.replace(p)
          PY
          set +e
          node .github/scripts/r7f-independent-portable-self-recording-audit-v2.mjs builder negative-schema-verifier "builder-lineage/${BUILDER_TUPLE_FILE}" evidence/negative-verifier-schema.json
          s3=$?
          set -e
          test "$s3" -ne 0
          jq -e '.passed==false and ((.failedChecks|index("portable-schema-generated-byte-parity")!=null) or (.failedChecks|index("portable-schema-builder-verifier-byte-parity")!=null))' evidence/negative-verifier-schema.json >/dev/null

          cp "builder-lineage/${BUILDER_TUPLE_FILE}" /tmp/negative-tuple-scope.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/negative-tuple-scope.json'); x=json.loads(p.read_text()); x['scope']='R7 and all website phases closed; deployment approved'; p.write_text(json.dumps(x,indent=2)+'\n')
          PY
          set +e
          node .github/scripts/r7f-independent-portable-self-recording-audit-v2.mjs builder verifier-run1 /tmp/negative-tuple-scope.json evidence/negative-tuple-scope.json
          s4=$?
          set -e
          test "$s4" -ne 0
          jq -e '.passed==false and (.failedChecks|index("tuple-scope-bounded")!=null)' evidence/negative-tuple-scope.json >/dev/null
          rm -rf negative-plan-builder negative-schema-verifier

      - name: Bind portable self-recording evidence into final R7F artifact
        shell: bash
        run: |
          set -euo pipefail
          cp evidence/r7f-v2-input-preflight.json artifact/R7F_EVIDENCE/
          cp evidence/r7f-v2-committed-infrastructure.sha256 artifact/R7F_EVIDENCE/
          cp evidence/r7e-v4-run-metadata.json artifact/R7F_EVIDENCE/
          cp evidence/r7e-v4-main-artifact-metadata.json artifact/R7F_EVIDENCE/
          cp evidence/r7e-v4-lineage-artifact-metadata.json artifact/R7F_EVIDENCE/
          cp evidence/r7e-v4-lineage-manifest-check.txt artifact/R7F_EVIDENCE/
          cp evidence/independent-builder-infrastructure-replay.json artifact/R7F_EVIDENCE/
          cp evidence/independent-portable-self-recording-v2.json artifact/R7F_EVIDENCE/
          cp evidence/negative-tuple-digest.json artifact/R7F_EVIDENCE/
          cp evidence/negative-generated-plan.json artifact/R7F_EVIDENCE/
          cp evidence/negative-verifier-schema.json artifact/R7F_EVIDENCE/
          cp evidence/negative-tuple-scope.json artifact/R7F_EVIDENCE/
          cp "builder-lineage/${BUILDER_TUPLE_FILE}" artifact/R7F_EVIDENCE/r7e-portable-self-recording-v4-tuple.json
          cp builder-lineage/EXECUTOR_LINEAGE_SHA256SUMS.txt artifact/R7F_EVIDENCE/r7e-v4-lineage-sha256sums.txt
          cp .github/r7f-v6-builder-input.json artifact/R7F_EVIDENCE/final-builder-input-lock.json
          cp .github/r7f-v6-r7e-external-audit.json artifact/R7F_EVIDENCE/r7e-v4-external-audit-attestation.json
          cp .github/r7e-portable-self-recording-v4-full-external-audit.json artifact/R7F_EVIDENCE/r7e-v4-full-external-audit.json
          printf 'R7F PORTABLE SELF-RECORDING INDEPENDENT VERIFICATION COMPLETE — READY FOR HISTORY-BOUND CONTROLLER\n' > artifact/R7F_GATE_DECISION.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('artifact')
          p=root/'R7F_PACKAGE_VALIDATION.json'
          data=json.loads(p.read_text())
          audit=json.loads((root/'R7F_EVIDENCE/independent-portable-self-recording-v2.json').read_text())
          infra=json.loads((root/'R7F_EVIDENCE/independent-builder-infrastructure-replay.json').read_text())
          negatives={
            'tupleDigest':json.loads((root/'R7F_EVIDENCE/negative-tuple-digest.json').read_text()),
            'generatedPlan':json.loads((root/'R7F_EVIDENCE/negative-generated-plan.json').read_text()),
            'verifierSchema':json.loads((root/'R7F_EVIDENCE/negative-verifier-schema.json').read_text()),
            'tupleScope':json.loads((root/'R7F_EVIDENCE/negative-tuple-scope.json').read_text()),
          }
          checks=dict(data.get('checks') or {})
          checks.update({
            'portable-self-recording-independent-audit':audit.get('passed') is True,
            'portable-self-recording-audit-count':audit.get('metrics',{}).get('passedCheckCount')==audit.get('metrics',{}).get('checkCount'),
            'portable-nine-schema-files':audit.get('metrics',{}).get('schemaFileCount')==9,
            'portable-eight-compiled-schemas':audit.get('metrics',{}).get('compiledSchemaCount')==8,
            'portable-twelve-records':audit.get('metrics',{}).get('recordCount')==12,
            'generated-plan-eighteen-steps':audit.get('metrics',{}).get('executionStepCount')==18,
            'builder-infrastructure-independent-replay':infra.get('passed') is True,
            'lineage-manifest-directly-valid':(root/'R7F_EVIDENCE/r7e-v4-lineage-sha256sums.txt').is_file(),
            'tuple-digest-negative-rejected':negatives['tupleDigest'].get('passed') is False,
            'generated-plan-negative-rejected':negatives['generatedPlan'].get('passed') is False,
            'verifier-schema-negative-rejected':negatives['verifierSchema'].get('passed') is False,
            'tuple-scope-negative-rejected':negatives['tupleScope'].get('passed') is False,
            'bounded-r7-only-gate':(root/'R7F_GATE_DECISION.txt').read_text().strip()=='R7F PORTABLE SELF-RECORDING INDEPENDENT VERIFICATION COMPLETE — READY FOR HISTORY-BOUND CONTROLLER',
          })
          data.update({
            'schema':'R7F_PORTABLE_SELF_RECORDING_PACKAGE_VALIDATION_V2',
            'passed':all(checks.values()),
            'verificationVersion':'R7F-portable-self-recording-v2',
            'checks':checks,
            'failedChecks':[name for name,passed in checks.items() if not passed],
            'portableSelfRecordingEvidence':{
              'audit':'R7F_EVIDENCE/independent-portable-self-recording-v2.json',
              'r7eTuple':'R7F_EVIDENCE/r7e-portable-self-recording-v4-tuple.json',
              'builderReplay':'R7F_EVIDENCE/independent-builder-infrastructure-replay.json',
              'schemaTreeSha256':audit.get('schemaTreeSha256'),
            },
          })
          p.write_text(json.dumps(data,indent=2)+'\n')
          index_path=root/'R7F_EVIDENCE_INDEX.json'
          index=json.loads(index_path.read_text()) if index_path.exists() else {}
          index.update({
            'portableSelfRecordingAudit':'R7F_EVIDENCE/independent-portable-self-recording-v2.json',
            'r7ePortableSelfRecordingTuple':'R7F_EVIDENCE/r7e-portable-self-recording-v4-tuple.json',
            'r7eLineageManifest':'R7F_EVIDENCE/r7e-v4-lineage-sha256sums.txt',
            'builderInfrastructureReplay':'R7F_EVIDENCE/independent-builder-infrastructure-replay.json',
            'tupleDigestNegative':'R7F_EVIDENCE/negative-tuple-digest.json',
            'generatedPlanNegative':'R7F_EVIDENCE/negative-generated-plan.json',
            'verifierSchemaNegative':'R7F_EVIDENCE/negative-verifier-schema.json',
            'tupleScopeNegative':'R7F_EVIDENCE/negative-tuple-scope.json',
          })
          index_path.write_text(json.dumps(index,indent=2)+'\n')
          print(json.dumps({'passed':data['passed'],'failedChecks':data['failedChecks']},indent=2))
          if not data['passed']: raise SystemExit(1)
          PY
          rm -f artifact/R7F_ARTIFACT_SHA256SUMS.txt
          (
            cd artifact
            find . -type f ! -name 'R7F_ARTIFACT_SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > R7F_ARTIFACT_SHA256SUMS.txt
            sha256sum --check --strict R7F_ARTIFACT_SHA256SUMS.txt
          )

      - name: Upload R7F v2 evidence or diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7f-portable-self-recording-v2-evidence-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
          include-hidden-files: true
