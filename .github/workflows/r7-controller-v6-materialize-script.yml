name: Materialize exact history-bound controller v6

on:
  push:
    branches:
      - r7-history-bound-controller-v6-final-20260901
    paths:
      - '.github/workflows/r7-controller-v6-materialize-script.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r7-controller-v6-materialize-script
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout isolated controller branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Reconstruct and validate controller source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/scripts
          cat .github/r7-controller-v6/controller.part*.b64 | tr -d '\r\n' | base64 --decode | gzip --decompress > .github/scripts/r7-history-bound-controller-v6.py
          test "$(sha256sum .github/scripts/r7-history-bound-controller-v6.py | awk '{print $1}')" = 'b95b969a22301d8ec6b298cd03f7c3d2ce13b90096962095818465fabdd2a74e'
          python3 -m py_compile .github/scripts/r7-history-bound-controller-v6.py
          grep -q 'R7_HISTORY_BOUND_FINAL_CONTROLLER_V6' .github/scripts/r7-history-bound-controller-v6.py
          grep -q 'R7_HISTORY_BOUND_CONTROLLER_SELFTEST_V6' .github/scripts/r7-history-bound-controller-v6.py
          grep -q 'caseCount' .github/scripts/r7-history-bound-controller-v6.py

      - name: Commit exact controller source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/r7-history-bound-controller-v6.py
          git diff --cached --check
          git commit -m 'R7: add exact history-bound controller v6 implementation'
          git push origin HEAD:r7-history-bound-controller-v6-final-20260901
