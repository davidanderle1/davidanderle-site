name: Materialize current portable-schema R7F v3

on:
  push:
    branches:
      - r7f-portable-json-schema-v3-20260901
    paths:
      - '.github/workflows/r7f-portable-v3-materializer.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: r7f-portable-v3-materializer
  cancel-in-progress: false

env:
  TZ: UTC
  SOURCE_DATE_EPOCH: '1787961600'

jobs:
