            'stressDistTreeSha256':'005bfb51b3af3eca95153d5a5f912ef635e75b9b1f566350a53914faf4d29b41',
            'axeAdjudicationFileSha256':'8728f8c573cb967455c26e649acc42f4d850f4784abb0bd5766dddc4c9986ce9',
            'axeSemanticInventorySha256':'48cb39c9ba19a42bbfa5547b00629466c0207521afffc79f1c96d7be102256ef',
            'axeNodeSetSha256':'8b255e4a380b6740a84afb77aa4eada22db93683a685bb00754cf271ae856e9c',
            'axeBindingSetSha256':'6edbe91b0a595ec821f855434a0493dd8c438255e6435819e1702c4b6a6e53c8',
            'axeNodeCount':498,
            'portableIndexSha256':'19ec76fddec1791a47ccd555da6c67a65d7b8c00f7f0d0753c70cacbb9a322f1',
            'portableSchemaHashManifestSha256':'ea8139bac431eb45daface72723edbaf71f4a58c9e0c7f69d58d22d9bb1b50fb',
            'externalFullAuditSha256':'6cd5f06441a72d0b034d75b780efd649b8fe3325611632dfb407459e0b78b227',
          }

          audit = {
            'schema':'R7E_PORTABLE_JSON_SCHEMA_EXTERNAL_AUDIT_ATTESTATION_V1',
            'decision':'R7E_FULL_HISTORY_EXTERNAL_AUDIT_PASS',
            'passed':True,
            'builder':{
              'branch':builder['branch'],'workflowPath':builder['workflowPath'],
