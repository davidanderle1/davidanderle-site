            'builderSourceArchiveSha256':builder['sourceArchiveSha256'],
            'builderFrozenSourceTreeSha256':builder['frozenSourceTreeSha256'],
            'builderFrozenSourceTarSha256':builder['frozenSourceTarSha256'],
            'builderVerifiedDistTreeSha256':builder['verifiedDistTreeSha256'],
            'builderStressDistTreeSha256':builder['stressDistTreeSha256'],
            'builderAxeAdjudicationFileSha256':builder['axeAdjudicationFileSha256'],
            'builderAxeSemanticInventorySha256':builder['axeSemanticInventorySha256'],
            'builderAxeNodeFingerprintSetSha256':builder['axeNodeSetSha256'],
            'builderAxeBindingFingerprintSetSha256':builder['axeBindingSetSha256'],
