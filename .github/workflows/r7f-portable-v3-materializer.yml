            'branch':'r7e-portable-json-schema-verification-20260831',
            'workflowPath':'.github/workflows/r7e-portable-json-schema-verification.yml',
            'headSha':'9a8dfe79ddccbe43d73ac2d69a76529d6548290f',
            'runId':33486135005,
            'artifactId':9791961788,
            'artifactName':'r7e-portable-json-schema-evidence-9a8dfe79ddccbe43d73ac2d69a76529d6548290f',
            'artifactDigest':'sha256:c2a647f493de9293fc841bbe8d409ef4f4ad23040701c0fac4118784aab2a359',
