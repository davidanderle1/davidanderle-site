              'decision':'PASS','checkCount':66,'passedCheckCount':66,
            },
            'portableContract':{
              'dialect':'https://json-schema.org/draft/2020-12/schema',
              'version':'1.0.0','schemaJsonFileCount':9,'canonicalRecordCount':12,
              'invalidFixtureCount':29,'indexSha256':builder['portableIndexSha256'],
