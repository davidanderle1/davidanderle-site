concurrency:
  group: r7f-portable-v3-${{{{ github.ref }}}}
  cancel-in-progress: true

env:
  TZ: UTC
  SOURCE_DATE_EPOCH: '1787961600'
  NODE_OPTIONS: --max-old-space-size=4096
  BUILDER_BRANCH: {builder['branch']}
  BUILDER_WORKFLOW_PATH: {builder['workflowPath']}
  BUILDER_RUN_ID: '{builder['runId']}'
  BUILDER_COMMIT: {builder['headSha']}
