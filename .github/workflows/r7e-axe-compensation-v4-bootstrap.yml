name: R7E audited Axe compensation source bootstrap v4

on:
  push:
    branches:
      - r7e-hardened-verification-20260829
    paths:
      - '.github/workflows/r7e-axe-compensation-v4-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: UTC
  SOURCE_DATE_EPOCH: '1787961600'

jobs:
  bootstrap:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact R7E branch state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Repair browser-context width transport and deterministic repack
        shell: bash
        run: |
          set -euo pipefail
          rm -rf canonical /tmp/r7e-axe-v4-pack1 /tmp/r7e-axe-v4-pack2 /tmp/r7e-axe-v4-source1.zip /tmp/r7e-axe-v4-source2.zip
          mkdir canonical
          sha256sum --check --strict .r7e-source/SHA256SUMS
          cat .r7e-source/part*.b64 | tr -d '\r\n' | base64 --decode > /tmp/r7e-current-source.zip
          test "$(sha256sum /tmp/r7e-current-source.zip | awk '{print $1}')" = "$(tr -d '\r\n' < .r7e-source/ARCHIVE_SHA256)"
          unzip -q /tmp/r7e-current-source.zip -d canonical

          python3 - <<'PY'
          from pathlib import Path
          path = Path('canonical/tests/accessibility.spec.ts')
          text = path.read_text()
          replacements = [
              ("const measured = await page.locator('.bearing-list').evaluate((list) => {", "const measured = await page.locator('.bearing-list').evaluate((list, evaluatedWidth) => {"),
              ("desktopSignatureBelowList: width > 768 &&", "desktopSignatureBelowList: evaluatedWidth > 768 &&"),
              ("mobilePseudoBelowBackplates: width <= 768 &&", "mobilePseudoBelowBackplates: evaluatedWidth <= 768 &&"),
              ("    return { expectedBackground, elements, layers };\n  });\n  const expectedLayering = width > 768", "    return { expectedBackground, elements, layers };\n  }, width);\n  const expectedLayering = width > 768"),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'exact browser-context repair target count was {count}, expected 1: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          for needle in (
              "evaluate((list, evaluatedWidth) => {",
              'desktopSignatureBelowList: evaluatedWidth > 768',
              'mobilePseudoBelowBackplates: evaluatedWidth <= 768',
              '}, width);',
              'R7E_BEARING_ROUTE_BACKPLATE_V1',
          ):
              if needle not in text:
                  raise SystemExit(f'missing post-repair marker: {needle}')
          print({'repaired': True, 'bytes': len(text.encode())})
          PY

          python3 .github/scripts/r7e-pack-source.py canonical /tmp/r7e-axe-v4-pack1 --archive /tmp/r7e-axe-v4-source1.zip
          python3 .github/scripts/r7e-pack-source.py canonical /tmp/r7e-axe-v4-pack2 --archive /tmp/r7e-axe-v4-source2.zip
          cmp /tmp/r7e-axe-v4-source1.zip /tmp/r7e-axe-v4-source2.zip
          diff -ru /tmp/r7e-axe-v4-pack1 /tmp/r7e-axe-v4-pack2
          rm -rf .r7e-source
          mkdir .r7e-source
          cp -a /tmp/r7e-axe-v4-pack1/. .r7e-source/
          cp .r7e-source/ARCHIVE_SHA256 .r7e-source/HARDENED_SOURCE_READY
          sha256sum --check --strict .r7e-source/SHA256SUMS
          printf 'new_source_archive_sha256=%s\n' "$(cat .r7e-source/ARCHIVE_SHA256)"

      - name: Commit immutable browser-safe audited-Axe source transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .r7e-source
          if git diff --cached --quiet -- .r7e-source; then
            echo 'BROWSER_SAFE_AUDITED_AXE_SOURCE_ALREADY_CURRENT'
            exit 0
          fi
          git commit -m 'R7E: freeze browser-safe audited Axe compensation source'
          git push origin HEAD:r7e-hardened-verification-20260829
