name: Bootstrap exact R7E v4 pin for final R7F v2

on:
  push:
    branches:
      - r7f-portable-final-20260901
    paths:
      - '.github/workflows/r7f-pin-authoritative-r7e-v4-bootstrap-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r7f-pin-authoritative-r7e-v4-bootstrap-v2
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout final R7F branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Apply and validate exact R7E v4 pin
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/patch-r7f-final-to-r7e-v4.py
          python3 .github/scripts/patch-r7f-final-to-r7e-v4.py
          ruby -ryaml -e 'YAML.safe_load(File.read(ARGV[0]), aliases: true)' .github/workflows/r7f-portable-final-verification.yml
          grep -q 'R7E_BRANCH: r7e-portable-self-recording-final-20260901' .github/workflows/r7f-portable-final-verification.yml
          grep -q 'R7E_PORTABLE_SELF_RECORDING_AUTHORITATIVE_TUPLE_V4' .github/workflows/r7f-portable-final-verification.yml
          grep -q 'r7e-authoritative-tuple-v4.json' .github/workflows/r7f-portable-final-verification.yml
          ! grep -q 'r7e-portable-json-schema-evidence-$head_sha' .github/workflows/r7f-portable-final-verification.yml

      - name: Commit pinned final R7F workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/r7f-portable-final-verification.yml
          test -n "$(git diff --cached --name-only)"
          git diff --cached --check
          git commit -m 'R7F: pin exact authoritative R7E v4 evidence and lineage'
          git push origin HEAD:r7f-portable-final-20260901
