name: R7F portable JSON Schema independent verifier v2

on:
  push:
    branches:
      - r7f-portable-authoritative-v2-20260901
    paths:
      - '.github/workflows/r7f-portable-authoritative-v2.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: r7f-portable-authoritative-v2
  cancel-in-progress: false

env:
  TZ: UTC
  SOURCE_DATE_EPOCH: '1787961600'
  NODE_OPTIONS: --max-old-space-size=4096
  R7E_BRANCH: r7e-portable-json-schema-verification-20260831
  R7E_STATUS_PATH: .github/r7-status/portable-r7e-v2.json
  R7F_ARTIFACT_PREFIX: r7f-portable-authoritative-v2-evidence

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact independent verifier commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Install exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0

      - name: Acquire exact successful portable R7E tuple and artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p r7f-input r7f-evidence r7f-artifact
          encoded=''
          for attempt in $(seq 1 120); do
            encoded="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${R7E_STATUS_PATH}?ref=${R7E_BRANCH}" --jq '.content' 2>/dev/null || true)"
            if test -n "$encoded"; then break; fi
            sleep 15
          done
          test -n "$encoded"
          printf '%s' "$encoded" | tr -d '\n' | base64 --decode > r7f-input/R7E_TUPLE.json
          jq -e '
            .schema=="R7E_PORTABLE_JSON_SCHEMA_AUTHORITATIVE_TUPLE_V2" and
            .passed==true and
            .branch=="r7e-portable-json-schema-verification-20260831" and
            .sourceArchiveSha256=="764271738ad8578de7d89c522d9cedd1a22ce00d1b8e5d06b271903b52a3923d" and
            .sourceFileCount==146 and
            .portableSchema.dialect=="https://json-schema.org/draft/2020-12/schema" and
            .portableSchema.contractVersion=="1.0.0" and
            (.artifact.digest|startswith("sha256:"))
          ' r7f-input/R7E_TUPLE.json >/dev/null
          run_id="$(jq -r '.runId' r7f-input/R7E_TUPLE.json)"
          commit="$(jq -r '.commit' r7f-input/R7E_TUPLE.json)"
          artifact_id="$(jq -r '.artifact.id' r7f-input/R7E_TUPLE.json)"
          artifact_name="$(jq -r '.artifact.name' r7f-input/R7E_TUPLE.json)"
          artifact_digest="$(jq -r '.artifact.digest' r7f-input/R7E_TUPLE.json)"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > r7f-input/R7E_RUN_METADATA.json
          jq -e --arg commit "$commit" '
            .status=="completed" and .conclusion=="success" and .head_sha==$commit and
            .head_branch=="r7e-portable-json-schema-verification-20260831"
          ' r7f-input/R7E_RUN_METADATA.json >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" > r7f-input/R7E_ARTIFACT_METADATA.json
          jq -e --arg name "$artifact_name" --arg digest "$artifact_digest" --argjson run "$run_id" '
            .name==$name and .digest==$digest and .expired==false and .workflow_run.id==$run
          ' r7f-input/R7E_ARTIFACT_METADATA.json >/dev/null
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            --output r7f-input/R7E_AUTHORITATIVE.zip
          printf '%s  %s\n' "${artifact_digest#sha256:}" r7f-input/R7E_AUTHORITATIVE.zip | sha256sum --check --strict
          sha256sum \
            .github/workflows/r7f-portable-authoritative-v2.yml \
            .github/scripts/r7f-portable-v2-preaudit.py \
            .github/scripts/r7f-portable-v2-tree.py \
            .github/scripts/r7f-portable-v2-browser.mjs \
            > r7f-evidence/verifier-infrastructure.sha256

      - name: Independently audit and extract R7E artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/r7f-portable-v2-preaudit.py \
            --zip r7f-input/R7E_AUTHORITATIVE.zip \
            --tuple r7f-input/R7E_TUPLE.json \
            --extract r7f-input/extracted \
            --source-copy r7f-input/candidate-source \
            --report r7f-evidence/R7E_PREAUDIT.json \
            > r7f-evidence/R7E_PREAUDIT.stdout.txt
          jq -e '.passed==true and .sourceFileCount==146 and .checks["schema-file-count"]==true' r7f-evidence/R7E_PREAUDIT.json >/dev/null

      - name: Perform two independent clean installs and builds
        shell: bash
        run: |
          set -euo pipefail
          for number in 1 2; do
            run="r7f-input/run${number}"
            rm -rf "$run"
            cp -a r7f-input/candidate-source "$run"
            (
              cd "$run"
              test "$(node --version)" = 'v24.20.0'
              test "$(npm --version)" = '11.19.0'
              npm ci --audit=false --fund=false > "../../../r7f-evidence/run${number}-npm-ci.stdout.txt" 2> "../../../r7f-evidence/run${number}-npm-ci.stderr.txt"
              rm -rf dist .astro .r7e-tmp public/assets/portrait public/assets/js public/artifacts src/data/generated
              npm run preflight:workspace > "../../../r7f-evidence/run${number}-preflight.stdout.txt" 2> "../../../r7f-evidence/run${number}-preflight.stderr.txt"
              npm run schema:check > "../../../r7f-evidence/run${number}-schema-check.stdout.txt" 2> "../../../r7f-evidence/run${number}-schema-check.stderr.txt"
              npm run schema:contract > "../../../r7f-evidence/run${number}-schema-contract.stdout.txt" 2> "../../../r7f-evidence/run${number}-schema-contract.stderr.txt"
              npm run validate:fixtures > "../../../r7f-evidence/run${number}-fixtures.stdout.txt" 2> "../../../r7f-evidence/run${number}-fixtures.stderr.txt"
              test "$(grep -c 'EXPECTED FAILURE (exit 1)' "../../../r7f-evidence/run${number}-fixtures.stdout.txt")" -eq 29
              ! grep -q 'UNEXPECTED' "../../../r7f-evidence/run${number}-fixtures.stdout.txt"
              npm run prepare > "../../../r7f-evidence/run${number}-prepare.stdout.txt" 2> "../../../r7f-evidence/run${number}-prepare.stderr.txt"
              npm run check:astro > "../../../r7f-evidence/run${number}-astro.stdout.txt" 2> "../../../r7f-evidence/run${number}-astro.stderr.txt"
              grep -q -- '- 0 errors' "../../../r7f-evidence/run${number}-astro.stdout.txt"
              grep -q -- '- 0 warnings' "../../../r7f-evidence/run${number}-astro.stdout.txt"
              grep -q -- '- 0 hints' "../../../r7f-evidence/run${number}-astro.stdout.txt"
              npm run build > "../../../r7f-evidence/run${number}-build.stdout.txt" 2> "../../../r7f-evidence/run${number}-build.stderr.txt"
              test -f dist/index.html
            )
            python3 .github/scripts/r7f-portable-v2-tree.py "$run/dist" "r7f-evidence/run${number}-dist-tree.json"
          done
          test "$(jq -r '.treeSha256' r7f-evidence/run1-dist-tree.json)" = "$(jq -r '.treeSha256' r7f-evidence/run2-dist-tree.json)"
          test "$(jq -r '.fileCount' r7f-evidence/run1-dist-tree.json)" -eq 34
          jq -n \
            --arg tree "$(jq -r '.treeSha256' r7f-evidence/run1-dist-tree.json)" \
            --argjson files "$(jq -r '.fileCount' r7f-evidence/run1-dist-tree.json)" \
            '{schema:"R7F_REPRODUCIBILITY_V2",passed:true,treeSha256:$tree,fileCount:$files}' \
            > r7f-evidence/REPRODUCIBILITY.json

      - name: Independently exercise browser matrix accessibility JavaScript and network boundaries
        shell: bash
        run: |
          set -euo pipefail
          cd r7f-input/run1
          npx --no-install playwright install --with-deps chromium firefox webkit \
            > ../../../r7f-evidence/playwright-install.stdout.txt \
            2> ../../../r7f-evidence/playwright-install.stderr.txt
          python3 -m http.server 4321 --bind 127.0.0.1 --directory dist \
            > ../../../r7f-evidence/server.stdout.txt \
            2> ../../../r7f-evidence/server.stderr.txt &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4321/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4321/ >/dev/null
          node "$GITHUB_WORKSPACE/.github/scripts/r7f-portable-v2-browser.mjs" \
            http://127.0.0.1:4321 \
            "$GITHUB_WORKSPACE/r7f-evidence/BROWSER_AUDIT.json" \
            > "$GITHUB_WORKSPACE/r7f-evidence/browser-audit.stdout.txt" \
            2> "$GITHUB_WORKSPACE/r7f-evidence/browser-audit.stderr.txt"
          jq -e '.passed==true and .metrics.pageChecks==168 and .metrics.axeViolationCount==0 and .metrics.offOriginRequestCount==0' \
            "$GITHUB_WORKSPACE/r7f-evidence/BROWSER_AUDIT.json" >/dev/null
          kill "$server_pid"
          wait "$server_pid" 2>/dev/null || true
          trap - EXIT

      - name: Independently measure Lighthouse and Cloudflare dry-run posture
        shell: bash
        run: |
          set -euo pipefail
          cd r7f-input/run1
          mkdir -p "$GITHUB_WORKSPACE/r7f-evidence/lighthouse" "$GITHUB_WORKSPACE/r7f-evidence/wrangler"
          python3 -m http.server 4322 --bind 127.0.0.1 --directory dist \
            > "$GITHUB_WORKSPACE/r7f-evidence/lighthouse-server.stdout.txt" \
            2> "$GITHUB_WORKSPACE/r7f-evidence/lighthouse-server.stderr.txt" &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4322/ >/dev/null; then break; fi
            sleep 1
          done
          export CHROME_PATH="$(node --input-type=module -e "import { chromium } from 'playwright'; console.log(chromium.executablePath())")"
          for spec in \
            'home|/' \
            'work|/work/' \
            'vce|/work/volatility-cascade-engine/' \
            'writing|/writing/'; do
            name="${spec%%|*}"
            route="${spec#*|}"
            npx --no-install lighthouse "http://127.0.0.1:4322${route}" \
              --quiet \
              --output=json \
              --output-path="$GITHUB_WORKSPACE/r7f-evidence/lighthouse/${name}.json" \
              --chrome-flags='--headless=new --no-sandbox --disable-dev-shm-usage' \
              > "$GITHUB_WORKSPACE/r7f-evidence/lighthouse/${name}.stdout.txt" \
              2> "$GITHUB_WORKSPACE/r7f-evidence/lighthouse/${name}.stderr.txt"
          done
          kill "$server_pid"
          wait "$server_pid" 2>/dev/null || true
          trap - EXIT
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('r7f-evidence/lighthouse')
          rows=[]
          failed=[]
          for path in sorted(root.glob('*.json')):
              data=json.loads(path.read_text())
              scores={name:round(category['score'],3) for name,category in data['categories'].items() if name in {'performance','accessibility','best-practices','seo'}}
              row={'file':path.name,'scores':scores}
              rows.append(row)
              for category,minimum in {'performance':0.90,'accessibility':0.95,'best-practices':0.90,'seo':0.90}.items():
                  if scores.get(category,0)<minimum: failed.append({'file':path.name,'category':category,'score':scores.get(category),'minimum':minimum})
          report={'schema':'R7F_LIGHTHOUSE_V2','passed':not failed,'reportCount':len(rows),'reports':rows,'failed':failed}
          Path('r7f-evidence/LIGHTHOUSE_AUDIT.json').write_text(json.dumps(report,indent=2)+'\n')
          if len(rows)!=4 or failed: raise SystemExit(json.dumps(report,indent=2))
          PY
          (
            cd r7f-input/run1
            npx --no-install wrangler deploy --dry-run --outdir "$GITHUB_WORKSPACE/r7f-evidence/wrangler" \
              > "$GITHUB_WORKSPACE/r7f-evidence/wrangler.stdout.txt" \
              2> "$GITHUB_WORKSPACE/r7f-evidence/wrangler.stderr.txt"
          )
          test -n "$(find r7f-evidence/wrangler -type f -print -quit)"
          find r7f-evidence/wrangler -type f -print | sort > r7f-evidence/wrangler-files.txt

      - name: Exercise 500-record scale and portable schema validation
        shell: bash
        run: |
          set -euo pipefail
          cd r7f-input/run1
          npm run test:stress \
            > ../../../r7f-evidence/stress.stdout.txt \
            2> ../../../r7f-evidence/stress.stderr.txt
          npm run schema:validate:stress \
            > ../../../r7f-evidence/stress-schema.stdout.txt \
            2> ../../../r7f-evidence/stress-schema.stderr.txt
          test "$(find .r7e-tmp/stress/content/work -maxdepth 1 -type f -name '*.md' | wc -l)" -eq 500
          test "$(find .r7e-tmp/stress/dist/work -mindepth 2 -maxdepth 2 -type f -name 'index.html' | wc -l)" -ge 500
          cd "$GITHUB_WORKSPACE"
          python3 .github/scripts/r7f-portable-v2-tree.py \
            r7f-input/run1/.r7e-tmp/stress/dist \
            r7f-evidence/STRESS_DIST_TREE.json
          jq -e '.fileCount>=534' r7f-evidence/STRESS_DIST_TREE.json >/dev/null

      - name: Assemble immutable independent R7F evidence
        shell: bash
        run: |
          set -euo pipefail
          cp r7f-input/R7E_TUPLE.json r7f-artifact/
          cp r7f-input/R7E_RUN_METADATA.json r7f-artifact/
          cp r7f-input/R7E_ARTIFACT_METADATA.json r7f-artifact/
          cp -a r7f-evidence/. r7f-artifact/
          cp r7f-input/candidate-source/schemas/*.json r7f-artifact/
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('r7f-artifact')
          pre=json.loads((root/'R7E_PREAUDIT.json').read_text())
          rep=json.loads((root/'REPRODUCIBILITY.json').read_text())
          browser=json.loads((root/'BROWSER_AUDIT.json').read_text())
          lighthouse=json.loads((root/'LIGHTHOUSE_AUDIT.json').read_text())
          stress=json.loads((root/'STRESS_DIST_TREE.json').read_text())
          tuple_data=json.loads((root/'R7E_TUPLE.json').read_text())
          checks={
              'r7e-tuple':tuple_data.get('passed') is True,
              'r7e-outer-and-inner-artifact-audit':pre.get('passed') is True,
              'portable-draft-2020-12':pre.get('checks',{}).get('schema-index-dialect') is True,
              'portable-schema-set-nine-files':pre.get('checks',{}).get('schema-file-count') is True,
              'ajv-exact-pin':pre.get('checks',{}).get('ajv-lock-pin') is True,
              'two-clean-builds-byte-tree-identical':rep.get('passed') is True,
              'production-dist-34-files':rep.get('fileCount')==34,
              'browser-matrix-168':browser.get('metrics',{}).get('pageChecks')==168,
              'axe-zero-violations':browser.get('metrics',{}).get('axeViolationCount')==0,
              'network-zero-off-origin':browser.get('metrics',{}).get('offOriginRequestCount')==0,
              'lighthouse-four-reports':lighthouse.get('passed') is True and lighthouse.get('reportCount')==4,
              'stress-output-at-least-534-files':stress.get('fileCount',0)>=534,
          }
          failed=[name for name,passed in checks.items() if not passed]
          decision={
              'schema':'R7F_PORTABLE_JSON_SCHEMA_INDEPENDENT_DECISION_V2',
              'passed':not failed,
              'decision':'R7F_PORTABLE_INDEPENDENT_PASS' if not failed else 'R7F_PORTABLE_INDEPENDENT_FAIL',
              'repository':os.environ['GITHUB_REPOSITORY'],
              'verifier':{'commit':os.environ['GITHUB_SHA'],'runId':int(os.environ['GITHUB_RUN_ID']),'runAttempt':int(os.environ['GITHUB_RUN_ATTEMPT'])},
              'builder':tuple_data,
              'checks':checks,
              'failedChecks':failed,
              'metrics':{
                  'sourceFileCount':pre.get('sourceFileCount'),
                  'internalR7EManifestEntries':pre.get('internalManifestEntryCount'),
                  'productionDistFiles':rep.get('fileCount'),
                  'browserPageChecks':browser.get('metrics',{}).get('pageChecks'),
                  'axeViolationCount':browser.get('metrics',{}).get('axeViolationCount'),
                  'independentAxeIncompleteNodes':browser.get('metrics',{}).get('axeIncompleteNodeCount'),
                  'lighthouseReports':lighthouse.get('reportCount'),
                  'stressDistFiles':stress.get('fileCount'),
              },
              'scope':'Independent R7 technical architecture verification only; no whole-site completion, main mutation, or deployment approval',
          }
          (root/'R7F_PORTABLE_V2_DECISION.json').write_text(json.dumps(decision,indent=2)+'\n')
          if failed: raise SystemExit(json.dumps(decision,indent=2))
          rows=[]
          for path in sorted((p for p in root.rglob('*') if p.is_file() and p.name!='R7F_ARTIFACT_SHA256SUMS.txt'),key=lambda p:p.relative_to(root).as_posix().encode()):
              rows.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(root).as_posix()}")
          (root/'R7F_ARTIFACT_SHA256SUMS.txt').write_text('\n'.join(rows)+'\n')
          PY
          jq -e '.passed==true and .decision=="R7F_PORTABLE_INDEPENDENT_PASS"' r7f-artifact/R7F_PORTABLE_V2_DECISION.json >/dev/null
          (
            cd r7f-artifact
            sha256sum --check --strict R7F_ARTIFACT_SHA256SUMS.txt
          )

      - name: Upload authoritative independent R7F evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7f-portable-authoritative-v2-evidence-${{ github.sha }}
          path: r7f-artifact/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
          include-hidden-files: true

      - name: Persist exact authoritative R7F tuple
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_name="${R7F_ARTIFACT_PREFIX}-${GITHUB_SHA}"
          artifact_row=''
          for attempt in $(seq 1 12); do
            artifact_row="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --paginate \
              | jq -cs --arg name "$artifact_name" '[.[].artifacts[] | select(.name==$name)] | if length==1 then .[0] else empty end')"
            if test -n "$artifact_row"; then break; fi
            sleep 2
          done
          test -n "$artifact_row"
          artifact_id="$(jq -r '.id' <<<"$artifact_row")"
          artifact_digest="$(jq -r '.digest' <<<"$artifact_row")"
          test "$artifact_digest" != 'null'
          mkdir -p .github/r7-status
          jq -n \
            --arg schema 'R7F_PORTABLE_JSON_SCHEMA_AUTHORITATIVE_TUPLE_V2' \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg commit "$GITHUB_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg artifactName "$artifact_name" \
            --arg artifactId "$artifact_id" \
            --arg artifactDigest "$artifact_digest" \
            --arg decisionSha256 "$(sha256sum r7f-artifact/R7F_PORTABLE_V2_DECISION.json | awk '{print $1}')" \
            --arg builderCommit "$(jq -r '.commit' r7f-input/R7E_TUPLE.json)" \
            --arg builderArtifactDigest "$(jq -r '.artifact.digest' r7f-input/R7E_TUPLE.json)" \
            '{schema:$schema,passed:true,repository:$repository,branch:$branch,commit:$commit,runId:($runId|tonumber),runAttempt:($runAttempt|tonumber),artifact:{id:($artifactId|tonumber),name:$artifactName,digest:$artifactDigest},decisionSha256:$decisionSha256,builder:{commit:$builderCommit,artifactDigest:$builderArtifactDigest},scope:"Independent R7 technical architecture verification only"}' \
            > .github/r7-status/portable-r7f-v2.json
          jq -e '.passed==true and (.artifact.digest|startswith("sha256:"))' .github/r7-status/portable-r7f-v2.json >/dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/r7-status/portable-r7f-v2.json
          git diff --cached --check
          git commit -m 'R7F: record exact portable independent tuple'
          git push origin HEAD:r7f-portable-authoritative-v2-20260901

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7f-portable-authoritative-v2-failure-${{ github.sha }}
          path: |
            r7f-input/
            r7f-evidence/
            r7f-artifact/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
          include-hidden-files: true
