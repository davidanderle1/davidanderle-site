name: R7E Bearing production reference evidence v6

on:
  push:
    branches:
      - r7e-reference-build-20260829
    paths:
      - 'r7e/**'
      - .github/workflows/r7e-production-reference-v6.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r7e-bearing-production-reference-v6
  cancel-in-progress: false

jobs:
  build-and-measure:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TZ: UTC
      SOURCE_DATE_EPOCH: '1787961600'
      NODE_OPTIONS: '--max-old-space-size=4096'
      R7E_APPROVED_PORTRAIT_SHA256: '821af5978918ac642c339da72153a584e59a0e92d47eede87290a5025a1ddc51'
    steps:
      - name: Checkout isolated R7E branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Install exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'

      - name: Materialize exact R5-authorized portrait source
        run: |
          mkdir -p r7e/authority/input
          base64 --decode r7e/authority/david-anderle-headshot-320.webp.b64 > r7e/authority/input/david-anderle-headshot-320.webp
          printf '%s  %s\n' "$R7E_APPROVED_PORTRAIT_SHA256" 'r7e/authority/input/david-anderle-headshot-320.webp' | sha256sum --check --strict

      - name: Execute native R7E v6 programme
        run: |
          sed 's/reference_builder_v2.py/reference_builder_v6.py/g' r7e/run_full_v2.sh > /tmp/run-r7e-v6.sh
          bash /tmp/run-r7e-v6.sh

      - name: Preserve generated artifact while synchronizing isolated branch
        run: |
          mkdir -p /tmp/r7e-v6-output
          cp -a R7E_OUTPUT/. /tmp/r7e-v6-output/
          git fetch origin r7e-reference-build-20260829
          git reset --hard origin/r7e-reference-build-20260829
          rm -rf R7E_OUTPUT
          mkdir -p R7E_OUTPUT
          cp -a /tmp/r7e-v6-output/. R7E_OUTPUT/

      - name: Commit audit artifact only to isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f R7E_OUTPUT/DAVID_ANDERLE_R7E_PRODUCTION_REFERENCE_COMPLETE.zip
          git add -f R7E_OUTPUT/DAVID_ANDERLE_R7E_PRODUCTION_REFERENCE_COMPLETE.zip.sha256
          git add -f R7E_OUTPUT/R7E_OUTPUT_SUMMARY.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(r7e): publish v6 raw audit artifact [skip ci]'
            git push origin HEAD:r7e-reference-build-20260829
          fi

      - name: Upload immutable workflow artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: david-anderle-r7e-production-reference-v6
          path: |
            R7E_OUTPUT/DAVID_ANDERLE_R7E_PRODUCTION_REFERENCE_COMPLETE.zip
            R7E_OUTPUT/DAVID_ANDERLE_R7E_PRODUCTION_REFERENCE_COMPLETE.zip.sha256
            R7E_OUTPUT/R7E_OUTPUT_SUMMARY.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic source and evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: david-anderle-r7e-v6-diagnostics
          path: |
            BEARING_PRODUCTION_SOURCE
            R7E_BOOTSTRAP_EVIDENCE
            r7e/authority/R5_PORTRAIT_AUTHORITY.json
          if-no-files-found: warn
          retention-days: 7
