name: R7E assemble hardened verifier workflow

on:
  push:
    branches:
      - r7e-hardened-verification-20260829
    paths:
      - '.github/workflows/r7e-assemble-verifier.yml'
      - '.github/workflow-parts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout hardened branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Assemble exact verifier workflow outside workflows directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/generated
          cat .github/workflow-parts/r7e-hardened-verification.yml.* > .github/generated/r7e-hardened-verification.yml
          test -s .github/generated/r7e-hardened-verification.yml
          grep -q '^name: R7E hardened native Astro verification$' .github/generated/r7e-hardened-verification.yml
          grep -q 'Pre-assembly immutability and chain-of-custody gate' .github/generated/r7e-hardened-verification.yml
          sha256sum .github/generated/r7e-hardened-verification.yml

      - name: Commit generated verifier content
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/generated/r7e-hardened-verification.yml
          git commit -m 'R7E: stage exact hardened verifier content'
          git push origin HEAD:r7e-hardened-verification-20260829
