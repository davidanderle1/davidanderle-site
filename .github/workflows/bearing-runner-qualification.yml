    steps:
    - name: Prepare hash-pinned distro Bubblewrap executable
      shell: bash
      run: "set -euo pipefail\n# Bootstrap one hash-pinned distro executable in this disposable GitHub VM.\n# No package maintainer\
        \ scripts, sysctl writes, profile changes or candidate code.\ntest \"$(id -u)\" != 0\ntest ! -e /usr/bin/bwrap\ntest\
        \ ! -L /usr/bin/bwrap\nsetup_dir=$(mktemp -d)\ncurl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time\
