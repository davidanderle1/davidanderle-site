        \   raise SystemExit(run(Path(args.paths[0]).absolute()))\nBEARING_PROBE_PY\nprintf '%s  %s\\n' 'f2a837fe2db4751971adbfd492de5b723d906698b18bdbc3d06be7a7f5760f07'\
