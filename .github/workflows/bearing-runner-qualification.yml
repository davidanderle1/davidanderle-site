name: BEARING R8 runner capability qualification
'on':
  push:
    branches:
    - codex/r8-runner-qualification-20260920-r3
    paths:
    - .github/workflows/bearing-runner-qualification.yml
permissions: {}
concurrency:
  group: bearing-r8-runner-qualification-20260920-r3
  cancel-in-progress: false
jobs:
  probe-a:
    if: ${{ github.repository_id == '1186790949' && github.event_name == 'push' && github.ref == 'refs/heads/codex/r8-runner-qualification-20260920-r3'
      && github.run_attempt == 1 && github.event.created == true && github.event.deleted == false && github.event.before ==
      '0000000000000000000000000000000000000000' }}
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 5
    outputs:
      passed: ${{ steps.probe.outputs.passed }}
      boot_id_sha256: ${{ steps.probe.outputs.boot_id_sha256 }}
      report_sha256: ${{ steps.probe.outputs.report_sha256 }}
    steps:
    - name: Prepare hash-pinned distro Bubblewrap executable
      shell: bash
      run: "set -euo pipefail\n# Bootstrap one hash-pinned distro executable in this disposable GitHub VM.\n# No package maintainer\
        \ scripts, sysctl writes, profile changes or candidate code.\ntest \"$(id -u)\" != 0\ntest ! -e /usr/bin/bwrap\ntest\
        \ ! -L /usr/bin/bwrap\nsetup_dir=$(mktemp -d)\ncurl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time\
        \ 60 \\\n  'https://security.ubuntu.com/ubuntu/pool/main/b/bubblewrap/bubblewrap_0.9.0-1ubuntu0.3_amd64.deb' \\\n\
        \  --output \"$setup_dir/bubblewrap.deb\"\nprintf '%s  %s\\n' '2461f1beee9cb04c8942739fe1a2b37e7b7c2a3d518f0779dc75f9245baa3094'\
        \ \"$setup_dir/bubblewrap.deb\" | sha256sum --check --status\ndpkg-deb --extract \"$setup_dir/bubblewrap.deb\" \"\
        $setup_dir/extracted\"\nprintf '%s  %s\\n' 'e318903862396f96de3df57264e0158682b952fd3fb53ac23d876413e7b30f71' \"$setup_dir/extracted/usr/bin/bwrap\"\
        \ | sha256sum --check --status\ntest -f \"$setup_dir/extracted/usr/bin/bwrap\"\ntest ! -L \"$setup_dir/extracted/usr/bin/bwrap\"\
        \nsudo -n /usr/bin/install --owner=root --group=root --mode=0755 -- \"$setup_dir/extracted/usr/bin/bwrap\" /usr/bin/bwrap\n\
        printf '%s  %s\\n' 'e318903862396f96de3df57264e0158682b952fd3fb53ac23d876413e7b30f71' /usr/bin/bwrap | sha256sum --check\
        \ --status\n/usr/bin/bwrap --version\n"
    - name: Fixed isolation capability probe
      id: probe
      shell: bash
      run: "set -euo pipefail\nprobe_dir=$(mktemp -d)\ncat > \"$probe_dir/probe.py\" <<'BEARING_PROBE_PY'\n\"\"\"Fixed, non-production\
        \ Linux isolation capability probe. No product checkout.\"\"\"\nimport argparse\nimport errno\nimport hashlib\nimport\
        \ json\nimport os\nimport platform\nimport re\nimport shutil\nimport socket\nimport subprocess\nimport sys\nimport\
        \ tempfile\nimport uuid\nimport stat\nfrom pathlib import Path\n\nSCHEMA = 'BEARING_RUNNER_CAPABILITY_V3'\nNS = ('user',\
        \ 'mnt', 'net', 'pid', 'ipc', 'uts')\nRUNTIME = ('/usr/bin', '/usr/lib/x86_64-linux-gnu', '/usr/lib/python3.12', '/usr/lib64')\n\
        CLEAN = {'PATH': '/usr/bin:/bin', 'LC_ALL': 'C.UTF-8', 'TZ': 'UTC', 'TMPDIR': '/tmp'}\nBRANCH = 'refs/heads/codex/r8-runner-qualification-20260920-r3'\n\
        \ndef require(ok, code):\n    if not ok:\n        raise RuntimeError(code)\n\ndef sha(raw):\n    return hashlib.sha256(raw).hexdigest()\n\
        \ndef encoded(value):\n    return (json.dumps(value, sort_keys=True, indent=2, allow_nan=False) + '\\n').encode()\n\
        \ndef namespaces():\n    return {name: os.readlink('/proc/self/ns/' + name) for name in NS}\n\ndef host_policy():\n\
        \    result = {'uid': os.geteuid(), 'gid': os.getegid(), 'sysctl': {}, 'process_status': {}}\n    for name in ('kernel/apparmor_restrict_unprivileged_userns',\
        \ 'kernel/unprivileged_userns_clone', 'user/max_user_namespaces'):\n        path = Path('/proc/sys') / name\n    \
        \    if path.exists():\n            value = path.read_text().strip()\n            require(re.fullmatch('[0-9]{1,12}',\
        \ value), 'SYSCTL_FORMAT')\n            result['sysctl'][name] = int(value)\n        else:\n            result['sysctl'][name]\
        \ = None\n    for line in Path('/proc/self/status').read_text().splitlines():\n        key, _, value = line.partition(':')\n\
        \        if key in ('CapEff', 'CapBnd', 'NoNewPrivs', 'Seccomp'):\n            value = value.strip()\n           \
        \ require(re.fullmatch('[0-9a-f]{1,16}', value), 'STATUS_FORMAT')\n            result['process_status'][key] = value\n\
        \    try:\n        value = Path('/proc/self/attr/current').read_text().strip()\n        result['apparmor_label'] =\
        \ value if re.fullmatch('[A-Za-z0-9_./ ():-]{1,200}', value) else 'UNRECOGNIZED'\n    except OSError:\n        result['apparmor_label']\
        \ = 'UNAVAILABLE'\n    return result\n\ndef diagnostic(stderr):\n    known = {\n        b'unshare: write failed /proc/self/uid_map:\
        \ Operation not permitted\\n': 'UID_MAP_EPERM',\n        b'unshare: unshare failed: Operation not permitted\\n': 'UNSHARE_EPERM',\n\
        \        b'bwrap: No permissions to create new namespace, likely because the kernel does not allow non-privileged\
        \ user namespaces. On e.g. debian this can be enabled with \\'sysctl kernel.unprivileged_userns_clone=1\\'.\\n': 'BWRAP_USERNS_DENIED',\n\
        \    }\n    return known.get(stderr, 'EMPTY' if not stderr else 'UNCLASSIFIED_STDERR')\n\ndef bubblewrap_command(control,\
        \ output):\n    command = ['/usr/bin/bwrap', '--unshare-user', '--unshare-pid', '--unshare-net', '--unshare-ipc',\
        \ '--unshare-uts',\n               '--uid', '0', '--gid', '0', '--die-with-parent', '--new-session', '--cap-drop',\
        \ 'ALL', '--clearenv',\n               '--size', '67108864', '--tmpfs', '/']\n    for name, value in CLEAN.items():\n\
        \        command += ['--setenv', name, value]\n    for path in RUNTIME:\n        command += ['--ro-bind', path, path]\n\
        \    for name, target in [('bin', 'usr/bin'), ('lib', 'usr/lib'), ('lib64', 'usr/lib64')]:\n        command += ['--symlink',\
        \ target, '/' + name]\n    command += ['--ro-bind', str(control), '/control', '--bind', str(output), '/output', '--dir',\
        \ '/work',\n                '--size', '33554432', '--tmpfs', '/tmp', '--dir', '/dev', '--dir', '/etc',\n         \
        \       '--proc', '/proc', '--remount-ro', '/proc']\n    for name in ('null', 'zero', 'urandom', 'random'):\n    \
        \    command += ['--dev-bind', '/dev/' + name, '/dev/' + name]\n    for name in ('resolv.conf', 'nsswitch.conf', 'ld.so.cache'):\n\
        \        if Path('/etc', name).is_file():\n            command += ['--ro-bind', '/etc/' + name, '/etc/' + name]\n\
        \    command += ['--ro-bind', str(control / 'hosts'), '/etc/hosts', '--chdir', '/work',\n                '/usr/bin/python3',\
        \ '-I', '-B', '/control/probe.py', 'inside']\n    return command\n\ndef connect(family, port):\n    with socket.socket(family,\
        \ socket.SOCK_STREAM) as s:\n        s.settimeout(2)\n        s.connect(('127.0.0.1' if family == socket.AF_INET else\
        \ '::1', port))\n\ndef checks():\n    host = json.loads(Path('/control/host.json').read_text())\n    status = {}\n\
        \    for line in Path('/proc/self/status').read_text().splitlines():\n        key, _, value = line.partition(':')\n\
        \        if key in ('CapInh', 'CapPrm', 'CapEff', 'CapBnd', 'CapAmb', 'NoNewPrivs'):\n            status[key] = value.strip()\n\
        \    observed = {'namespaces': namespaces(), 'status': status, 'environment_names': sorted(os.environ)}\n    observed['host_paths_absent']\
        \ = all(not Path(p).exists() for p in (\n        '/home', '/root', '/mnt/c', '/var/run/docker.sock', host['sentinel']))\n\
        \    observed['control_read_only'] = False\n    try:\n        fd = os.open('/control/fixture.txt', os.O_WRONLY)\n\
        \        os.close(fd)\n    except OSError as error:\n        observed['control_read_only'] = error.errno == errno.EROFS\n\
        \    observed['blocked'] = {}\n    for name, operation in (\n        ('ipv4', lambda: connect(socket.AF_INET, host['ipv4_port'])),\n\
        \        ('ipv6', lambda: connect(socket.AF_INET6, host['ipv6_port'])),\n        ('dns', lambda: socket.getaddrinfo('registry.npmjs.org',\
        \ 443, socket.AF_INET, socket.SOCK_STREAM)),\n    ):\n        try:\n            operation()\n            observed['blocked'][name]\
        \ = False\n        except OSError:\n            observed['blocked'][name] = True\n    observed['pass'] = (\n     \
        \   all(observed['namespaces'][n] != host['namespaces'][n] for n in NS)\n        and all(observed['blocked'].values())\n\
        \        and observed['host_paths_absent'] and observed['control_read_only']\n        and set(os.environ) == set(CLEAN)\n\
        \        and status.get('NoNewPrivs') == '1'\n        and all(status.get(k) == '0000000000000000' for k in ('CapInh',\
        \ 'CapPrm', 'CapEff', 'CapBnd', 'CapAmb'))\n    )\n    Path('/output/inside.json').write_bytes(encoded(observed))\n\
        \    return 0 if observed['pass'] else 1\n\ndef call(*argv):\n    result = subprocess.run(argv, env=CLEAN, capture_output=True,\
        \ timeout=30)\n    require(result.returncode == 0, 'NAMESPACE_SETUP_' + str(result.returncode))\n\ndef enter(root,\
        \ control, output):\n    call('/usr/bin/mount', '--make-rprivate', '/')\n    call('/usr/bin/mount', '-t', 'tmpfs',\
        \ '-o', 'nosuid,nodev,size=64m', 'tmpfs', str(root))\n    def bind(source, destination, readonly=True):\n        target\
        \ = root / destination.lstrip('/')\n        if Path(source).is_dir():\n            target.mkdir(parents=True, exist_ok=True)\n\
        \        else:\n            target.parent.mkdir(parents=True, exist_ok=True)\n            target.touch()\n       \
        \ call('/usr/bin/mount', '--bind', str(source), str(target))\n        if readonly:\n            call('/usr/bin/mount',\
        \ '-o', 'remount,bind,ro,nosuid,nodev', str(target))\n    for path in RUNTIME:\n        bind(path, path)\n    for\
        \ name, target in [('bin', 'usr/bin'), ('lib', 'usr/lib'), ('lib64', 'usr/lib64')]:\n        (root / name).symlink_to(target)\n\
        \    bind(control, '/control')\n    bind(output, '/output', False)\n    for name in ('work', 'tmp', 'dev', 'etc',\
        \ 'proc'):\n        (root / name).mkdir()\n    call('/usr/bin/mount', '-t', 'tmpfs', '-o', 'nosuid,nodev,size=32m,mode=1777',\
        \ 'tmpfs', str(root / 'tmp'))\n    call('/usr/bin/mount', '-t', 'proc', '-o', 'ro,nosuid,nodev,noexec', 'proc', str(root\
        \ / 'proc'))\n    for name in ('null', 'zero', 'urandom', 'random'):\n        bind('/dev/' + name, '/dev/' + name,\
        \ False)\n    for name in ('resolv.conf', 'nsswitch.conf', 'ld.so.cache'):\n        source = Path('/etc') / name\n\
        \        if source.is_file():\n            shutil.copyfile(source, root / 'etc' / name)\n    (root / 'etc/hosts').write_text('127.0.0.1\
        \ localhost\\n::1 localhost\\n')\n    os.chroot(root)\n    os.chdir('/work')\n    os.execve('/usr/bin/setpriv', ['setpriv',\
        \ '--bounding-set=-all', '--inh-caps=-all',\n        '--ambient-caps=-all', '--no-new-privs', '/usr/bin/python3',\
        \ '-I', '-B',\n        '/control/probe.py', 'inside'], CLEAN)\n\ndef github_context():\n    if os.environ.get('GITHUB_ACTIONS')\
        \ != 'true':\n        require(not os.environ.get('GITHUB_RUN_ID'), 'PARTIAL_GITHUB_CONTEXT')\n        return {'kind':\
        \ 'LOCAL_DEVELOPMENT', 'authenticated': False}\n    fixed = {'GITHUB_REPOSITORY': 'davidanderle1/davidanderle-site',\
        \ 'GITHUB_REPOSITORY_ID': '1186790949',\n             'GITHUB_SERVER_URL': 'https://github.com', 'GITHUB_EVENT_NAME':\
        \ 'push', 'GITHUB_REF': BRANCH,\n             'RUNNER_OS': 'Linux', 'RUNNER_ARCH': 'X64', 'GITHUB_RUN_ATTEMPT': '1'}\n\
        \    require(all(os.environ.get(k) == v for k, v in fixed.items()), 'GITHUB_FIXED_CONTEXT')\n    require(os.environ.get('GITHUB_JOB')\
        \ in ('probe-a', 'probe-b'), 'GITHUB_JOB')\n    require(re.fullmatch('[1-9][0-9]{0,19}', os.environ.get('GITHUB_RUN_ID',\
        \ '')), 'GITHUB_RUN_ID')\n    for key in ('GITHUB_SHA', 'GITHUB_WORKFLOW_SHA'):\n        require(re.fullmatch('[0-9a-f]{40}',\
        \ os.environ.get(key, '')), 'GITHUB_SHA')\n    require(os.environ['GITHUB_SHA'] == os.environ['GITHUB_WORKFLOW_SHA'],\
        \ 'GITHUB_WORKFLOW_SOURCE')\n    require(os.environ.get('GITHUB_WORKFLOW_REF') == fixed['GITHUB_REPOSITORY'] +\n \
        \           '/.github/workflows/bearing-runner-qualification.yml@' + BRANCH, 'GITHUB_WORKFLOW_REF')\n    keys = (*fixed,\
        \ 'GITHUB_JOB', 'GITHUB_RUN_ID', 'GITHUB_SHA', 'GITHUB_WORKFLOW_SHA', 'GITHUB_WORKFLOW_REF')\n    return {'kind':\
        \ 'GITHUB_ENVIRONMENT_OBSERVED', 'values': {k: os.environ[k] for k in keys}, 'authenticated': False}\n\ndef run(output):\n\
        \    require(not output.exists(), 'OUTPUT_EXISTS')\n    output.mkdir(parents=True)\n    record = {'record_type': SCHEMA,\
        \ 'pass': False, 'production_authorized': False,\n              'probe_sha256': sha(Path(__file__).read_bytes()),\
        \ 'context': github_context()}\n    listeners = []\n    try:\n        require(platform.system() == 'Linux' and platform.machine()\
        \ == 'x86_64', 'LINUX_X64_REQUIRED')\n        boot = str(uuid.UUID(Path('/proc/sys/kernel/random/boot_id').read_text().strip()))\n\
        \        record['boot_id_sha256'] = sha(boot.encode())\n        record['kernel_release'] = platform.release()\n  \
        \      record['python'] = platform.python_version()\n        record['host_policy_before'] = host_policy()\n      \
        \  native = subprocess.run(['/usr/bin/unshare', '--user', '--map-root-user', '/usr/bin/true'],\n                 \
        \               env=CLEAN, capture_output=True, timeout=10)\n        record['native_userns_control'] = {'exit': native.returncode,\
        \ 'stderr_sha256': sha(native.stderr),\n                                         'classification': diagnostic(native.stderr)}\n\
        \        record['image'] = {key: os.environ.get(key, '')[:128] for key in ('ImageOS', 'ImageVersion')}\n        record['runtime_paths_present']\
        \ = {p: Path(p).is_dir() for p in RUNTIME}\n        require(all(record['runtime_paths_present'].values()), 'RUNTIME_PATH_MISSING')\n\
        \        require(sys.version_info[:2] == (3, 12), 'PYTHON_312_REQUIRED')\n        executable = Path('/usr/bin/bwrap')\n\
        \        require(executable.is_file() and not executable.is_symlink(), 'BWRAP_NOT_INSTALLED')\n        mode = executable.stat()\n\
        \        require(mode.st_uid == 0 and not mode.st_mode & (stat.S_ISUID | stat.S_ISGID | stat.S_IWGRP | stat.S_IWOTH),\
        \ 'BWRAP_OWNER_MODE')\n        version = subprocess.run([str(executable), '--version'], env=CLEAN, capture_output=True,\
        \ timeout=10)\n        version_text = version.stdout.decode('ascii', errors='strict').strip()\n        require(version.returncode\
        \ == 0 and re.fullmatch('bubblewrap [0-9.]{3,20}', version_text), 'BWRAP_VERSION')\n        record['bubblewrap'] =\
        \ {'path': str(executable), 'version': version_text, 'sha256': sha(executable.read_bytes()),\n                   \
        \             'uid': mode.st_uid, 'mode': oct(stat.S_IMODE(mode.st_mode)), 'admitted': False}\n        if record['context']['kind']\
        \ == 'GITHUB_ENVIRONMENT_OBSERVED':\n            require(record['bubblewrap']['sha256'] == 'e318903862396f96de3df57264e0158682b952fd3fb53ac23d876413e7b30f71',\
        \ 'BWRAP_PIN')\n        with tempfile.TemporaryDirectory(prefix='bearing-qualification-') as temp:\n            base\
        \ = Path(temp)\n            control, target, inner_output = base / 'control', base / 'root', base / 'output'\n   \
        \         for directory in (control, target, inner_output):\n                directory.mkdir()\n            sentinel\
        \ = base / 'host-sentinel'\n            sentinel.write_text('owned probe fixture\\n')\n            (control / 'fixture.txt').write_text('read-only\
        \ probe fixture\\n')\n            (control / 'hosts').write_text('127.0.0.1 localhost\\n::1 localhost\\n')\n     \
        \       shutil.copyfile(__file__, control / 'probe.py')\n            host = {'namespaces': namespaces(), 'sentinel':\
        \ str(sentinel), 'positive': {}}\n            for kind, family, address in [('ipv4', socket.AF_INET, '127.0.0.1'),\
        \ ('ipv6', socket.AF_INET6, '::1')]:\n                s = socket.socket(family, socket.SOCK_STREAM)\n            \
        \    listeners.append(s)\n                s.bind((address, 0))\n                s.listen(4)\n                host[kind\
        \ + '_port'] = s.getsockname()[1]\n                connect(family, host[kind + '_port'])\n                host['positive'][kind]\
        \ = True\n            host['positive']['dns'] = bool(socket.getaddrinfo('registry.npmjs.org', 443, socket.AF_INET,\
        \ socket.SOCK_STREAM))\n            require(all(host['positive'].values()), 'HOST_POSITIVE_CONTROL')\n           \
        \ (control / 'host.json').write_bytes(encoded(host))\n            record['host_positive'] = host['positive']\n   \
        \         record['host_namespaces'] = host['namespaces']\n            result = subprocess.run(bubblewrap_command(control,\
        \ inner_output),\n                env=CLEAN, capture_output=True, timeout=90)\n            record['namespace_exit']\
        \ = result.returncode\n            # Retain only a digest of stderr, never arbitrary host output.\n            record['namespace_stderr_sha256']\
        \ = sha(result.stderr)\n            record['namespace_diagnostic'] = diagnostic(result.stderr)\n            inside\
        \ = inner_output / 'inside.json'\n            if inside.is_file():\n                record['inside'] = json.loads(inside.read_text())\n\
        \            require(result.returncode == 0 and record.get('inside', {}).get('pass') is True, 'ISOLATION_CAPABILITY_FAILED')\n\
        \            require((control / 'fixture.txt').read_text() == 'read-only probe fixture\\n', 'FIXTURE_CHANGED')\n \
        \           record['pass'] = True\n    except Exception as error:\n        record['error_type'] = type(error).__name__\n\
        \        record['error_code'] = str(error) if isinstance(error, RuntimeError) else 'HOST_OR_PROCESS_FAILURE'\n   \
        \ finally:\n        for listener in listeners:\n            listener.close()\n        record['host_policy_after']\
        \ = host_policy()\n        record['host_policy_unchanged'] = record.get('host_policy_before') == record['host_policy_after']\n\
        \        if not record['host_policy_unchanged']:\n            record['pass'] = False\n            record['error_code']\
        \ = 'HOST_POLICY_CHANGED'\n    raw = encoded(record)\n    (output / 'report.json').write_bytes(raw)\n    print(raw.decode(),\
        \ end='')\n    if record['context']['kind'] == 'GITHUB_ENVIRONMENT_OBSERVED':\n        # All outputs are fixed vocabulary\
        \ or validated hex, never arbitrary environment text.\n        with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:\n\
        \            for name, value in {'passed': 'yes' if record['pass'] else 'no', 'report_sha256': sha(raw),\n       \
        \                         'boot_id_sha256': record.get('boot_id_sha256', '0' * 64)}.items():\n                stream.write(name\
        \ + '=' + value + '\\n')\n    return 0 if record['pass'] else 1\n\nif __name__ == '__main__':\n    parser = argparse.ArgumentParser()\n\
        \    parser.add_argument('mode', choices=('run', 'enter', 'inside'))\n    parser.add_argument('paths', nargs='*')\n\
        \    args = parser.parse_args()\n    if args.mode == 'inside':\n        require(not args.paths, 'ARGUMENT_COUNT')\n\
        \        raise SystemExit(checks())\n    if args.mode == 'enter':\n        require(len(args.paths) == 3, 'ARGUMENT_COUNT')\n\
        \        enter(*map(Path, args.paths))\n    else:\n        require(len(args.paths) == 1, 'ARGUMENT_COUNT')\n     \
        \   raise SystemExit(run(Path(args.paths[0]).absolute()))\nBEARING_PROBE_PY\nprintf '%s  %s\\n' 'f2a837fe2db4751971adbfd492de5b723d906698b18bdbc3d06be7a7f5760f07'\
        \ \"$probe_dir/probe.py\" | sha256sum --check --status\n/usr/bin/python3 -I -B \"$probe_dir/probe.py\" run \"$probe_dir/result\"\
        \n"
