  compare:
    needs:
    - probe-a
    - probe-b
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 2
    steps:
    - name: Require distinct observed kernel boots
      shell: bash
      env:
        A_BOOT: ${{ needs.probe-a.outputs.boot_id_sha256 }}
        B_BOOT: ${{ needs.probe-b.outputs.boot_id_sha256 }}
        A_PASS: ${{ needs.probe-a.outputs.passed }}
        B_PASS: ${{ needs.probe-b.outputs.passed }}
        A_REPORT: ${{ needs.probe-a.outputs.report_sha256 }}
        B_REPORT: ${{ needs.probe-b.outputs.report_sha256 }}
      run: "set -euo pipefail\n/usr/bin/python3 -I -B - <<'BEARING_COMPARE_PY'\nimport os,re,json\ndef need(ok,code):\n  \
        \  if not ok: raise SystemExit(code)\na,b=os.environ['A_BOOT'],os.environ['B_BOOT']\nneed(os.environ['A_PASS']==os.environ['B_PASS']=='yes','PROBE_DID_NOT_PASS')\n\
        need(all(re.fullmatch('[0-9a-f]{64}',x) and x!='0'*64 for x in (a,b,os.environ['A_REPORT'],os.environ['B_REPORT'])),'MISSING_EVIDENCE')\n\
        need(a!=b,'SAME_KERNEL_BOOT_NOT_TWO_HOST_INSTANCES')\nprint(json.dumps({'record_type':'BEARING_TWO_HOST_CAPABILITY_OBSERVATION','pass':True,\n\
        \ 'boot_ids_distinct':True,'a_report_sha256':os.environ['A_REPORT'],'b_report_sha256':os.environ['B_REPORT'],\n 'authenticated_provenance':False,'canonical_build_pair':False,'production_authorized':False},sort_keys=True))\n\
        BEARING_COMPARE_PY\n"
