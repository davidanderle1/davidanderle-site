        \        if source.is_file():\n            shutil.copyfile(source, root / 'etc' / name)\n    (root / 'etc/hosts').write_text('127.0.0.1\
        \ localhost\\n::1 localhost\\n')\n    os.chroot(root)\n    os.chdir('/work')\n    os.execve('/usr/bin/setpriv', ['setpriv',\
        \ '--bounding-set=-all', '--inh-caps=-all',\n        '--ambient-caps=-all', '--no-new-privs', '/usr/bin/python3',\
        \ '-I', '-B',\n        '/control/probe.py', 'inside'], CLEAN)\n\ndef github_context():\n    if os.environ.get('GITHUB_ACTIONS')\
        \ != 'true':\n        require(not os.environ.get('GITHUB_RUN_ID'), 'PARTIAL_GITHUB_CONTEXT')\n        return {'kind':\
