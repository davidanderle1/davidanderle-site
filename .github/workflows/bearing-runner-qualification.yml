    if: ${{ github.repository_id == '1186790949' && github.event_name == 'push' && github.ref == 'refs/heads/codex/r8-runner-qualification-20260920-r3'
      && github.run_attempt == 1 && github.event.created == true && github.event.deleted == false && github.event.before ==
