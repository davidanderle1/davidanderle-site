        \        record['boot_id_sha256'] = sha(boot.encode())\n        record['kernel_release'] = platform.release()\n  \
        \      record['python'] = platform.python_version()\n        record['host_policy_before'] = host_policy()\n      \
        \  native = subprocess.run(['/usr/bin/unshare', '--user', '--map-root-user', '/usr/bin/true'],\n                 \
        \               env=CLEAN, capture_output=True, timeout=10)\n        record['native_userns_control'] = {'exit': native.returncode,\
        \ 'stderr_sha256': sha(native.stderr),\n                                         'classification': diagnostic(native.stderr)}\n\
        \        record['image'] = {key: os.environ.get(key, '')[:128] for key in ('ImageOS', 'ImageVersion')}\n        record['runtime_paths_present']\
        \ = {p: Path(p).is_dir() for p in RUNTIME}\n        require(all(record['runtime_paths_present'].values()), 'RUNTIME_PATH_MISSING')\n\
        \        require(sys.version_info[:2] == (3, 12), 'PYTHON_312_REQUIRED')\n        executable = Path('/usr/bin/bwrap')\n\
        \        require(executable.is_file() and not executable.is_symlink(), 'BWRAP_NOT_INSTALLED')\n        mode = executable.stat()\n\
