name: Stage minimal future-deferral traceability repair

on:
  push:
    branches:
      - r7-full-history-traceability-final-20260901
    paths:
      - '.github/workflows/r7-traceability-stage-future-deferral.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r7-traceability-stage-future-deferral
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout final traceability branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Patch, parse and stage traceability workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/patch-r7-traceability-future-deferral.py
          python3 .github/scripts/patch-r7-traceability-future-deferral.py
          ruby -ryaml -e 'YAML.safe_load(File.read(ARGV[0]), aliases: true)' .github/workflows/r7-full-history-traceability-final.yml
          grep -q "all(r\['status'\].startswith('DEFERRED_BOUND_')" .github/workflows/r7-full-history-traceability-final.yml
          mkdir -p .r7-staging
          cp .github/workflows/r7-full-history-traceability-final.yml .r7-staging/r7-full-history-traceability-final-v2.yml
          sha256sum .r7-staging/r7-full-history-traceability-final-v2.yml > .r7-staging/r7-full-history-traceability-final-v2.yml.sha256

      - name: Commit staged traceability workflow blob
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .r7-staging/r7-full-history-traceability-final-v2.yml .r7-staging/r7-full-history-traceability-final-v2.yml.sha256
          git diff --cached --check
          git commit -m 'R7: stage future-deferral traceability repair'
          git push origin HEAD:r7-full-history-traceability-final-20260901
