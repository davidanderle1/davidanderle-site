name: R7E native Astro verification

on:
  push:
    branches:
      - r7e-native-verification-20260829
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r7e-native-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC
  SOURCE_DATE_EPOCH: '1787961600'
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout isolated verification branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0

      - name: Record runner environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence artifact
          {
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            uname -a
          } | tee evidence/environment.txt

      - name: Materialize genuine Astro source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate
          sha256sum --check .r7e-source/SHA256SUMS | tee evidence/chunk-check.txt
          cat .r7e-source/part*.b64 | tr -d '\r\n' | base64 --decode > r7e-native-source.zip
          sha256sum r7e-native-source.zip | tee evidence/source-archive-actual.sha256
          printf '%s  %s\n' '9a98f9e437f5d7419d66d2dd7d341921c4dec4ac296f5edd23ff30f4aa058594' 'r7e-native-source.zip' | sha256sum --check --strict | tee evidence/source-archive-check.txt
          unzip -q r7e-native-source.zip -d candidate
          test -f candidate/package.json
          test -f candidate/src/content.config.ts
          test -f candidate/astro.config.mjs
          test -f candidate/src/assets/portrait/david-anderle-headshot-320.webp
          printf '%s  %s\n' '821af5978918ac642c339da72153a584e59a0e92d47eede87290a5025a1ddc51' 'candidate/src/assets/portrait/david-anderle-headshot-320.webp' | sha256sum --check --strict | tee evidence/portrait-check.txt
          rm -rf candidate/node_modules candidate/dist candidate/.astro candidate/.r7e-tmp candidate/public/assets/portrait candidate/public/assets/js candidate/public/artifacts candidate/src/data/generated

      - name: Apply audited implementation corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/r7e-fix-source.py candidate | tee evidence/implementation-fixes.txt

      - name: Resolve complete transitive lockfile
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f package-lock.json
          /usr/bin/time -v -o ../evidence/lock-resolution.time.txt npm install --package-lock-only --ignore-scripts --audit=false --fund=false > ../evidence/lock-resolution.stdout.txt 2> ../evidence/lock-resolution.stderr.txt
          node -e "const l=require('./package-lock.json'); const n=Object.keys(l.packages||{}).length; console.log('lock packages='+n); if(n<500) process.exit(2)" | tee ../evidence/lock-summary.txt
          sha256sum package.json package-lock.json | tee ../evidence/package-lock.sha256

      - name: Freeze candidate source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf frozen run1 run2
          mkdir frozen
          cp -a candidate/. frozen/
          rm -rf frozen/node_modules frozen/dist frozen/.astro frozen/.r7e-tmp frozen/public/assets/portrait frozen/public/assets/js frozen/public/artifacts frozen/src/data/generated
          find frozen -type f -print0 | sort -z | xargs -0 sha256sum > evidence/frozen-source.sha256
          tar --sort=name --mtime='@1787961600' --owner=0 --group=0 --numeric-owner -C frozen -cf - . | sha256sum | tee evidence/frozen-source-tar.sha256

      - name: Clean Run 1
        shell: bash
        run: |
          set -euo pipefail
          mkdir run1
          cp -a frozen/. run1/
          cd run1
          npm run preflight:source > ../evidence/run1-preflight.stdout.txt 2> ../evidence/run1-preflight.stderr.txt
          /usr/bin/time -v -o ../evidence/run1-npm-ci.time.txt npm ci --audit=false --fund=false > ../evidence/run1-npm-ci.stdout.txt 2> ../evidence/run1-npm-ci.stderr.txt
          /usr/bin/time -v -o ../evidence/run1-check.time.txt npm run check > ../evidence/run1-check.stdout.txt 2> ../evidence/run1-check.stderr.txt
          /usr/bin/time -v -o ../evidence/run1-build.time.txt npm run build > ../evidence/run1-build.stdout.txt 2> ../evidence/run1-build.stderr.txt
          npm run html:validate > ../evidence/run1-html.stdout.txt 2> ../evidence/run1-html.stderr.txt
          npm run links:validate > ../evidence/run1-links.stdout.txt 2> ../evidence/run1-links.stderr.txt
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > ../evidence/run1-dist.sha256
          { printf 'files='; find dist -type f | wc -l; printf 'bytes='; du -sb dist | cut -f1; } | tee ../evidence/run1-dist-summary.txt

      - name: Clean Run 2
        shell: bash
        run: |
          set -euo pipefail
          mkdir run2
          cp -a frozen/. run2/
          cd run2
          npm run preflight:source > ../evidence/run2-preflight.stdout.txt 2> ../evidence/run2-preflight.stderr.txt
          /usr/bin/time -v -o ../evidence/run2-npm-ci.time.txt npm ci --audit=false --fund=false > ../evidence/run2-npm-ci.stdout.txt 2> ../evidence/run2-npm-ci.stderr.txt
          /usr/bin/time -v -o ../evidence/run2-check.time.txt npm run check > ../evidence/run2-check.stdout.txt 2> ../evidence/run2-check.stderr.txt
          /usr/bin/time -v -o ../evidence/run2-build.time.txt npm run build > ../evidence/run2-build.stdout.txt 2> ../evidence/run2-build.stderr.txt
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > ../evidence/run2-dist.sha256
          { printf 'files='; find dist -type f | wc -l; printf 'bytes='; du -sb dist | cut -f1; } | tee ../evidence/run2-dist-summary.txt

      - name: Reproducibility gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee evidence/reproducibility.txt
          from pathlib import Path
          import hashlib
          a=Path('run1/dist'); b=Path('run2/dist')
          pa=sorted(p.relative_to(a) for p in a.rglob('*') if p.is_file())
          pb=sorted(p.relative_to(b) for p in b.rglob('*') if p.is_file())
          if pa != pb:
              print('path_mismatch')
              print('only_run1', sorted(map(str,set(pa)-set(pb))))
              print('only_run2', sorted(map(str,set(pb)-set(pa))))
              raise SystemExit(1)
          diffs=[]
          for rel in pa:
              ha=hashlib.sha256((a/rel).read_bytes()).hexdigest()
              hb=hashlib.sha256((b/rel).read_bytes()).hexdigest()
              if ha != hb: diffs.append((str(rel),ha,hb))
          print('file_count',len(pa))
          print('byte_identical',len(pa)-len(diffs))
          print('different',len(diffs))
          for row in diffs: print('\t'.join(row))
          if diffs: raise SystemExit(1)
          PY

      - name: Invalid fixture gate
        working-directory: run1
        shell: bash
        run: npm run validate:fixtures > ../evidence/invalid-fixtures.stdout.txt 2> ../evidence/invalid-fixtures.stderr.txt

      - name: 500-record native Astro stress build
        working-directory: run1
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v -o ../evidence/stress.time.txt npm run test:stress > ../evidence/stress.stdout.txt 2> ../evidence/stress.stderr.txt
          count=$(find .r7e-tmp/stress/dist/work -mindepth 2 -maxdepth 2 -name index.html | wc -l)
          echo "emitted_detail_pages=$count" | tee ../evidence/stress-summary.txt
          test "$count" -eq 500
          echo "total_files=$(find .r7e-tmp/stress/dist -type f | wc -l)" | tee -a ../evidence/stress-summary.txt
          echo "total_bytes=$(du -sb .r7e-tmp/stress/dist | cut -f1)" | tee -a ../evidence/stress-summary.txt
          if npm run test:stress:production-gate > ../evidence/stress-production-gate.stdout.txt 2> ../evidence/stress-production-gate.stderr.txt; then
            echo 'Production gate unexpectedly accepted test fixtures' >&2
            exit 1
          fi

      - name: Install Chromium for browser gates
        working-directory: run1
        shell: bash
        run: npx playwright install --with-deps chromium

      - name: Browser matrix and no-JS gates
        working-directory: run1
        shell: bash
        run: |
          set -euo pipefail
          npm run test:browser > ../evidence/browser.stdout.txt 2> ../evidence/browser.stderr.txt
          cp .r7e-tmp/playwright/results.json ../evidence/browser-playwright-results.json
          count=$(find .r7e-tmp/screenshots -type f -name '*.png' | wc -l)
          echo "screenshot_count=$count" | tee ../evidence/browser-summary.txt
          test "$count" -ge 40

      - name: axe-core accessibility automation
        working-directory: run1
        shell: bash
        run: |
          set -euo pipefail
          npm run test:axe > ../evidence/axe.stdout.txt 2> ../evidence/axe.stderr.txt
          cp .r7e-tmp/playwright/results.json ../evidence/axe-playwright-results.json

      - name: Lighthouse measurements
        working-directory: run1
        shell: bash
        run: |
          set -euo pipefail
          npm run test:lighthouse > ../evidence/lighthouse.stdout.txt 2> ../evidence/lighthouse.stderr.txt
          node --input-type=module <<'NODE' > ../evidence/lighthouse-summary.json
          import fs from 'node:fs';
          const files=['.r7e-tmp/lighthouse/page-1.json','.r7e-tmp/lighthouse/page-2.json'];
          const rows=files.map((file) => {
            const report=JSON.parse(fs.readFileSync(file,'utf8'));
            const audit=(id) => report.audits?.[id]?.numericValue ?? null;
            return {
              file,
              url: report.finalDisplayedUrl ?? report.finalUrl ?? null,
              performance: report.categories?.performance?.score ?? null,
              accessibility: report.categories?.accessibility?.score ?? null,
              lcpMs: audit('largest-contentful-paint'),
              cls: audit('cumulative-layout-shift'),
              tbtMs: audit('total-blocking-time'),
              totalByteWeight: audit('total-byte-weight')
            };
          });
          console.log(JSON.stringify({reports:rows},null,2));
          NODE

      - name: Runtime network audit
        working-directory: run1
        shell: bash
        run: npm run network:audit > ../evidence/network.stdout.txt 2> ../evidence/network.stderr.txt

      - name: Wrangler assets-only dry run
        working-directory: run1
        shell: bash
        run: npm run wrangler:validate > ../evidence/wrangler.stdout.txt 2> ../evidence/wrangler.stderr.txt

      - name: Assemble successful evidence artifact
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            artifact/BEARING_PRODUCTION_SOURCE \
            artifact/BEARING_VERIFIED_DIST \
            artifact/BEARING_SCALE_SITE_500 \
            artifact/R7E_EVIDENCE \
            artifact/R7E_BROWSER_SCREENSHOTS \
            artifact/R7E_LIGHTHOUSE_RAW \
            artifact/R7E_NETWORK_RAW
          cp -a frozen/. artifact/BEARING_PRODUCTION_SOURCE/
          cp -a run1/dist/. artifact/BEARING_VERIFIED_DIST/
          cp -a run1/.r7e-tmp/stress/dist/. artifact/BEARING_SCALE_SITE_500/
          cp -a evidence/. artifact/R7E_EVIDENCE/
          cp -a run1/.r7e-tmp artifact/R7E_RUN1_TMP
          cp -a run1/.r7e-tmp/screenshots/. artifact/R7E_BROWSER_SCREENSHOTS/
          cp -a run1/.r7e-tmp/lighthouse/. artifact/R7E_LIGHTHOUSE_RAW/
          cp -a run1/.r7e-tmp/network/. artifact/R7E_NETWORK_RAW/
          printf 'R7E BUILD EVIDENCE COMPLETE — READY FOR INDEPENDENT R7F AUDIT\n' > artifact/R7E_GATE_DECISION.txt

          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('artifact')
          index={
            'gate':'R7E_GATE_DECISION.txt',
            'source':{
              'tree':'BEARING_PRODUCTION_SOURCE/',
              'lockfile':'BEARING_PRODUCTION_SOURCE/package-lock.json',
              'sourceHashes':'R7E_EVIDENCE/frozen-source.sha256',
              'aggregateSourceHash':'R7E_EVIDENCE/frozen-source-tar.sha256'
            },
            'cleanRun1':{
              'installStdout':'R7E_EVIDENCE/run1-npm-ci.stdout.txt',
              'installStderr':'R7E_EVIDENCE/run1-npm-ci.stderr.txt',
              'checkStdout':'R7E_EVIDENCE/run1-check.stdout.txt',
              'buildStdout':'R7E_EVIDENCE/run1-build.stdout.txt',
              'buildStderr':'R7E_EVIDENCE/run1-build.stderr.txt',
              'timing':'R7E_EVIDENCE/run1-build.time.txt',
              'manifest':'R7E_EVIDENCE/run1-dist.sha256',
              'dist':'BEARING_VERIFIED_DIST/'
            },
            'cleanRun2':{
              'installStdout':'R7E_EVIDENCE/run2-npm-ci.stdout.txt',
              'installStderr':'R7E_EVIDENCE/run2-npm-ci.stderr.txt',
              'checkStdout':'R7E_EVIDENCE/run2-check.stdout.txt',
              'buildStdout':'R7E_EVIDENCE/run2-build.stdout.txt',
              'buildStderr':'R7E_EVIDENCE/run2-build.stderr.txt',
              'timing':'R7E_EVIDENCE/run2-build.time.txt',
              'manifest':'R7E_EVIDENCE/run2-dist.sha256'
            },
            'reproducibility':'R7E_EVIDENCE/reproducibility.txt',
            'invalidFixtures':{
              'stdout':'R7E_EVIDENCE/invalid-fixtures.stdout.txt',
              'stderr':'R7E_EVIDENCE/invalid-fixtures.stderr.txt',
              'structured':'R7E_RUN1_TMP/invalid-fixture-results.json'
            },
            'scale500':{
              'summary':'R7E_EVIDENCE/stress-summary.txt',
              'stdout':'R7E_EVIDENCE/stress.stdout.txt',
              'stderr':'R7E_EVIDENCE/stress.stderr.txt',
              'timing':'R7E_EVIDENCE/stress.time.txt',
              'site':'BEARING_SCALE_SITE_500/'
            },
            'browser':{
              'stdout':'R7E_EVIDENCE/browser.stdout.txt',
              'stderr':'R7E_EVIDENCE/browser.stderr.txt',
              'results':'R7E_EVIDENCE/browser-playwright-results.json',
              'summary':'R7E_EVIDENCE/browser-summary.txt',
              'screenshots':'R7E_BROWSER_SCREENSHOTS/'
            },
            'accessibility':{
              'stdout':'R7E_EVIDENCE/axe.stdout.txt',
              'stderr':'R7E_EVIDENCE/axe.stderr.txt',
              'results':'R7E_EVIDENCE/axe-playwright-results.json'
            },
            'lighthouse':{
              'stdout':'R7E_EVIDENCE/lighthouse.stdout.txt',
              'stderr':'R7E_EVIDENCE/lighthouse.stderr.txt',
              'summary':'R7E_EVIDENCE/lighthouse-summary.json',
              'raw':'R7E_LIGHTHOUSE_RAW/'
            },
            'network':{
              'stdout':'R7E_EVIDENCE/network.stdout.txt',
              'stderr':'R7E_EVIDENCE/network.stderr.txt',
              'raw':'R7E_NETWORK_RAW/audit.json'
            },
            'wrangler':{
              'stdout':'R7E_EVIDENCE/wrangler.stdout.txt',
              'stderr':'R7E_EVIDENCE/wrangler.stderr.txt',
              'config':'BEARING_PRODUCTION_SOURCE/wrangler.jsonc'
            }
          }
          missing=[]
          for section in index.values():
            if isinstance(section,str):
              if not (root/section).exists(): missing.append(section)
            elif isinstance(section,dict):
              for value in section.values():
                if isinstance(value,str) and not (root/value).exists(): missing.append(value)
          if missing:
            raise SystemExit(f'Evidence index has missing paths: {missing}')
          (root/'R7E_EVIDENCE_INDEX.json').write_text(json.dumps(index,indent=2)+'\n')
          PY

          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('artifact')
          checks={
            'gateReady':(root/'R7E_GATE_DECISION.txt').read_text().strip()=='R7E BUILD EVIDENCE COMPLETE — READY FOR INDEPENDENT R7F AUDIT',
            'sourcePresent':(root/'BEARING_PRODUCTION_SOURCE/package.json').is_file(),
            'lockfilePresent':(root/'BEARING_PRODUCTION_SOURCE/package-lock.json').is_file(),
            'nodeVersionPresent':(root/'BEARING_PRODUCTION_SOURCE/.node-version').is_file(),
            'nvmrcPresent':(root/'BEARING_PRODUCTION_SOURCE/.nvmrc').is_file(),
            'sourceWorkflowPresent':(root/'BEARING_PRODUCTION_SOURCE/.github/workflows/production-reference.yml').is_file(),
            'verifiedDistPresent':(root/'BEARING_VERIFIED_DIST/index.html').is_file(),
            'securityTxtPresent':(root/'BEARING_VERIFIED_DIST/.well-known/security.txt').is_file(),
            'scaleSitePresent':(root/'BEARING_SCALE_SITE_500/index.html').is_file(),
            'scaleDetailPages':len(list((root/'BEARING_SCALE_SITE_500/work').glob('synthetic-test-record-*/index.html')))==500,
            'screenshotMinimum':len(list((root/'R7E_BROWSER_SCREENSHOTS').glob('*.png')))>=40,
            'browserStructuredResults':(root/'R7E_EVIDENCE/browser-playwright-results.json').is_file(),
            'axeStructuredResults':(root/'R7E_EVIDENCE/axe-playwright-results.json').is_file(),
            'lighthouseReportCount':len(list((root/'R7E_LIGHTHOUSE_RAW').glob('*.json')))==2,
            'networkRawPresent':(root/'R7E_NETWORK_RAW/audit.json').is_file(),
            'evidenceIndexPresent':(root/'R7E_EVIDENCE_INDEX.json').is_file(),
            'noNodeModules':not any(p.name=='node_modules' for p in root.rglob('node_modules')),
            'noForbiddenPortraitDerivatives':not any(p.is_file() and any(token in p.name for token in ('640','960','1280')) for p in root.rglob('portrait-*')),
            'productionHasNoSyntheticFixturePages':not any((root/'BEARING_VERIFIED_DIST/work').glob('synthetic-test-record-*'))
          }
          result={'passed':all(checks.values()),'checks':checks,'fileCountBeforeManifest':sum(1 for p in root.rglob('*') if p.is_file())}
          (root/'R7E_PACKAGE_VALIDATION.json').write_text(json.dumps(result,indent=2)+'\n')
          if not result['passed']:
            raise SystemExit(json.dumps(result,indent=2))
          PY

          (
            cd artifact
            find . -type f ! -name 'R7E_ARTIFACT_SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > R7E_ARTIFACT_SHA256SUMS.txt
            sha256sum --check --strict R7E_ARTIFACT_SHA256SUMS.txt
          )

      - name: Assemble diagnostic artifact on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/BEARING_PRODUCTION_SOURCE artifact/R7E_EVIDENCE
          if [ -d frozen ]; then cp -a frozen/. artifact/BEARING_PRODUCTION_SOURCE/; elif [ -d candidate ]; then cp -a candidate/. artifact/BEARING_PRODUCTION_SOURCE/; fi
          rm -rf artifact/BEARING_PRODUCTION_SOURCE/node_modules artifact/BEARING_PRODUCTION_SOURCE/dist artifact/BEARING_PRODUCTION_SOURCE/.astro artifact/BEARING_PRODUCTION_SOURCE/.r7e-tmp
          cp -a evidence/. artifact/R7E_EVIDENCE/ 2>/dev/null || true
          if [ -d run1/dist ]; then mkdir -p artifact/BEARING_PARTIAL_RUN1_DIST && cp -a run1/dist/. artifact/BEARING_PARTIAL_RUN1_DIST/; fi
          if [ -d run2/dist ]; then mkdir -p artifact/BEARING_PARTIAL_RUN2_DIST && cp -a run2/dist/. artifact/BEARING_PARTIAL_RUN2_DIST/; fi
          if [ -d run1/.r7e-tmp ]; then cp -a run1/.r7e-tmp artifact/R7E_RUN1_TMP; fi
          if [ -d run1/test-results ]; then cp -a run1/test-results artifact/R7E_PLAYWRIGHT_FAILURE_RESULTS; fi
          printf 'R7E BUILD EVIDENCE INCOMPLETE — DO NOT START R7F\n' > artifact/R7E_GATE_DECISION.txt
          (
            cd artifact
            find . -type f ! -name 'R7E_ARTIFACT_SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > R7E_ARTIFACT_SHA256SUMS.txt
            sha256sum --check --strict R7E_ARTIFACT_SHA256SUMS.txt
          )

      - name: Upload R7E evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7e-native-evidence-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          include-hidden-files: true
