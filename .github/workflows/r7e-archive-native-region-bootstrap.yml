name: R7E native archive region source bootstrap

on:
  push:
    branches:
      - r7e-hardened-verification-20260829
    paths:
      - '.github/workflows/r7e-archive-native-region-bootstrap.yml'
      - '.github/r7-closure/r7e-archive-native-region-followup.patch'
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: UTC
  SOURCE_DATE_EPOCH: '1787961600'

jobs:
  bootstrap:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact R7E branch state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Derive deterministic native-region canonical source
        shell: bash
        run: |
          set -euo pipefail
          readonly PREDECESSOR_ARCHIVE_SHA='a4d843b19ecd6792ea3c91ed5fb3f39b38b8f14c8f62e4c649572783b3c129bc'
          readonly RESULT_ARCHIVE_SHA='3407a6b2f4779a74cf1f3cae288063daaa6435d7dc46ad05106fbf2243046729'
          readonly PATCH_SHA='d0c81a8212afec5ec23af9a4a4c4ddca04a4673e06ca455dc24fd5f69ff32d0d'
          readonly BEFORE_ARCHIVE_SHA='3c8d89953f03d43817c743ba3238471f663f9cbe09cee193153781fc5a0de825'
          readonly AFTER_ARCHIVE_SHA='cef44886f5d42c70dc3e9cd041a3d21a8fe8ebeaac0eac29813a89675da0d34d'
          readonly PATCH='.github/r7-closure/r7e-archive-native-region-followup.patch'

          printf '%s  %s\n' "$PATCH_SHA" "$PATCH" | sha256sum --check --strict
          sha256sum --check --strict .r7e-source/SHA256SUMS
          current_archive_sha=$(tr -d '\r\n' < .r7e-source/ARCHIVE_SHA256)
          if [[ "$current_archive_sha" == "$RESULT_ARCHIVE_SHA" ]]; then
            echo 'NATIVE_ARCHIVE_REGION_SOURCE_ALREADY_CURRENT'
            exit 0
          fi
          test "$current_archive_sha" = "$PREDECESSOR_ARCHIVE_SHA"

          rm -rf canonical /tmp/r7e-region-pack1 /tmp/r7e-region-pack2
          rm -f /tmp/r7e-region-predecessor.zip /tmp/r7e-region-source1.zip /tmp/r7e-region-source2.zip
          mkdir canonical
          cat .r7e-source/part*.b64 | tr -d '\r\n' | base64 --decode > /tmp/r7e-region-predecessor.zip
          printf '%s  %s\n' "$PREDECESSOR_ARCHIVE_SHA" /tmp/r7e-region-predecessor.zip | sha256sum --check --strict
          unzip -q /tmp/r7e-region-predecessor.zip -d canonical
          printf '%s  %s\n' "$BEFORE_ARCHIVE_SHA" canonical/src/pages/archive/index.astro | sha256sum --check --strict

          (
            cd canonical
            git init -q
            git add -A
            git -c user.name='r7e-native-region-bootstrap' -c user.email='r7e-native-region-bootstrap@example.invalid' commit -qm 'immutable predecessor source'
            git apply --check "$GITHUB_WORKSPACE/$PATCH"
            git apply "$GITHUB_WORKSPACE/$PATCH"
            git diff --check
            test "$(git diff --name-only)" = 'src/pages/archive/index.astro'
          )

          printf '%s  %s\n' "$AFTER_ARCHIVE_SHA" canonical/src/pages/archive/index.astro | sha256sum --check --strict
          grep -q '<section class="archive-wrap" tabindex="0" aria-label="Chronological record table, horizontally scrollable on narrow screens">' canonical/src/pages/archive/index.astro
          grep -q '</table></section>' canonical/src/pages/archive/index.astro
          ! grep -q 'class="archive-wrap" role="region"' canonical/src/pages/archive/index.astro
          test "$(grep -o 'scope="col"' canonical/src/pages/archive/index.astro | wc -l)" -eq 4
          rm -rf canonical/.git

          python3 .github/scripts/r7e-pack-source.py canonical /tmp/r7e-region-pack1 --archive /tmp/r7e-region-source1.zip
          python3 .github/scripts/r7e-pack-source.py canonical /tmp/r7e-region-pack2 --archive /tmp/r7e-region-source2.zip
          cmp /tmp/r7e-region-source1.zip /tmp/r7e-region-source2.zip
          diff -ru /tmp/r7e-region-pack1 /tmp/r7e-region-pack2
          printf '%s  %s\n' "$RESULT_ARCHIVE_SHA" /tmp/r7e-region-source1.zip | sha256sum --check --strict
          test "$(cat /tmp/r7e-region-pack1/ARCHIVE_SHA256)" = "$RESULT_ARCHIVE_SHA"

          python3 - <<'PY'
          import json
          from pathlib import Path
          tree=json.loads(Path('/tmp/r7e-region-pack1/SOURCE_TREE.json').read_text())
          rows={row['path']:row for row in tree['files']}
          assert tree['fileCount']==111
          assert rows['src/pages/archive/index.astro']['sha256']=='cef44886f5d42c70dc3e9cd041a3d21a8fe8ebeaac0eac29813a89675da0d34d'
          print(json.dumps({'passed':True,'fileCount':tree['fileCount'],'archiveSha256':Path('/tmp/r7e-region-pack1/ARCHIVE_SHA256').read_text().strip(),'changedFiles':['src/pages/archive/index.astro']},indent=2))
          PY

          rm -rf .r7e-source
          mkdir .r7e-source
          cp -a /tmp/r7e-region-pack1/. .r7e-source/
          printf '%s\n' "$RESULT_ARCHIVE_SHA" > .r7e-source/HARDENED_SOURCE_READY
          sha256sum --check --strict .r7e-source/SHA256SUMS

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .r7e-source
          git commit -m 'R7E: freeze native archive-region canonical source'
          git push origin HEAD:r7e-hardened-verification-20260829
