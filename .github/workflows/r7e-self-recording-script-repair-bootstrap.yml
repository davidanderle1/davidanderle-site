name: Bootstrap final self-recording R7E script repair

on:
  push:
    branches:
      - r7e-portable-self-recording-final-20260901
    paths:
      - '.github/workflows/r7e-self-recording-script-repair-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r7e-self-recording-script-repair-bootstrap
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout isolated final R7E branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Repair generator and generated-plan executor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          generator = Path('.github/scripts/materialize-portable-r7e-workflow.py')
          text = generator.read_text(encoding='utf-8')
          replacements = [
              (
                  'scripts/validate-json-schema.mjs scripts/verify-json-schema-drift.mjs',
                  'scripts/validate-json-schemas.mjs scripts/run-portable-schema-contract.mjs',
                  'current portable verifier paths',
              ),
              (
                  '.contractVersion=="1.0.0" and .dialect=="https://json-schema.org/draft/2020-12/schema"',
                  '.contractVersion=="1.0.0" and ."$schema"=="https://json-schema.org/draft/2020-12/schema"',
                  'standard JSON Schema dialect field',
              ),
          ]
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one stale anchor, found {count}')
              text = text.replace(old, new, 1)
          generator.write_text(text, encoding='utf-8')

          executor = Path('.github/scripts/execute-generated-r7e-plan.py')
          source = executor.read_text(encoding='utf-8')
          start = source.index('def main() -> None:\n')
          end = source.index('\n\nif __name__ == "__main__":')
          main = r'''def main() -> None:
    if len(sys.argv) != 3:
        fail("usage: execute-generated-r7e-plan.py WORKFLOW REPORT")
    workflow_path = Path(sys.argv[1]).resolve()
    report_path = Path(sys.argv[2]).resolve()
    if not workflow_path.is_file():
        fail(f"Generated workflow missing: {workflow_path}")

    workflow = load_workflow(workflow_path)
    jobs = workflow.get("jobs")
    if not isinstance(jobs, dict) or set(jobs) != {"verify"}:
        fail(f"Generated workflow must contain exactly one verify job, got {list(jobs or {})}")
    job = jobs["verify"]
    if not isinstance(job, dict):
        fail("verify job is not an object")
    if job.get("runs-on") != "ubuntu-24.04":
        fail(f"Unexpected runner: {job.get('runs-on')}")
    steps = job.get("steps")
    if not isinstance(steps, list) or not steps:
        fail("verify steps are missing")

    workflow_env = workflow.get("env") or {}
    job_env = job.get("env") or {}
    executed: list[dict[str, Any]] = []
    skipped_uses: list[dict[str, str]] = []
    skipped_conditions: list[dict[str, str]] = []
    failed = False
    first_failure: dict[str, Any] | None = None
    script_path = ROOT / ".r7e-plan-step.sh"

    def persist_report() -> None:
        report_path.parent.mkdir(parents=True, exist_ok=True)
        report = {
            "schema": "R7E_GENERATED_PLAN_EXECUTION_V2",
            "passed": not failed,
            "workflow": str(workflow_path.relative_to(ROOT)),
            "workflowSha256": subprocess.check_output(["sha256sum", str(workflow_path)], text=True).split()[0],
            "runner": job.get("runs-on"),
            "executedRunStepCount": len(executed),
            "skippedAllowedUsesCount": len(skipped_uses),
            "skippedAllowedUses": skipped_uses,
            "skippedConditionCount": len(skipped_conditions),
            "skippedConditions": skipped_conditions,
            "firstFailure": first_failure,
            "steps": executed,
        }
        report_path.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")

    for index, step in enumerate(steps, start=1):
        if not isinstance(step, dict):
            fail(f"Step {index} is not an object")
        name = str(step.get("name") or f"step-{index}")
        uses = step.get("uses")
        run = step.get("run")
        if bool(uses) == bool(run):
            fail(f"Step {name!r} must contain exactly one of uses/run")

        if uses:
            uses_text = str(uses)
            if not uses_text.startswith(ALLOWED_USES):
                fail(f"Disallowed action in generated plan: {uses_text}")
            skipped_uses.append({"name": name, "uses": uses_text})
            continue

        condition = str(step.get("if") or "").strip()
        if condition in ("", "success()", "${{ success() }}"):
            condition_kind = "success"
        elif condition in ("always()", "${{ always() }}"):
            condition_kind = "always"
        elif condition in ("failure()", "${{ failure() }}"):
            condition_kind = "failure"
        else:
            fail(f"Unsupported run-step condition in {name!r}: {condition}")

        should_run = (
            condition_kind == "always"
            or (condition_kind == "success" and not failed)
            or (condition_kind == "failure" and failed)
        )
        if not should_run:
            skipped_conditions.append({"name": name, "condition": condition_kind})
            continue

        shell = str(step.get("shell") or "bash")
        if shell not in ("bash", "bash --noprofile --norc -e -o pipefail {0}"):
            fail(f"Unsupported shell in {name!r}: {shell}")

        script = substitute(str(run))
        cwd = safe_working_directory(step.get("working-directory"))
        env = normalized_env(workflow_env, job_env, step.get("env"))
        script_path.write_text("set -euo pipefail\n" + script + "\n", encoding="utf-8")
        started = time.time()
        print(f"::group::{index:02d} {name}", flush=True)
        completed = subprocess.run(
            ["bash", "--noprofile", "--norc", str(script_path)],
            cwd=cwd,
            env=env,
            text=True,
        )
        print("::endgroup::", flush=True)
        elapsed = round(time.time() - started, 3)
        row = {
            "index": index,
            "name": name,
            "condition": condition_kind,
            "workingDirectory": str(cwd.relative_to(ROOT)) if cwd != ROOT else ".",
            "exitCode": completed.returncode,
            "elapsedSeconds": elapsed,
        }
        executed.append(row)
        if completed.returncode != 0:
            failed = True
            if first_failure is None:
                first_failure = dict(row)
        persist_report()

    script_path.unlink(missing_ok=True)
    if not executed:
        fail("Generated plan executed no run steps")
    persist_report()
    print(report_path.read_text(encoding="utf-8"))
    if failed:
        assert first_failure is not None
        fail(
            f"Generated plan failed at {first_failure['name']} "
            f"(exit {first_failure['exitCode']})"
        )
'''
          executor.write_text(source[:start] + main + source[end:], encoding='utf-8')
          PY

          python3 -m py_compile \
            .github/scripts/materialize-portable-r7e-workflow.py \
            .github/scripts/execute-generated-r7e-plan.py

          python3 .github/scripts/materialize-portable-r7e-workflow.py
          ! grep -q 'scripts/validate-json-schema.mjs' .github/workflows/r7e-portable-json-schema-verification.yml
          ! grep -q 'scripts/verify-json-schema-drift.mjs' .github/workflows/r7e-portable-json-schema-verification.yml
          grep -q 'scripts/validate-json-schemas.mjs' .github/workflows/r7e-portable-json-schema-verification.yml
          grep -q 'scripts/run-portable-schema-contract.mjs' .github/workflows/r7e-portable-json-schema-verification.yml
          grep -Fq '.contractVersion=="1.0.0" and ."$schema"=="https://json-schema.org/draft/2020-12/schema"' .github/workflows/r7e-portable-json-schema-verification.yml
          git checkout -- .github/workflows/r7e-portable-json-schema-verification.yml

          cat > /tmp/r7e-plan-success.yml <<'YAML'
          jobs:
            verify:
              runs-on: ubuntu-24.04
              steps:
                - name: success
                  run: printf success > /tmp/r7e-plan-success-marker
                - name: failure-only-skipped
                  if: failure()
                  run: exit 91
                - name: always
                  if: always()
                  run: printf always > /tmp/r7e-plan-always-marker
          YAML
          sed -i 's/^          //' /tmp/r7e-plan-success.yml
          python3 .github/scripts/execute-generated-r7e-plan.py /tmp/r7e-plan-success.yml /tmp/r7e-plan-success.json
          jq -e '.passed==true and .executedRunStepCount==2 and .skippedConditionCount==1 and .firstFailure==null' /tmp/r7e-plan-success.json >/dev/null
          test "$(cat /tmp/r7e-plan-success-marker)" = success
          test "$(cat /tmp/r7e-plan-always-marker)" = always

          cat > /tmp/r7e-plan-failure.yml <<'YAML'
          jobs:
            verify:
              runs-on: ubuntu-24.04
              steps:
                - name: deliberate-failure
                  run: exit 7
                - name: success-only-skipped
                  run: printf bad > /tmp/r7e-plan-should-not-exist
                - name: failure-handler
                  if: failure()
                  run: printf handled > /tmp/r7e-plan-failure-marker
                - name: always-handler
                  if: always()
                  run: printf always > /tmp/r7e-plan-failure-always-marker
          YAML
          sed -i 's/^          //' /tmp/r7e-plan-failure.yml
          set +e
          python3 .github/scripts/execute-generated-r7e-plan.py /tmp/r7e-plan-failure.yml /tmp/r7e-plan-failure.json
          status=$?
          set -e
          test "$status" -ne 0
          jq -e '.passed==false and .executedRunStepCount==3 and .skippedConditionCount==1 and .firstFailure.exitCode==7 and .firstFailure.name=="deliberate-failure"' /tmp/r7e-plan-failure.json >/dev/null
          test ! -e /tmp/r7e-plan-should-not-exist
          test "$(cat /tmp/r7e-plan-failure-marker)" = handled
          test "$(cat /tmp/r7e-plan-failure-always-marker)" = always

      - name: Commit repaired scripts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/scripts/materialize-portable-r7e-workflow.py \
            .github/scripts/execute-generated-r7e-plan.py
          test -n "$(git diff --cached --name-only)"
          git diff --cached --check
          git commit -m 'R7E: repair self-recording generator and condition semantics'
          git push origin HEAD:r7e-portable-self-recording-final-20260901
