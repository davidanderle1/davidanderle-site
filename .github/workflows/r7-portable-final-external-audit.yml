name: R7 independent portable final external audit

on:
  push:
    branches:
      - r7-portable-final-external-audit-20260901
    paths:
      - '.github/workflows/r7-portable-final-external-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: r7-portable-final-external-audit
  cancel-in-progress: false

env:
  TZ: UTC
  R7F_BRANCH: r7f-portable-final-20260901
  R7F_WORKFLOW_PATH: .github/workflows/r7f-portable-final-verification.yml

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout independent audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0

      - name: Select and authenticate exact successful portable R7F
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          umask 022
          repo="$GITHUB_REPOSITORY"
          rm -rf audit-input audit-work audit-output
          mkdir -p audit-input audit-work audit-output
          selected=0
          for poll in $(seq 1 120); do
            gh api "repos/$repo/actions/runs?branch=$R7F_BRANCH&per_page=100" > /tmp/r7f-runs.json
            jq --arg path "$R7F_WORKFLOW_PATH" \
              '[.workflow_runs[] | select(.path==$path and .status=="completed" and .conclusion=="success")] | sort_by(.created_at) | reverse' \
              /tmp/r7f-runs.json > /tmp/r7f-success.json
            while IFS=$'\t' read -r run_id head_sha; do
              [[ -n "$run_id" && -n "$head_sha" ]] || continue
              gh api "repos/$repo/actions/runs/$run_id" > /tmp/r7f-run.json
              jq -e --arg head "$head_sha" --arg branch "$R7F_BRANCH" --arg path "$R7F_WORKFLOW_PATH" \
                '.head_sha==$head and .head_branch==$branch and .path==$path and .status=="completed" and .conclusion=="success"' \
                /tmp/r7f-run.json >/dev/null || continue
              gh api "repos/$repo/actions/runs/$run_id/artifacts" > /tmp/r7f-artifacts.json
              jq --arg name "r7f-generator-bound-portable-final-evidence-$head_sha" \
                '[.artifacts[] | select(.name==$name and .expired==false)]' /tmp/r7f-artifacts.json > /tmp/r7f-matches.json
              [[ "$(jq 'length' /tmp/r7f-matches.json)" -eq 1 ]] || continue
              jq '.[0]' /tmp/r7f-matches.json > /tmp/r7f-artifact.json
              artifact_id="$(jq -r '.id' /tmp/r7f-artifact.json)"
              artifact_name="$(jq -r '.name' /tmp/r7f-artifact.json)"
              artifact_digest="$(jq -r '.digest' /tmp/r7f-artifact.json)"
              curl --fail --silent --show-error --location \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'Accept: application/vnd.github+json' \
                "https://api.github.com/repos/$repo/actions/artifacts/$artifact_id/zip" \
                --output audit-input/r7f.zip || continue
              [[ "sha256:$(sha256sum audit-input/r7f.zip | awk '{print $1}')" == "$artifact_digest" ]] || continue
              cp /tmp/r7f-run.json audit-input/r7f-run.json
              cp /tmp/r7f-artifact.json audit-input/r7f-artifact.json
              printf '%s\n' "$run_id" > audit-input/r7f-run-id.txt
              printf '%s\n' "$head_sha" > audit-input/r7f-head-sha.txt
              printf '%s\n' "$artifact_id" > audit-input/r7f-artifact-id.txt
              printf '%s\n' "$artifact_name" > audit-input/r7f-artifact-name.txt
              printf '%s\n' "$artifact_digest" > audit-input/r7f-artifact-digest.txt
              selected=1
              break
            done < <(jq -r '.[] | [.id,.head_sha] | @tsv' /tmp/r7f-success.json)
            [[ "$selected" -eq 1 ]] && break
            if [[ "$poll" -eq 120 ]]; then
              cp /tmp/r7f-success.json audit-output/r7f-successful-run-candidates.json
              echo 'No successful generator-bound portable R7F available.' >&2
              exit 1
            fi
            sleep 15
          done
          test "$selected" -eq 1

      - name: Safely extract and verify the complete R7F internal manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import stat, zipfile
          from pathlib import Path, PurePosixPath
          archive=Path('audit-input/r7f.zip')
          out=Path('audit-work/extracted')
          out.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              names=[]
              for info in z.infolist():
                  p=PurePosixPath(info.filename)
                  if p.is_absolute() or '..' in p.parts or '\\' in info.filename:
                      raise SystemExit(f'unsafe path: {info.filename}')
                  if ((info.external_attr >> 16) & 0o170000)==stat.S_IFLNK:
                      raise SystemExit(f'symlink: {info.filename}')
                  names.append(info.filename)
              if len(names)!=len(set(names)):
                  raise SystemExit('duplicate ZIP member')
              z.extractall(out)
          roots=list(out.rglob('R7F_PACKAGE_VALIDATION.json'))
          if len(roots)!=1:
              raise SystemExit(f'package validation count={len(roots)}')
          Path('audit-work/root.txt').write_text(str(roots[0].parent.resolve())+'\n')
          PY
          root="$(cat audit-work/root.txt)"
          test -f "$root/R7F_ARTIFACT_SHA256SUMS.txt"
          (cd "$root" && sha256sum --check --strict R7F_ARTIFACT_SHA256SUMS.txt) > audit-output/r7f-internal-manifest-check.txt
          test "$(<$root/R7F_GATE_DECISION.txt)" = 'R7F FULL-HISTORY DYNAMIC FINGERPRINT INDEPENDENT VERIFICATION COMPLETE — READY FOR HISTORY-BOUND CONTROLLER'
          test "$(<$root/R7F_PORTABLE_GATE_DECISION.txt)" = 'R7F PORTABLE JSON SCHEMA INDEPENDENT VERIFICATION COMPLETE — READY FOR EXTERNAL AUDIT'
          jq -e '.schema=="R7F_GENERATOR_BOUND_PORTABLE_PACKAGE_VALIDATION_V1" and .passed==true and (.failedChecks|length)==0' "$root/R7F_PACKAGE_VALIDATION.json" >/dev/null

      - name: Independently authenticate the embedded R7E and generator lineage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          root="$(cat audit-work/root.txt)"
          selection="$root/R7F_EVIDENCE/r7e-selection.json"
          test -f "$selection"
          builder_run="$(jq -r '.lock.builderRunId' "$selection")"
          builder_commit="$(jq -r '.lock.builderHeadSha' "$selection")"
          builder_branch="$(jq -r '.lock.builderBranch' "$selection")"
          builder_path="$(jq -r '.lock.builderWorkflowPath' "$selection")"
          builder_artifact_id="$(jq -r '.lock.builderArtifactId' "$selection")"
          builder_artifact_name="$(jq -r '.lock.builderArtifactName' "$selection")"
          builder_digest="$(jq -r '.lock.builderArtifactDigest' "$selection")"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$builder_run" > audit-input/r7e-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$builder_artifact_id" > audit-input/r7e-artifact.json
          jq -e --arg head "$builder_commit" --arg branch "$builder_branch" --arg path "$builder_path" \
            '.head_sha==$head and .head_branch==$branch and .path==$path and .status=="completed" and .conclusion=="success"' \
            audit-input/r7e-run.json >/dev/null
          jq -e --argjson id "$builder_artifact_id" --arg name "$builder_artifact_name" --arg digest "$builder_digest" --argjson run "$builder_run" \
            '.id==$id and .name==$name and .digest==$digest and .expired==false and .workflow_run.id==$run' \
            audit-input/r7e-artifact.json >/dev/null

          rm -rf /tmp/r7e-lineage
          mkdir -p /tmp/r7e-lineage
          git fetch --no-tags --depth=1 origin "$builder_commit"
          git archive "$builder_commit" \
            .github/scripts/materialize-portable-r7e-workflow.py \
            .github/workflows/r7e-full-history-reconciled-verification.yml \
            .github/workflows/r7e-portable-json-schema-verification.yml \
            | tar -x -C /tmp/r7e-lineage
          cp /tmp/r7e-lineage/.github/workflows/r7e-portable-json-schema-verification.yml /tmp/r7e-lineage/committed.yml
          (
            cd /tmp/r7e-lineage
            python3 -m py_compile .github/scripts/materialize-portable-r7e-workflow.py
            python3 .github/scripts/materialize-portable-r7e-workflow.py > generator.stdout.txt
            cmp --silent committed.yml .github/workflows/r7e-portable-json-schema-verification.yml
            grep -q 'scripts/validate-json-schemas.mjs' .github/scripts/materialize-portable-r7e-workflow.py
            grep -q 'scripts/run-portable-schema-contract.mjs' .github/scripts/materialize-portable-r7e-workflow.py
            grep -Fq '."$schema"=="https://json-schema.org/draft/2020-12/schema"' .github/scripts/materialize-portable-r7e-workflow.py
            ! grep -q 'scripts/validate-json-schema.mjs' .github/scripts/materialize-portable-r7e-workflow.py
            ! grep -q 'scripts/verify-json-schema-drift.mjs' .github/scripts/materialize-portable-r7e-workflow.py
          )
          cp /tmp/r7e-lineage/committed.yml audit-output/r7e-committed-workflow.yml
          cp /tmp/r7e-lineage/.github/scripts/materialize-portable-r7e-workflow.py audit-output/r7e-generator.py
          cp /tmp/r7e-lineage/generator.stdout.txt audit-output/r7e-generator.stdout.txt

      - name: Independently revalidate portable schemas from packaged source
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$(cat audit-work/root.txt)"
          source=""
          for candidate in "$root/VERIFIER_PRODUCTION_SOURCE" "$root/BUILDER_PRODUCTION_SOURCE"; do
            if [[ -f "$candidate/package.json" && -f "$candidate/schemas/index.json" ]]; then
              source="$candidate"
              break
            fi
          done
          if [[ -z "$source" ]]; then
            source="$(dirname "$(find "$root" -type f -path '*/schemas/index.json' -print -quit)")/.."
            source="$(cd "$source" && pwd)"
          fi
          test -f "$source/package-lock.json"
          rm -rf audit-work/source
          mkdir -p audit-work/source
          cp -a "$source/." audit-work/source/
          rm -rf audit-work/source/node_modules audit-work/source/dist audit-work/source/.astro audit-work/source/.r7e-tmp
          (
            cd audit-work/source
            npm ci --audit=false --fund=false > ../external-npm-ci.stdout.txt 2> ../external-npm-ci.stderr.txt
            npm run schema:check > ../external-schema-check.stdout.txt 2> ../external-schema-check.stderr.txt
            npm run schema:contract > ../external-schema-contract.stdout.txt 2> ../external-schema-contract.stderr.txt
          )
          cat > audit-work/external-portable-audit.mjs <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { createRequire } from 'node:module';
          const root=path.resolve('audit-work/source');
          const require=createRequire(path.join(root,'package.json'));
          const AjvModule=require('ajv/dist/2020.js');const Ajv2020=AjvModule.default??AjvModule;
          const read=(p)=>JSON.parse(fs.readFileSync(p,'utf8'));
          const parseMd=(p)=>{const t=fs.readFileSync(p,'utf8');const end=t.indexOf('\n---\n',4);const o={};for(const line of t.slice(4,end).split('\n')){if(!line.trim())continue;const c=line.indexOf(':');o[line.slice(0,c).trim()]=JSON.parse(line.slice(c+1).trim());}return o;};
          const list=(d,s)=>fs.readdirSync(d,{recursive:true}).filter(x=>typeof x==='string'&&x.endsWith(s)).sort().map(x=>path.join(d,x));
          const schemaDir=path.join(root,'schemas');const actual=fs.readdirSync(schemaDir).filter(x=>x.endsWith('.json')).sort();const index=read(path.join(schemaDir,'index.json'));
          const schemaFiles=actual.filter(x=>x.endsWith('.schema.json'));const schemas=Object.fromEntries(schemaFiles.map(f=>[f,read(path.join(schemaDir,f))]));
          const ajv=new Ajv2020({allErrors:true,strict:true,validateFormats:false});ajv.addKeyword({keyword:'x-contract-version',schemaType:'string',valid:true});ajv.addKeyword({keyword:'x-source',schemaType:'string',valid:true});
          const validators=Object.fromEntries(Object.entries(schemas).map(([f,s])=>[f,ajv.compile(s)]));
          const c=path.join(root,'src/content');const groups={profile:list(path.join(c,'profile'),'.json').map(read),work:list(path.join(c,'work'),'.md').map(parseMd),writing:list(path.join(c,'writing'),'.md').map(parseMd),milestones:read(path.join(c,'milestones.json')),publicDocuments:read(path.join(c,'public-documents.json')),redirects:read(path.join(c,'redirects.json')),tombstones:read(path.join(c,'tombstones.json'))};
          const map={profile:'profile.schema.json',work:'work-record.schema.json',writing:'writing-record.schema.json',milestones:'milestone.schema.json',publicDocuments:'public-document.schema.json',redirects:'redirect-record.schema.json',tombstones:'tombstone-record.schema.json'};
          let count=0;const errors=[];for(const [g,rows] of Object.entries(groups)){for(const [i,row] of rows.entries()){count++;if(!validators[map[g]](row))errors.push({g,i,errors:validators[map[g]].errors});}}
          const corpus={schemaVersion:'1.0.0',...groups};if(!validators['canonical-content.schema.json'](corpus))errors.push({g:'corpus',errors:validators['canonical-content.schema.json'].errors});
          const invalid=structuredClone(groups.profile[0]);delete invalid.immutableId;const invalidRejected=validators['profile.schema.json'](invalid)===false;
          const checks={fileCount:actual.length===9,schemaCount:schemaFiles.length===8,indexDialect:index.$schema==='https://json-schema.org/draft/2020-12/schema',indexVersion:index.contractVersion==='1.0.0',allDialect:schemaFiles.every(f=>schemas[f].$schema==='https://json-schema.org/draft/2020-12/schema'),allVersion:schemaFiles.every(f=>schemas[f]['x-contract-version']==='1.0.0'),compiled:Object.keys(validators).length===8,records:count===12,valid:errors.length===0,negative:invalidRejected};
          const result={schema:'R7_EXTERNAL_PORTABLE_SCHEMA_AUDIT_V1',passed:Object.values(checks).every(Boolean),checks,recordCount:count,errors};fs.writeFileSync('audit-output/external-portable-schema-audit.json',JSON.stringify(result,null,2)+'\n');console.log(JSON.stringify(result,null,2));if(!result.passed)process.exit(1);
          NODE
          node audit-work/external-portable-audit.mjs

      - name: Recompute R7F evidence semantics and adversarial controls
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$(cat audit-work/root.txt)"
          python3 - <<'PY'
          import copy, hashlib, json, os, shutil, subprocess, tempfile
          from pathlib import Path
          root=Path('audit-work/root.txt').read_text().strip()
          root=Path(root)
          package=json.loads((root/'R7F_PACKAGE_VALIDATION.json').read_text())
          selection=json.loads((root/'R7F_EVIDENCE/r7e-selection.json').read_text())
          adaptations=json.loads((root/'R7F_EVIDENCE/verifier-adaptations.json').read_text())
          pb=json.loads((root/'R7F_EVIDENCE/independent-portable-schema-builder.json').read_text())
          pv=json.loads((root/'R7F_EVIDENCE/independent-portable-schema-verifier.json').read_text())
          pp=json.loads((root/'R7F_EVIDENCE/portable-schema-builder-verifier-parity.json').read_text())
          axe_b=json.loads((root/'R7F_EVIDENCE/independent-builder-axe-fingerprint-v2.json').read_text())
          axe_v=json.loads((root/'R7F_EVIDENCE/independent-verifier-axe-fingerprint-v2.json').read_text())
          desktop=json.loads((root/'R7F_EVIDENCE/negative-control-desktop-target-v2.json').read_text())
          mobile=json.loads((root/'R7F_EVIDENCE/negative-control-mobile-related-owner-v2.json').read_text())
          proof=json.loads((root/'R7F_EVIDENCE/negative-control-proof-binding-v2.json').read_text())
          inventory=json.loads((root/'R7F_EVIDENCE/negative-control-self-consistent-inventory-v2.json').read_text())
          bm=axe_b.get('metrics') or {};vm=axe_v.get('metrics') or {}
          checks={
            'packagePassed':package.get('passed') is True and package.get('failedChecks')==[],
            'generatorBound':((selection.get('audit') or {}).get('checks') or {}).get('generatorReproducesCommittedWorkflowByteExactly') is True,
            'adaptationsBounded':adaptations.get('passed') is True and adaptations.get('unboundedChanges') is False,
            'portableBuilder':pb.get('passed') is True,
            'portableVerifier':pv.get('passed') is True,
            'portableParity':pp.get('passed') is True and pb.get('schemaTreeSha256')==pv.get('schemaTreeSha256'),
            'axeBuilder':axe_b.get('passed') is True,
            'axeVerifier':axe_v.get('passed') is True,
            'axeCount498':bm.get('nodeCount')==vm.get('nodeCount')==498,
            'axeInventoryParity':bm.get('inventorySha256')==vm.get('inventorySha256'),
            'axeNodeSetParity':bm.get('nodeFingerprintSetSha256')==vm.get('nodeFingerprintSetSha256'),
            'axeBindingSetParity':bm.get('bindingFingerprintSetSha256')==vm.get('bindingFingerprintSetSha256'),
            'desktopMutationRejected':desktop.get('passed') is False,
            'mobileMutationRejected':mobile.get('passed') is False,
            'proofMutationRejected':proof.get('passed') is False,
            'selfConsistentInventoryMutationRejected':inventory.get('passed') is False,
          }
          cases=[]
          def case(name, rejected): cases.append({'name':name,'rejected':bool(rejected)})
          manifest=(root/'R7F_ARTIFACT_SHA256SUMS.txt').read_text()
          with tempfile.TemporaryDirectory() as td:
              t=Path(td);shutil.copytree(root,t/'a');
              p=t/'a/R7F_PACKAGE_VALIDATION.json';x=json.loads(p.read_text());x['passed']=False;p.write_text(json.dumps(x));
              rc=subprocess.run(['sha256sum','--check','--strict','R7F_ARTIFACT_SHA256SUMS.txt'],cwd=t/'a',stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode
              case('mutated-package-breaks-manifest',rc!=0)
          bad=copy.deepcopy(selection);bad['lock']['builderArtifactDigest']='sha256:'+'0'*64
          case('mutated-builder-digest-rejected',bad['lock']['builderArtifactDigest']!=(selection['lock']['builderArtifactDigest']))
          bad=copy.deepcopy(adaptations);bad['unboundedChanges']=True
          case('unbounded-adaptation-rejected',bad.get('unboundedChanges') is not False)
          bad=copy.deepcopy(pp);bad['checks']['schemaTreeParity']=False
          case('schema-parity-mutation-rejected',bad.get('passed') is not True or bad['checks']['schemaTreeParity'] is not True)
          case('desktop-negative-control-nonvacuous',desktop.get('passed') is False and len(desktop.get('failedChecks') or [])>0)
          case('mobile-negative-control-nonvacuous',mobile.get('passed') is False and len(mobile.get('failedChecks') or [])>0)
          case('proof-negative-control-nonvacuous',proof.get('passed') is False and len(proof.get('failedChecks') or [])>0)
          case('inventory-negative-control-nonvacuous',inventory.get('passed') is False and len(inventory.get('failedChecks') or [])>0)
          result={'schema':'R7_PORTABLE_FINAL_EXTERNAL_SEMANTIC_AUDIT_V1','passed':all(checks.values()) and all(c['rejected'] for c in cases),'checks':checks,'failedChecks':[k for k,v in checks.items() if not v],'adversarialCases':cases,'failedCases':[c['name'] for c in cases if not c['rejected']]}
          Path('audit-output/external-semantic-audit.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          if not result['passed']: raise SystemExit(1)
          PY

      - name: Assemble immutable external-audit decision
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          run=json.loads(Path('audit-input/r7f-run.json').read_text())
          artifact=json.loads(Path('audit-input/r7f-artifact.json').read_text())
          semantic=json.loads(Path('audit-output/external-semantic-audit.json').read_text())
          portable=json.loads(Path('audit-output/external-portable-schema-audit.json').read_text())
          checks={
            'r7fRunSuccess':run.get('status')=='completed' and run.get('conclusion')=='success',
            'r7fArtifactActive':artifact.get('expired') is False,
            'outerArtifactDigest':'sha256:'+hashlib.sha256(Path('audit-input/r7f.zip').read_bytes()).hexdigest()==artifact.get('digest'),
            'semanticAudit':semantic.get('passed') is True,
            'portableExternalAudit':portable.get('passed') is True,
            'adversarialCases':len(semantic.get('adversarialCases') or [])==8 and not semantic.get('failedCases'),
          }
          decision={
            'schema':'R7_PORTABLE_FINAL_EXTERNAL_AUDIT_TUPLE_V1',
            'decision':'R7_PORTABLE_FINAL_EXTERNAL_AUDIT_PASS' if all(checks.values()) else 'R7_PORTABLE_FINAL_EXTERNAL_AUDIT_FAIL',
            'passed':all(checks.values()),
            'repository':'davidanderle1/davidanderle-site',
            'r7f':{
              'branch':run.get('head_branch'),'workflowPath':run.get('path'),'headSha':run.get('head_sha'),'runId':run.get('id'),
              'artifactId':artifact.get('id'),'artifactName':artifact.get('name'),'artifactDigest':artifact.get('digest'),
            },
            'checks':checks,
            'failedChecks':[k for k,v in checks.items() if not v],
            'blockers':[] if all(checks.values()) else [k for k,v in checks.items() if not v],
            'maximumAuthorizedVerdict':'R7_ENGINEERING_CLOSURE_CANDIDATE_READY',
            'finalR7ClosureAuthorized':False,
          }
          Path('audit-output/R7_PORTABLE_FINAL_EXTERNAL_AUDIT.json').write_text(json.dumps(decision,indent=2)+'\n')
          print(json.dumps(decision,indent=2))
          if not decision['passed']: raise SystemExit(1)
          PY
          printf 'R7 PORTABLE FINAL EXTERNAL AUDIT PASS — READY FOR HISTORY TRACEABILITY CONTROLLER\n' > audit-output/R7_PORTABLE_FINAL_EXTERNAL_AUDIT_DECISION.txt
          (
            cd audit-output
            find . -type f ! -name 'R7_PORTABLE_FINAL_EXTERNAL_AUDIT_SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > R7_PORTABLE_FINAL_EXTERNAL_AUDIT_SHA256SUMS.txt
            sha256sum --check --strict R7_PORTABLE_FINAL_EXTERNAL_AUDIT_SHA256SUMS.txt
          )

      - name: Upload independent external-audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7-portable-final-external-audit-${{ github.sha }}
          path: |
            audit-output/
            audit-input/r7f-run.json
            audit-input/r7f-artifact.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
          include-hidden-files: true
