name: R7E portable JSON Schema independent preflight v2

on:
  push:
    branches:
      - r7e-portable-json-schema-verification-20260831
    paths:
      - '.github/workflows/r7e-portable-schema-independent-preflight-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r7e-portable-schema-independent-preflight-v2-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact portable-schema branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0

      - name: Materialize exact packed canonical source
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          rm -rf candidate preflight-artifact r7e-native-source.zip
          mkdir -p candidate preflight-artifact
          sha256sum --check --strict .r7e-source/SHA256SUMS | tee preflight-artifact/source-chunk-check.txt
          cat .r7e-source/part*.b64 | tr -d '\r\n' | base64 --decode > r7e-native-source.zip
          actual="$(sha256sum r7e-native-source.zip | awk '{print $1}')"
          expected="$(tr -d '\r\n' < .r7e-source/ARCHIVE_SHA256)"
          printf 'expected=%s\nactual=%s\n' "$expected" "$actual" | tee preflight-artifact/source-archive-identity.txt
          test "$actual" = "$expected"
          unzip -q r7e-native-source.zip -d candidate
          test -f candidate/package.json
          test -f candidate/package-lock.json
          test -f candidate/src/content.config.ts

      - name: Install locked dependencies
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v24.20.0'
          test "$(npm --version)" = '11.19.0'
          npm ci --audit=false --fund=false > ../preflight-artifact/npm-ci.stdout.txt 2> ../preflight-artifact/npm-ci.stderr.txt

      - name: Independently exercise portable Draft 2020-12 contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          root=Path('candidate')
          package=json.loads((root/'package.json').read_text())
          scripts=package.get('scripts') or {}
          schema_scripts={k:v for k,v in scripts.items() if 'schema' in k.lower()}
          def pick(pattern):
              rows=[k for k in schema_scripts if re.search(pattern,k,re.I)]
              if len(rows)!=1:
                  raise SystemExit(f'Expected exactly one schema script matching {pattern!r}, found {rows}')
              return rows[0]
          selected={
              'generate':pick(r'(schema.*generate|generate.*schema)'),
              'verify':pick(r'(schema.*(verify|check)|(verify|check).*schema)'),
              'validate':pick(r'(schema.*validate|validate.*schema)'),
          }
          schema_files=sorted(p for p in root.rglob('*.schema.json') if 'node_modules' not in p.parts)
          if len(schema_files)<4:
              raise SystemExit(f'Expected at least four committed *.schema.json files, found {len(schema_files)}')
          rows=[]
          for path in schema_files:
              data=json.loads(path.read_text())
              rows.append({
                  'path':path.relative_to(root).as_posix(),
                  'draft':data.get('$schema'),
                  'id':data.get('$id'),
              })
              if data.get('$schema')!='https://json-schema.org/draft/2020-12/schema':
                  raise SystemExit(f'{path}: not Draft 2020-12')
              if not isinstance(data.get('$id'),str) or not data['$id']:
                  raise SystemExit(f'{path}: missing stable $id')
          manifests=sorted(p for p in root.rglob('*.json') if 'schema' in p.as_posix().lower() and 'manifest' in p.name.lower() and 'node_modules' not in p.parts)
          if not manifests:
              raise SystemExit('Portable schema manifest is required')
          generator_candidates=sorted(p for p in root.rglob('*') if p.is_file() and 'schema' in p.name.lower() and p.suffix in {'.mjs','.js','.ts'} and 'node_modules' not in p.parts)
          generator_text='\n'.join(p.read_text(errors='replace') for p in generator_candidates)
          if 'content.config' not in generator_text or not re.search(r'(toJSONSchema|toJsonSchema)',generator_text):
              raise SystemExit('Schema generator is not visibly derived from the typed content configuration')
          deps={**(package.get('dependencies') or {}),**(package.get('devDependencies') or {})}
          ajv=deps.get('ajv')
          if not isinstance(ajv,str) or re.match(r'^[~^*]|^(latest|next)$',ajv):
              raise SystemExit(f'Ajv must be directly and exactly pinned, got {ajv!r}')
          result={
              'selectedScripts':selected,
              'schemaScripts':schema_scripts,
              'schemaFiles':rows,
              'manifestFiles':[p.relative_to(root).as_posix() for p in manifests],
              'generatorFiles':[p.relative_to(root).as_posix() for p in generator_candidates],
              'ajvVersion':ajv,
          }
          Path('preflight-artifact/discovery.json').write_text(json.dumps(result,indent=2)+'\n')
          Path('/tmp/schema-generate-script').write_text(selected['generate'])
          Path('/tmp/schema-verify-script').write_text(selected['verify'])
          Path('/tmp/schema-validate-script').write_text(selected['validate'])
          Path('/tmp/first-schema-file').write_text(str(schema_files[0]))
          PY

          GEN="$(cat /tmp/schema-generate-script)"
          VERIFY="$(cat /tmp/schema-verify-script)"
          VALIDATE="$(cat /tmp/schema-validate-script)"

          (
            cd candidate
            npm run "$VERIFY" > ../preflight-artifact/schema-verify-initial.stdout.txt 2> ../preflight-artifact/schema-verify-initial.stderr.txt
            npm run "$VALIDATE" > ../preflight-artifact/schema-validate-initial.stdout.txt 2> ../preflight-artifact/schema-validate-initial.stderr.txt
          )

          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('candidate')
          rows=[]
          for p in sorted(x for x in root.rglob('*.schema.json') if 'node_modules' not in x.parts):
              rows.append({'path':p.relative_to(root).as_posix(),'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'size':p.stat().st_size})
          Path('preflight-artifact/schema-tree-before-generate.json').write_text(json.dumps(rows,indent=2)+'\n')
          PY
          (
            cd candidate
            npm run "$GEN" > ../preflight-artifact/schema-generate.stdout.txt 2> ../preflight-artifact/schema-generate.stderr.txt
            npm run "$VERIFY" > ../preflight-artifact/schema-verify-after-generate.stdout.txt 2> ../preflight-artifact/schema-verify-after-generate.stderr.txt
          )
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('candidate')
          before=json.loads(Path('preflight-artifact/schema-tree-before-generate.json').read_text())
          after=[]
          for p in sorted(x for x in root.rglob('*.schema.json') if 'node_modules' not in x.parts):
              after.append({'path':p.relative_to(root).as_posix(),'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'size':p.stat().st_size})
          result={'passed':before==after,'before':before,'after':after}
          Path('preflight-artifact/deterministic-regeneration.json').write_text(json.dumps(result,indent=2)+'\n')
          if not result['passed']:
              raise SystemExit('Committed portable schemas drift after deterministic generation')
          PY

          # Negative control: a semantically stale committed schema must be rejected.
          schema_file="$(cat /tmp/first-schema-file)"
          cp "$schema_file" /tmp/schema-backup.json
          python3 - "$schema_file" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]); x=json.loads(p.read_text()); x['x-r7-stale-negative-control']=True; p.write_text(json.dumps(x,indent=2)+'\n')
          PY
          set +e
          (cd candidate && npm run "$VERIFY") > preflight-artifact/stale-schema-negative.stdout.txt 2> preflight-artifact/stale-schema-negative.stderr.txt
          stale_status=$?
          set -e
          cp /tmp/schema-backup.json "$schema_file"
          test "$stale_status" -ne 0
          (cd candidate && npm run "$VERIFY") > preflight-artifact/schema-verify-restored.stdout.txt 2> preflight-artifact/schema-verify-restored.stderr.txt

          # Negative control: a physically invalid repository Profile record must be rejected.
          profile='candidate/src/content/profile/profile-david-anderle.json'
          cp "$profile" /tmp/profile-backup.json
          python3 - "$profile" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]); x=json.loads(p.read_text()); x['expectedCompletion']='June 2099'; x['startDate']='2099-01-02'; p.write_text(json.dumps(x,indent=2)+'\n')
          PY
          set +e
          (cd candidate && npm run "$VALIDATE") > preflight-artifact/invalid-record-negative.stdout.txt 2> preflight-artifact/invalid-record-negative.stderr.txt
          invalid_status=$?
          set -e
          cp /tmp/profile-backup.json "$profile"
          test "$invalid_status" -ne 0
          (cd candidate && npm run "$VALIDATE") > preflight-artifact/schema-validate-restored.stdout.txt 2> preflight-artifact/schema-validate-restored.stderr.txt

          # Independently compile every committed schema using Ajv 2020.
          (
            cd candidate
            node --input-type=module - <<'NODE' > ../preflight-artifact/independent-ajv-compile.json
          import fs from 'node:fs';
          import path from 'node:path';
          import Ajv2020 from 'ajv/dist/2020.js';
          const walk=(dir)=>fs.readdirSync(dir,{withFileTypes:true}).flatMap((e)=>e.name==='node_modules'?[]:e.isDirectory()?walk(path.join(dir,e.name)):[path.join(dir,e.name)]);
          const files=walk('.').filter((p)=>p.endsWith('.schema.json')).sort();
          const schemas=files.map((file)=>({file,schema:JSON.parse(fs.readFileSync(file,'utf8'))}));
          const ajv=new Ajv2020({allErrors:true,strict:true});
          for(const {schema} of schemas) ajv.addSchema(schema);
          for(const {schema} of schemas) ajv.compile(schema);
          console.log(JSON.stringify({passed:true,schemaCount:schemas.length,files},null,2));
          NODE
          )

          (
            cd candidate
            npm run check > ../preflight-artifact/astro-check.stdout.txt 2> ../preflight-artifact/astro-check.stderr.txt
            npm run build > ../preflight-artifact/build.stdout.txt 2> ../preflight-artifact/build.stderr.txt
          )

          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('preflight-artifact')
          checks={
              'sourceTransport':True,
              'draft202012':True,
              'typedSourceDerivation':True,
              'schemaManifest':True,
              'exactAjvPin':True,
              'initialVerify':True,
              'initialValidation':True,
              'deterministicRegeneration':json.loads((root/'deterministic-regeneration.json').read_text())['passed'],
              'staleSchemaRejected':True,
              'invalidRepositoryRecordRejected':True,
              'independentAjvCompilation':json.loads((root/'independent-ajv-compile.json').read_text())['passed'],
              'astroCheck':True,
              'productionBuild':True,
          }
          result={
              'schema':'R7E_PORTABLE_JSON_SCHEMA_INDEPENDENT_PREFLIGHT_V2',
              'decision':'PORTABLE_JSON_SCHEMA_PREFLIGHT_PASS' if all(checks.values()) else 'PORTABLE_JSON_SCHEMA_PREFLIGHT_FAIL',
              'passed':all(checks.values()),
              'checks':checks,
              'failedChecks':[k for k,v in checks.items() if not v],
              'repository':os.environ.get('GITHUB_REPOSITORY'),
              'workflowCommit':os.environ.get('GITHUB_SHA'),
              'runId':os.environ.get('GITHUB_RUN_ID'),
              'sourceArchiveSha256':Path('.r7e-source/ARCHIVE_SHA256').read_text().strip(),
          }
          (root/'R7E_PORTABLE_SCHEMA_PREFLIGHT_V2.json').write_text(json.dumps(result,indent=2)+'\n')
          if not result['passed']:
              raise SystemExit(1)
          manifest=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file() and x.name!='SHA256SUMS.txt'):
              manifest.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root).as_posix()}\n")
          (root/'SHA256SUMS.txt').write_text(''.join(manifest))
          PY
          (cd preflight-artifact && sha256sum --check --strict SHA256SUMS.txt)

      - name: Upload independent portable-schema preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7e-portable-schema-independent-preflight-v2-${{ github.sha }}
          path: preflight-artifact/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
          include-hidden-files: true
