name: Bootstrap final self-recording R7E script repair v2

on:
  push:
    branches:
      - r7e-portable-self-recording-final-20260901
    paths:
      - '.github/workflows/r7e-self-recording-script-repair-bootstrap-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r7e-self-recording-script-repair-bootstrap-v2
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout isolated final R7E branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Repair generator and generated-plan executor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path

          generator = Path('.github/scripts/materialize-portable-r7e-workflow.py')
          text = generator.read_text(encoding='utf-8')
          replacements = [
              (
                  'scripts/validate-json-schema.mjs scripts/verify-json-schema-drift.mjs',
                  'scripts/validate-json-schemas.mjs scripts/run-portable-schema-contract.mjs',
                  'current portable verifier paths',
              ),
              (
                  '.contractVersion=="1.0.0" and .dialect=="https://json-schema.org/draft/2020-12/schema"',
                  '.contractVersion=="1.0.0" and ."$schema"=="https://json-schema.org/draft/2020-12/schema"',
                  'standard JSON Schema dialect field',
              ),
          ]
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one stale anchor, found {count}')
              text = text.replace(old, new, 1)
          generator.write_text(text, encoding='utf-8')

          encoded_main = ''
          executor = Path('.github/scripts/execute-generated-r7e-plan.py')
          source = executor.read_text(encoding='utf-8')
          start = source.index('def main() -> None:\n')
          end = source.index('\n\nif __name__ == "__main__":')
          new_main = base64.b64decode(encoded_main).decode('utf-8')
          executor.write_text(source[:start] + new_main + source[end:], encoding='utf-8')
          PY

          python3 -m py_compile \
            .github/scripts/materialize-portable-r7e-workflow.py \
            .github/scripts/execute-generated-r7e-plan.py
          python3 .github/scripts/materialize-portable-r7e-workflow.py
          ! grep -q 'scripts/validate-json-schema.mjs' .github/workflows/r7e-portable-json-schema-verification.yml
          ! grep -q 'scripts/verify-json-schema-drift.mjs' .github/workflows/r7e-portable-json-schema-verification.yml
          grep -q 'scripts/validate-json-schemas.mjs' .github/workflows/r7e-portable-json-schema-verification.yml
          grep -q 'scripts/run-portable-schema-contract.mjs' .github/workflows/r7e-portable-json-schema-verification.yml
          grep -Fq '.contractVersion=="1.0.0" and ."$schema"=="https://json-schema.org/draft/2020-12/schema"' .github/workflows/r7e-portable-json-schema-verification.yml
          git checkout -- .github/workflows/r7e-portable-json-schema-verification.yml

          cat > /tmp/r7e-plan-success.yml <<'YAML'
          jobs:
            verify:
              runs-on: ubuntu-24.04
              steps:
                - name: success
                  run: printf success > /tmp/r7e-plan-success-marker
                - name: failure-only-skipped
                  if: failure()
                  run: exit 91
                - name: always
                  if: always()
                  run: printf always > /tmp/r7e-plan-always-marker
          YAML
          sed -i 's/^          //' /tmp/r7e-plan-success.yml
          python3 .github/scripts/execute-generated-r7e-plan.py /tmp/r7e-plan-success.yml /tmp/r7e-plan-success.json
          jq -e '.passed==true and .executedRunStepCount==2 and .skippedConditionCount==1 and .firstFailure==null' /tmp/r7e-plan-success.json >/dev/null
          test "$(cat /tmp/r7e-plan-success-marker)" = success
          test "$(cat /tmp/r7e-plan-always-marker)" = always

          cat > /tmp/r7e-plan-failure.yml <<'YAML'
          jobs:
            verify:
              runs-on: ubuntu-24.04
              steps:
                - name: deliberate-failure
                  run: exit 7
                - name: success-only-skipped
                  run: printf bad > /tmp/r7e-plan-should-not-exist
                - name: failure-handler
                  if: failure()
                  run: printf handled > /tmp/r7e-plan-failure-marker
                - name: always-handler
                  if: always()
                  run: printf always > /tmp/r7e-plan-failure-always-marker
          YAML
          sed -i 's/^          //' /tmp/r7e-plan-failure.yml
          set +e
          python3 .github/scripts/execute-generated-r7e-plan.py /tmp/r7e-plan-failure.yml /tmp/r7e-plan-failure.json
          status=$?
          set -e
          test "$status" -ne 0
          jq -e '.passed==false and .executedRunStepCount==3 and .skippedConditionCount==1 and .firstFailure.exitCode==7 and .firstFailure.name=="deliberate-failure"' /tmp/r7e-plan-failure.json >/dev/null
          test ! -e /tmp/r7e-plan-should-not-exist
          test "$(cat /tmp/r7e-plan-failure-marker)" = handled
          test "$(cat /tmp/r7e-plan-failure-always-marker)" = always

      - name: Commit repaired scripts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/scripts/materialize-portable-r7e-workflow.py \
            .github/scripts/execute-generated-r7e-plan.py
          test -n "$(git diff --cached --name-only)"
          git diff --cached --check
          git commit -m 'R7E: repair self-recording generator and condition semantics'
          git push origin HEAD:r7e-portable-self-recording-final-20260901
