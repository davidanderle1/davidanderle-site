name: R7F hardened independent Astro verification v6 exact fingerprint

on:
  push:
    branches:
      - r7f-hardened-independent-verification-v6-20260830
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: r7f-hardened-v6-exact-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC
  SOURCE_DATE_EPOCH: '1787961600'
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout independent verifier branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0

      - name: Execute locked exact-fingerprint verifier
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/r7f-v6-final.sh

      - name: Upload R7F v6 evidence or diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7f-hardened-independent-v6-exact-evidence-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
          include-hidden-files: true
