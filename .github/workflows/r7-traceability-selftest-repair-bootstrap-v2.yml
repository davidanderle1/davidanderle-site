name: Bootstrap final traceability repair v2

on:
  push:
    branches:
      - r7-full-history-traceability-final-20260901
    paths:
      - '.github/workflows/r7-traceability-selftest-repair-bootstrap-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r7-traceability-selftest-repair-bootstrap-v2
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout final traceability branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Apply and validate traceability invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/patch-r7-traceability-final.py
          python3 .github/scripts/patch-r7-traceability-final.py
          ruby -ryaml -e 'YAML.safe_load(File.read(ARGV[0]), aliases: true)' .github/workflows/r7-full-history-traceability-final.yml
          grep -q 'additionalCarryForwardIds' .github/workflows/r7-full-history-traceability-final.yml
          grep -q 'expected_carry_ids==set(cids)' .github/workflows/r7-full-history-traceability-final.yml
          grep -q "all(r\['status'\].startswith('DEFERRED_BOUND_')" .github/workflows/r7-full-history-traceability-final.yml

      - name: Commit repaired traceability authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/r7-full-history-traceability-final.yml
          test -n "$(git diff --cached --name-only)"
          git diff --cached --check
          git commit -m 'R7: enforce future-phase and exact carry-forward invariants'
          git push origin HEAD:r7-full-history-traceability-final-20260901
