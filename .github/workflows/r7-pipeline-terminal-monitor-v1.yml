name: R7 persistent terminal pipeline monitor v1

on:
  push:
    branches:
      - r7-pipeline-status-snapshot-v1-20260901
    paths:
      - '.github/workflows/r7-pipeline-terminal-monitor-v1.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: r7-pipeline-terminal-monitor-v1
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
      - name: Checkout monitor branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Monitor exact authoritative chain to terminal state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .github/r7-status terminal-monitor
          cat > terminal-monitor/stages.json <<'JSON'
          [
            {"id":"portable-r7e-v3","branch":"r7e-portable-authoritative-v3-20260901","workflowPath":".github/workflows/r7e-portable-authoritative-executor-v3.yml","statusPath":".github/r7-status/portable-r7e-v3.json"},
            {"id":"portable-r7f-v7","branch":"r7f-portable-authoritative-v2-20260901","workflowPath":".github/workflows/r7f-portable-authoritative-v7.yml","statusPath":".github/r7-status/portable-r7f-v7.json"},
            {"id":"portable-external-audit-v5","branch":"r7-portable-external-audit-v2-20260901","workflowPath":".github/workflows/r7-portable-external-audit-v5.yml","statusPath":".github/r7-status/portable-external-audit-v5.json"},
            {"id":"full-history-traceability-v4","branch":"r7-full-history-traceability-v4-20260901","workflowPath":".github/workflows/r7-full-history-traceability-v4.yml","statusPath":".github/r7-status/full-history-traceability-v4.json"},
            {"id":"history-bound-controller-v5","branch":"r7-history-bound-controller-v3-20260901","workflowPath":".github/workflows/r7-history-bound-controller-v5.yml","statusPath":null},
            {"id":"controller-external-audit-v3","branch":"r7-controller-external-audit-v1-20260901","workflowPath":".github/workflows/r7-controller-external-audit-v3.yml","statusPath":".github/r7-status/R7_FINAL_ENGINEERING_CLOSURE_V3.json"}
          ]
          JSON
          python3 - <<'PY'
          import base64,json,os,subprocess,time
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; stages=json.loads(Path('terminal-monitor/stages.json').read_text())
          def gh(endpoint):
              result=subprocess.run(['gh','api',endpoint],text=True,capture_output=True)
              if result.returncode!=0: return None,result.stderr.strip()
              try: return json.loads(result.stdout),None
              except Exception as exc: return None,f'JSON parse failed: {exc}'
          def snapshot():
              rows=[]
              for stage in stages:
                  branch,branch_error=gh(f"repos/{repo}/branches/{stage['branch']}"); head=branch.get('commit',{}).get('sha') if branch else None
                  runs,runs_error=gh(f"repos/{repo}/actions/runs?branch={stage['branch']}&per_page=100")
                  matches=[]
                  if runs:
                      matches=[run for run in runs.get('workflow_runs',[]) if run.get('path')==stage['workflowPath']]
                      matches.sort(key=lambda run:run.get('id',0),reverse=True)
                  latest=matches[0] if matches else None
                  jobs=artifacts=None; jobs_error=artifacts_error=None
                  if latest:
                      jobs,jobs_error=gh(f"repos/{repo}/actions/runs/{latest['id']}/jobs?per_page=100")
                      artifacts,artifacts_error=gh(f"repos/{repo}/actions/runs/{latest['id']}/artifacts?per_page=100")
                  status_present=False; status_document=None; status_error=None
                  if stage['statusPath']:
                      status,status_error=gh(f"repos/{repo}/contents/{stage['statusPath']}?ref={stage['branch']}")
                      if status and status.get('content'):
                          status_present=True
                          try: status_document=json.loads(base64.b64decode(status['content']).decode())
                          except Exception as exc: status_error=f'status decode failed: {exc}'
                  rows.append({**stage,'branchHead':head,'branchError':branch_error,'latestRun':latest,'latestJobs':jobs.get('jobs',[]) if jobs else None,'latestArtifacts':artifacts.get('artifacts',[]) if artifacts else None,'runQueryError':runs_error,'jobsQueryError':jobs_error,'artifactsQueryError':artifacts_error,'statusPresent':status_present,'statusDocument':status_document,'statusError':status_error})
              return rows
          terminal=None
          history=[]
          for attempt in range(1,221):
              rows=snapshot()
              compact=[{'id':row['id'],'head':row['branchHead'],'runId':row['latestRun'].get('id') if row['latestRun'] else None,'status':row['latestRun'].get('status') if row['latestRun'] else None,'conclusion':row['latestRun'].get('conclusion') if row['latestRun'] else None,'marker':row['statusPresent']} for row in rows]
              history.append({'attempt':attempt,'stages':compact})
              closure=rows[-1]
              if closure['statusPresent'] and closure['statusDocument'].get('schema')=='R7_FINAL_ENGINEERING_CLOSURE_TUPLE_V3' and closure['statusDocument'].get('decision')=='R7_CLOSED':
                  terminal={'schema':'R7_PIPELINE_TERMINAL_STATE_V1','terminal':True,'decision':'R7_CLOSED','attempt':attempt,'closure':closure['statusDocument'],'stages':rows}
                  break
              failed=[]
              for row in rows:
                  run=row['latestRun']
                  if run and run.get('status')=='completed' and run.get('conclusion') not in ('success','skipped') and not row['statusPresent']:
                      failed.append(row)
              if failed:
                  terminal={'schema':'R7_PIPELINE_TERMINAL_STATE_V1','terminal':True,'decision':'PIPELINE_BLOCKED','attempt':attempt,'firstFailedStage':failed[0]['id'],'stages':rows}
                  break
              time.sleep(30)
          if terminal is None:
              terminal={'schema':'R7_PIPELINE_TERMINAL_STATE_V1','terminal':False,'decision':'MONITOR_TIMEOUT','attempt':220,'stages':snapshot()}
          terminal['historyTail']=history[-10:]
          Path('.github/r7-status/PIPELINE_TERMINAL_V1.json').write_text(json.dumps(terminal,indent=2)+'\n')
          print(json.dumps({'terminal':terminal['terminal'],'decision':terminal['decision'],'attempt':terminal['attempt'],'firstFailedStage':terminal.get('firstFailedStage')},indent=2))
          PY
          jq -e '.schema=="R7_PIPELINE_TERMINAL_STATE_V1" and (.decision=="R7_CLOSED" or .decision=="PIPELINE_BLOCKED" or .decision=="MONITOR_TIMEOUT")' .github/r7-status/PIPELINE_TERMINAL_V1.json >/dev/null

      - name: Persist terminal state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/r7-status/PIPELINE_TERMINAL_V1.json
          git diff --cached --check
          git commit -m 'R7: persist authoritative terminal pipeline state'
          git fetch origin r7-pipeline-status-snapshot-v1-20260901
          git rebase origin/r7-pipeline-status-snapshot-v1-20260901
          git push origin HEAD:r7-pipeline-status-snapshot-v1-20260901
