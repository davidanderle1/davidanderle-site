name: R7E Lighthouse stability source bootstrap

on:
  push:
    branches:
      - r7e-hardened-verification-20260829
    paths:
      - '.github/workflows/r7e-lighthouse-stability-bootstrap.yml'
      - '.github/r7-closure/r7e-lighthouse-stability.patch'
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: UTC
  SOURCE_DATE_EPOCH: '1787961600'

jobs:
  bootstrap:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact R7E branch state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Derive deterministic Lighthouse-stabilized canonical source
        shell: bash
        run: |
          set -euo pipefail
          readonly PREDECESSOR_ARCHIVE_SHA='5dd1b86fb4d9e29be64645a475e3daf9b8fd5653bda8388457a5f2321c7bf4a9'
          readonly RESULT_ARCHIVE_SHA='050122d4fd11e6e61451928713d7ff8de06e4b7d8ffcd9b965677139c91eed62'
          readonly PATCH_SHA='74f7407dd9a4d3de440c8e622c0867d4fce513f76af3aa352acfb16d85a76ff7'
          readonly BEFORE_SCRIPT_SHA='624206b359e25e33e4f150ae2ba8aa00a877aff76ab0fb207db7d94f356ba670'
          readonly AFTER_SCRIPT_SHA='61a706b10c20f136079354121d9a6c616d68d129d7a500f5f298547d590fa4a6'
          readonly PATCH='.github/r7-closure/r7e-lighthouse-stability.patch'

          printf '%s  %s\n' "$PATCH_SHA" "$PATCH" | sha256sum --check --strict
          sha256sum --check --strict .r7e-source/SHA256SUMS
          current_archive_sha=$(tr -d '\r\n' < .r7e-source/ARCHIVE_SHA256)
          if [[ "$current_archive_sha" == "$RESULT_ARCHIVE_SHA" ]]; then
            echo 'LIGHTHOUSE_STABILITY_SOURCE_ALREADY_CURRENT'
            exit 0
          fi
          test "$current_archive_sha" = "$PREDECESSOR_ARCHIVE_SHA"

          rm -rf canonical /tmp/r7e-lh-pack1 /tmp/r7e-lh-pack2
          rm -f /tmp/r7e-lh-predecessor.zip /tmp/r7e-lh-source1.zip /tmp/r7e-lh-source2.zip
          mkdir canonical
          cat .r7e-source/part*.b64 | tr -d '\r\n' | base64 --decode > /tmp/r7e-lh-predecessor.zip
          printf '%s  %s\n' "$PREDECESSOR_ARCHIVE_SHA" /tmp/r7e-lh-predecessor.zip | sha256sum --check --strict
          unzip -q /tmp/r7e-lh-predecessor.zip -d canonical
          printf '%s  %s\n' "$BEFORE_SCRIPT_SHA" canonical/scripts/run-lighthouse.mjs | sha256sum --check --strict

          (
            cd canonical
            git init -q
            git add -A
            git -c user.name='r7e-lighthouse-bootstrap' -c user.email='r7e-lighthouse-bootstrap@example.invalid' commit -qm 'immutable predecessor source'
            git apply --check "$GITHUB_WORKSPACE/$PATCH"
            git apply "$GITHUB_WORKSPACE/$PATCH"
            git diff --check
            test "$(git diff --name-only)" = 'scripts/run-lighthouse.mjs'
          )
          printf '%s  %s\n' "$AFTER_SCRIPT_SHA" canonical/scripts/run-lighthouse.mjs | sha256sum --check --strict
          node --check canonical/scripts/run-lighthouse.mjs
          grep -q "id: 'isolated-runner-warmup-v1'" canonical/scripts/run-lighthouse.mjs
          grep -q 'measuredRunsIndividuallyGated: true' canonical/scripts/run-lighthouse.mjs
          rm -rf canonical/.git

          python3 .github/scripts/r7e-pack-source.py canonical /tmp/r7e-lh-pack1 --archive /tmp/r7e-lh-source1.zip
          python3 .github/scripts/r7e-pack-source.py canonical /tmp/r7e-lh-pack2 --archive /tmp/r7e-lh-source2.zip
          cmp /tmp/r7e-lh-source1.zip /tmp/r7e-lh-source2.zip
          diff -ru /tmp/r7e-lh-pack1 /tmp/r7e-lh-pack2
          printf '%s  %s\n' "$RESULT_ARCHIVE_SHA" /tmp/r7e-lh-source1.zip | sha256sum --check --strict
          test "$(cat /tmp/r7e-lh-pack1/ARCHIVE_SHA256)" = "$RESULT_ARCHIVE_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path
          tree=json.loads(Path('/tmp/r7e-lh-pack1/SOURCE_TREE.json').read_text())
          rows={row['path']:row for row in tree['files']}
          assert tree['fileCount']==111
          assert rows['scripts/run-lighthouse.mjs']['sha256']=='61a706b10c20f136079354121d9a6c616d68d129d7a500f5f298547d590fa4a6'
          print(json.dumps({'passed':True,'fileCount':tree['fileCount'],'archiveSha256':Path('/tmp/r7e-lh-pack1/ARCHIVE_SHA256').read_text().strip()},indent=2))
          PY

          rm -rf .r7e-source
          mkdir .r7e-source
          cp -a /tmp/r7e-lh-pack1/. .r7e-source/
          printf '%s\n' "$RESULT_ARCHIVE_SHA" > .r7e-source/HARDENED_SOURCE_READY
          sha256sum --check --strict .r7e-source/SHA256SUMS

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .r7e-source
          git commit -m 'R7E: freeze Lighthouse-stabilized canonical source'
          git push origin HEAD:r7e-hardened-verification-20260829
