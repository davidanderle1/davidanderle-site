name: R7F portable JSON Schema independent verifier v3

on:
  push:
    branches:
      - r7f-portable-authoritative-v2-20260901
    paths:
      - '.github/workflows/r7f-portable-authoritative-v3.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: r7f-portable-authoritative-v3
  cancel-in-progress: false

env:
  TZ: UTC
  SOURCE_DATE_EPOCH: '1787961600'
  NODE_OPTIONS: --max-old-space-size=4096
  R7F_ARTIFACT_PREFIX: r7f-portable-authoritative-v3-evidence

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact independent verifier plan and executor
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Install exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0

      - name: Execute transparent corrected independent verifier plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v24.20.0'
          test "$(npm --version)" = '11.19.0'
          test -s .github/workflows/r7f-portable-authoritative-v2.yml
          python3 -m py_compile \
            .github/scripts/r7f-portable-v2-preaudit.py \
            .github/scripts/r7f-portable-v2-tree.py \
            .github/scripts/execute-r7f-portable-v2-plan.py
          node --check .github/scripts/r7f-portable-v2-browser.mjs
          mkdir -p r7f-evidence
          cp .github/workflows/r7f-portable-authoritative-v2.yml r7f-evidence/R7F_SOURCE_PLAN.yml
          sha256sum \
            .github/workflows/r7f-portable-authoritative-v3.yml \
            .github/workflows/r7f-portable-authoritative-v2.yml \
            .github/scripts/execute-r7f-portable-v2-plan.py \
            .github/scripts/r7f-portable-v2-preaudit.py \
            .github/scripts/r7f-portable-v2-tree.py \
            .github/scripts/r7f-portable-v2-browser.mjs \
            > r7f-evidence/R7F_EXECUTOR_INFRASTRUCTURE.sha256
          python3 .github/scripts/execute-r7f-portable-v2-plan.py \
            .github/workflows/r7f-portable-authoritative-v2.yml \
            r7f-evidence/R7F_CORRECTED_PLAN.yml \
            r7f-evidence/R7F_PLAN_CORRECTION.diff \
            r7f-evidence/R7F_PLAN_EXECUTION.json
          jq -e '.passed==true and .correctionCount>0 and (.executed|length)>=7' r7f-evidence/R7F_PLAN_EXECUTION.json >/dev/null
          test -d r7f-artifact
          test -f r7f-artifact/R7F_PORTABLE_V2_DECISION.json
          jq -e '.passed==true and .decision=="R7F_PORTABLE_INDEPENDENT_PASS"' r7f-artifact/R7F_PORTABLE_V2_DECISION.json >/dev/null
          cp r7f-evidence/R7F_SOURCE_PLAN.yml r7f-artifact/
          cp r7f-evidence/R7F_CORRECTED_PLAN.yml r7f-artifact/
          cp r7f-evidence/R7F_PLAN_CORRECTION.diff r7f-artifact/
          cp r7f-evidence/R7F_PLAN_EXECUTION.json r7f-artifact/
          cp r7f-evidence/R7F_EXECUTOR_INFRASTRUCTURE.sha256 r7f-artifact/
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          root=Path('r7f-artifact')
          manifest=root/'R7F_ARTIFACT_SHA256SUMS.txt'
          rows=[]
          for path in sorted((p for p in root.rglob('*') if p.is_file() and p != manifest),key=lambda p:p.relative_to(root).as_posix().encode()):
              rows.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(root).as_posix()}")
          manifest.write_text('\n'.join(rows)+'\n')
          PY
          (
            cd r7f-artifact
            sha256sum --check --strict R7F_ARTIFACT_SHA256SUMS.txt
          )

      - name: Upload authoritative independent R7F v3 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7f-portable-authoritative-v3-evidence-${{ github.sha }}
          path: r7f-artifact/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
          include-hidden-files: true

      - name: Persist exact authoritative R7F v3 tuple
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_name="${R7F_ARTIFACT_PREFIX}-${GITHUB_SHA}"
          artifact_row=''
          for attempt in $(seq 1 12); do
            artifact_row="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --paginate \
              | jq -cs --arg name "$artifact_name" '[.[].artifacts[] | select(.name==$name)] | if length==1 then .[0] else empty end')"
            if test -n "$artifact_row"; then break; fi
            sleep 2
          done
          test -n "$artifact_row"
          artifact_id="$(jq -r '.id' <<<"$artifact_row")"
          artifact_digest="$(jq -r '.digest' <<<"$artifact_row")"
          test "$artifact_digest" != 'null'
          mkdir -p .github/r7-status
          jq -n \
            --arg schema 'R7F_PORTABLE_JSON_SCHEMA_AUTHORITATIVE_TUPLE_V3' \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg commit "$GITHUB_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg artifactName "$artifact_name" \
            --arg artifactId "$artifact_id" \
            --arg artifactDigest "$artifact_digest" \
            --arg decisionSha256 "$(sha256sum r7f-artifact/R7F_PORTABLE_V2_DECISION.json | awk '{print $1}')" \
            --arg planExecutionSha256 "$(sha256sum r7f-artifact/R7F_PLAN_EXECUTION.json | awk '{print $1}')" \
            --arg builderCommit "$(jq -r '.commit' r7f-input/R7E_TUPLE.json)" \
            --arg builderArtifactDigest "$(jq -r '.artifact.digest' r7f-input/R7E_TUPLE.json)" \
            '{schema:$schema,passed:true,repository:$repository,branch:$branch,commit:$commit,runId:($runId|tonumber),runAttempt:($runAttempt|tonumber),artifact:{id:($artifactId|tonumber),name:$artifactName,digest:$artifactDigest},decisionSha256:$decisionSha256,planExecutionSha256:$planExecutionSha256,builder:{commit:$builderCommit,artifactDigest:$builderArtifactDigest},scope:"Independent R7 technical architecture verification only; no main or deployment authorization"}' \
            > .github/r7-status/portable-r7f-v3.json
          jq -e '.passed==true and (.artifact.digest|startswith("sha256:"))' .github/r7-status/portable-r7f-v3.json >/dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/r7-status/portable-r7f-v3.json
          git diff --cached --check
          git commit -m 'R7F: record exact portable independent v3 tuple'
          git push origin HEAD:r7f-portable-authoritative-v2-20260901

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7f-portable-authoritative-v3-failure-${{ github.sha }}
          path: |
            r7f-input/
            r7f-evidence/
            r7f-artifact/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
          include-hidden-files: true
