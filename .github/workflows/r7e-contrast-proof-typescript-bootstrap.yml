name: R7E contrast-proof TypeScript source bootstrap

on:
  push:
    branches:
      - r7e-hardened-verification-20260829
    paths:
      - '.github/workflows/r7e-contrast-proof-typescript-bootstrap.yml'
      - '.github/r7-closure/r7e-contrast-proof-typescript-followup.patch'
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: UTC
  SOURCE_DATE_EPOCH: '1787961600'

jobs:
  bootstrap:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact R7E branch state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Install exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0

      - name: Derive deterministic type-safe contrast-proof canonical source
        shell: bash
        run: |
          set -euo pipefail
          readonly PREDECESSOR_ARCHIVE_SHA='e840cb7d88a1829f79ca754f78c61ef6488b008d3b45cbe9be9ec41df5ce0289'
          readonly RESULT_ARCHIVE_SHA='ff7776cfbe9db0dc0f0a2c5d6f9339c65e86706b46f52ead091203ba0e2cae80'
          readonly PATCH_SHA='36c54ba12d308cba27863beb5bc04109f9be0966de9aa3ccadb632f764619b18'
          readonly BEFORE_SPEC_SHA='b982663e5c5092d3df5ac38aa5067de5d860f9a8d4afee670630a935acebfa56'
          readonly AFTER_SPEC_SHA='255a823ec08ed152e0afb47b42793b6629a25d5aaf17638605a849aa93ea8caa'
          readonly PACKAGE_SHA='ca0c1211af36fd83440306c3966d952f1813aaae8c228aee098aee424a749504'
          readonly CONTRAST_SCRIPT_SHA='fbd9b1b747bd99fffdc5d89277640feada7a94807448101263f04137caec4540'
          readonly PATCH='.github/r7-closure/r7e-contrast-proof-typescript-followup.patch'

          test "$(node --version)" = 'v24.20.0'
          printf '%s  %s\n' "$PATCH_SHA" "$PATCH" | sha256sum --check --strict
          sha256sum --check --strict .r7e-source/SHA256SUMS
          current_archive_sha=$(tr -d '\r\n' < .r7e-source/ARCHIVE_SHA256)
          if [[ "$current_archive_sha" == "$RESULT_ARCHIVE_SHA" ]]; then
            echo 'TYPE_SAFE_CONTRAST_PROOF_SOURCE_ALREADY_CURRENT'
            exit 0
          fi
          test "$current_archive_sha" = "$PREDECESSOR_ARCHIVE_SHA"

          rm -rf canonical /tmp/r7e-tsfix-pack1 /tmp/r7e-tsfix-pack2
          rm -f /tmp/r7e-tsfix-predecessor.zip /tmp/r7e-tsfix-source1.zip /tmp/r7e-tsfix-source2.zip
          mkdir canonical
          cat .r7e-source/part*.b64 | tr -d '\r\n' | base64 --decode > /tmp/r7e-tsfix-predecessor.zip
          printf '%s  %s\n' "$PREDECESSOR_ARCHIVE_SHA" /tmp/r7e-tsfix-predecessor.zip | sha256sum --check --strict
          unzip -q /tmp/r7e-tsfix-predecessor.zip -d canonical

          printf '%s  %s\n' "$BEFORE_SPEC_SHA" canonical/tests/accessibility.spec.ts | sha256sum --check --strict
          printf '%s  %s\n' "$PACKAGE_SHA" canonical/package.json | sha256sum --check --strict
          printf '%s  %s\n' "$CONTRAST_SCRIPT_SHA" canonical/scripts/verify-contrast-bounds.mjs | sha256sum --check --strict

          (
            cd canonical
            git init -q
            git add -A
            git -c user.name='r7e-contrast-tsfix-bootstrap' -c user.email='r7e-contrast-tsfix-bootstrap@example.invalid' commit -qm 'immutable contrast-proof predecessor'
            git apply --check "$GITHUB_WORKSPACE/$PATCH"
            git apply "$GITHUB_WORKSPACE/$PATCH"
            git diff --check
            test "$(git diff --name-only)" = 'tests/accessibility.spec.ts'
          )

          printf '%s  %s\n' "$AFTER_SPEC_SHA" canonical/tests/accessibility.spec.ts | sha256sum --check --strict
          printf '%s  %s\n' "$PACKAGE_SHA" canonical/package.json | sha256sum --check --strict
          printf '%s  %s\n' "$CONTRAST_SCRIPT_SHA" canonical/scripts/verify-contrast-bounds.mjs | sha256sum --check --strict
          grep -Fq 'type AxeIncompleteNode = {' canonical/tests/accessibility.spec.ts
          grep -Fq 'function isAuditedGradientIncomplete(node: AxeIncompleteNode): boolean {' canonical/tests/accessibility.spec.ts
          grep -Fq "check?.id === 'color-contrast'" canonical/tests/accessibility.spec.ts
          grep -Fq "check.data?.messageKey === 'bgGradient'" canonical/tests/accessibility.spec.ts
          grep -Fq 'result.nodes.some((node) => !isAuditedGradientIncomplete(node))' canonical/tests/accessibility.spec.ts
          ! grep -Fq 'node.any[0].id' canonical/tests/accessibility.spec.ts
          ! grep -Fq 'node.any[0].data' canonical/tests/accessibility.spec.ts

          (
            cd canonical
            node scripts/verify-contrast-bounds.mjs > /tmp/r7e-tsfix-contrast-proof.stdout.json
          )
          python3 - <<'PY'
          import json
          from pathlib import Path
          proof=json.loads(Path('canonical/.r7e-tmp/contrast-bounds.json').read_text())
          assert proof['designation']=='R7E_STATIC_CONTRAST_BOUND_V1'
          assert proof['passed'] is True
          assert proof['checkCount']==32
          assert proof['minimumObservedRatio']>=4.5
          assert proof['failed']==[]
          print(json.dumps({
              'passed': True,
              'designation': proof['designation'],
              'checkCount': proof['checkCount'],
              'minimumObservedRatio': proof['minimumObservedRatio'],
          }, indent=2))
          PY
          rm -rf canonical/.git canonical/.r7e-tmp

          python3 .github/scripts/r7e-pack-source.py canonical /tmp/r7e-tsfix-pack1 --archive /tmp/r7e-tsfix-source1.zip
          python3 .github/scripts/r7e-pack-source.py canonical /tmp/r7e-tsfix-pack2 --archive /tmp/r7e-tsfix-source2.zip
          cmp /tmp/r7e-tsfix-source1.zip /tmp/r7e-tsfix-source2.zip
          diff -ru /tmp/r7e-tsfix-pack1 /tmp/r7e-tsfix-pack2
          printf '%s  %s\n' "$RESULT_ARCHIVE_SHA" /tmp/r7e-tsfix-source1.zip | sha256sum --check --strict
          test "$(cat /tmp/r7e-tsfix-pack1/ARCHIVE_SHA256)" = "$RESULT_ARCHIVE_SHA"

          python3 - <<'PY'
          import json
          from pathlib import Path
          tree=json.loads(Path('/tmp/r7e-tsfix-pack1/SOURCE_TREE.json').read_text())
          rows={row['path']:row for row in tree['files']}
          assert tree['fileCount']==112
          assert rows['tests/accessibility.spec.ts']['sha256']=='255a823ec08ed152e0afb47b42793b6629a25d5aaf17638605a849aa93ea8caa'
          assert rows['package.json']['sha256']=='ca0c1211af36fd83440306c3966d952f1813aaae8c228aee098aee424a749504'
          assert rows['scripts/verify-contrast-bounds.mjs']['sha256']=='fbd9b1b747bd99fffdc5d89277640feada7a94807448101263f04137caec4540'
          print(json.dumps({
              'passed': True,
              'fileCount': tree['fileCount'],
              'archiveSha256': Path('/tmp/r7e-tsfix-pack1/ARCHIVE_SHA256').read_text().strip(),
              'changedFiles': ['tests/accessibility.spec.ts'],
          }, indent=2))
          PY

          rm -rf .r7e-source
          mkdir .r7e-source
          cp -a /tmp/r7e-tsfix-pack1/. .r7e-source/
          printf '%s\n' "$RESULT_ARCHIVE_SHA" > .r7e-source/HARDENED_SOURCE_READY
          sha256sum --check --strict .r7e-source/SHA256SUMS

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .r7e-source
          git commit -m 'R7E: freeze type-safe contrast-proof canonical source'
          git push origin HEAD:r7e-hardened-verification-20260829
