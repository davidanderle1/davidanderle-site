name: R7F full-history reconciled independent verification

on:
  push:
    branches:
      - r7f-full-history-reconciled-verification-20260831
    paths:
      - '.github/workflows/r7f-hardened-independent-verification-v7.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: r7f-full-history-authoritative-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC
  SOURCE_DATE_EPOCH: '1787961600'
  NODE_OPTIONS: --max-old-space-size=4096
  BUILDER_BRANCH: r7e-full-history-reconciled-verification-20260831
  BUILDER_WORKFLOW_PATH: .github/workflows/r7e-full-history-reconciled-verification.yml
  BUILDER_RUN_ID: '33395532114'
  BUILDER_COMMIT: 8f37838e9cdd587942daed8b4f0d3acb10015a8d
  BUILDER_ARTIFACT_ID: '9759287627'
  BUILDER_ARTIFACT_NAME: r7e-full-history-reconciled-evidence-8f37838e9cdd587942daed8b4f0d3acb10015a8d
  BUILDER_ARTIFACT_DIGEST: sha256:8024f529b0bfd2d09c06cef81fee1de931205f35e12206b81842e55f19c6b08a
  BUILDER_SOURCE_ARCHIVE_SHA256: 867ad3adaa0f99e657cc714439bfac57d92efae406436cda96bdb056274121da
  BUILDER_FROZEN_SOURCE_TREE_SHA256: 0ffd982ed7e79c601cf403b64aa184b3c29e36ab77d59ed0ce287f7c72a39185
  BUILDER_FROZEN_SOURCE_TAR_SHA256: 59fca4ae763fd78e87b8ab71a16038a252cc1cb1cb81814fd1c2f568b3b2bd66
  BUILDER_VERIFIED_DIST_TREE_SHA256: ca90aabd104cfcec574abab38fe2bd04b38fe7bd031e6ce168b447140ecca7e8
  BUILDER_STRESS_DIST_TREE_SHA256: 913f208ecc0c4069c2e4d66adeb767a7a959ee85b483042258cfa06eea4bed77
  BUILDER_AXE_ADJUDICATION_FILE_SHA256: 58af713cf079b1ad75dacea7adfeea445a83ae6c27d332afcf1e24095d84d510
  BUILDER_AXE_SEMANTIC_INVENTORY_SHA256: 48cb39c9ba19a42bbfa5547b00629466c0207521afffc79f1c96d7be102256ef
  BUILDER_AXE_NODE_SET_SHA256: 8b255e4a380b6740a84afb77aa4eada22db93683a685bb00754cf271ae856e9c
  BUILDER_AXE_BINDING_SET_SHA256: 6edbe91b0a595ec821f855434a0493dd8c438255e6435819e1702c4b6a6e53c8
  BUILDER_AXE_INCOMPLETE_NODE_COUNT: '498'
  R7E_EXTERNAL_AUDIT_SHA256: a92fcbaa3a83a92d2c3bddf8bbc610f14c48b2c1f23a1c33c949020ab45fde61

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Checkout immutable independent verifier branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0

      - name: Execute locked full-history independent verifier
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/r7f-v6-final-locked.sh

      - name: Upload R7F evidence or diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7f-full-history-reconciled-evidence-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
          include-hidden-files: true
