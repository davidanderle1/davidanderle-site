name: Bootstrap R7F full-history residual hardening

on:
  push:
    branches:
      - r7f-full-history-reconciled-verification-20260831
    paths:
      - '.github/workflows/r7f-hardened-independent-verification-v7.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r7f-full-history-residual-hardening
  cancel-in-progress: false

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout independent verifier branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Remove residual legacy references and validate contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/scripts/r7f-v6-final-locked.sh')
          text=path.read_text(encoding='utf-8')
          old='.github/scripts/r7f-independent-axe-fingerprint-audit-v3.py'
          new='.github/scripts/r7f-independent-axe-fingerprint-dynamic.py'
          count=text.count(old)
          if count != 2:
              raise SystemExit(f'expected two residual auditor references, found {count}')
          path.write_text(text.replace(old,new),encoding='utf-8')
          PY

          python3 -m py_compile \
            .github/scripts/r7f-independent-axe-fingerprint-dynamic.py \
            .github/scripts/r7f-independent-source-audit.py \
            .github/scripts/r7f-evidence-gates.py
          bash -n .github/scripts/r7f-v3.sh
          bash -n .github/scripts/r7f-v4.sh
          bash -n .github/scripts/r7f-v6-final.sh
          bash -n .github/scripts/r7f-v6-final-locked.sh

          ! grep -RInE --include='r7f-v6-final*.sh' --include='r7f-evidence-gates.py' --include='r7f-independent-source-audit.py' \
            'r7f-independent-axe-fingerprint-audit-v3|exact-node-count-438|totalIncompleteNodes.==.438|nodeCount.==.438|R7E FINGERPRINT-BOUND BUILD EVIDENCE COMPLETE|r7e-fingerprint-bound-evidence-' \
            .github/scripts
          grep -q 'R7F_BUILDER_INPUT_V5_FULL_HISTORY_DYNAMIC_FINGERPRINT' .github/scripts/r7f-v6-final-locked.sh
          grep -q 'R7E_FULL_HISTORY_EXTERNAL_AUDIT_PASS' .github/scripts/r7f-v6-final-locked.sh
          grep -q 'BUILDER_AXE_INCOMPLETE_NODE_COUNT' .github/scripts/r7f-v6-final.sh
          grep -q 'BUILDER_AXE_INCOMPLETE_NODE_COUNT' .github/scripts/r7f-v6-final-locked.sh
          grep -q 'history-reconciled-homepage-selection' .github/scripts/r7f-independent-source-audit.py
          grep -q 'history-reconciled-writing-credit' .github/scripts/r7f-independent-source-audit.py

      - name: Commit fully hardened verifier infrastructure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/r7f-v6-final-locked.sh
          test -n "$(git diff --cached --name-only)"
          git diff --cached --check
          git commit -m 'R7F: bind locked wrapper to dynamic Axe auditor'
          git push origin HEAD:r7f-full-history-reconciled-verification-20260831
