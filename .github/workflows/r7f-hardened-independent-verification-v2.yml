name: R7F hardened independent Astro verification v2

on:
  push:
    branches:
      - r7f-hardened-independent-verification-v2-20260829
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: r7f-hardened-v2-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC
  SOURCE_DATE_EPOCH: '1787961600'
  NODE_OPTIONS: --max-old-space-size=4096
  BUILDER_RUN_ID: '33271067435'
  BUILDER_ARTIFACT_ID: '9720154114'
  BUILDER_ARTIFACT_NAME: r7e-hardened-evidence-6b3117187e785bdf7ee0a2fa3ba2456c57a5cf99
  BUILDER_ARTIFACT_DIGEST: sha256:3d43a30d15ad8c6e9e84e9ea389e815b87a3602feb393cf53b7ec045623c33d7

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout independent verifier branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0

      - name: Execute hardened independent verifier
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode | gzip --decompress > /tmp/r7f-v2.sh
          chmod 700 /tmp/r7f-v2.sh
          bash /tmp/r7f-v2.sh

      - name: Upload hardened independent R7F evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7f-hardened-independent-v2-evidence-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          include-hidden-files: true
