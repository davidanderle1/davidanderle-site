name: Materialize authoritative portable-schema R7E workflow

on:
  push:
    branches:
      - r7e-portable-json-schema-verification-20260831
    paths:
      - '.github/workflows/r7e-portable-authoritative-materializer.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r7e-portable-authoritative-materializer
  cancel-in-progress: false

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout frozen portable source branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Generate authority-bound portable R7E workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source=Path('.github/workflows/r7e-full-history-reconciled-verification.yml')
          target=Path('.github/workflows/r7e-portable-json-schema-verification.yml')
          text=source.read_text(encoding='utf-8')

          exact_replacements={
            'name: R7E full-history reconciled native Astro verification': 'name: R7E portable JSON Schema native Astro verification',
            'r7e-full-history-reconciled-verification-20260831': 'r7e-portable-json-schema-verification-20260831',
            "'.github/workflows/r7e-full-history-reconciled-verification.yml'": "'.github/workflows/r7e-portable-json-schema-verification.yml'",
            'r7e-full-history-reconciled-${{ github.ref }}': 'r7e-portable-json-schema-${{ github.ref }}',
            'Checkout immutable reconciliation branch': 'Checkout immutable portable-schema branch',
            "if not result['passed'] or len(actual) != 131:": "if not result['passed'] or len(actual) != 146:",
            "test \"$(grep -c 'EXPECTED FAILURE (exit 1)' ../evidence/invalid-fixtures.stdout.txt)\" -eq 28": "test \"$(grep -c 'EXPECTED FAILURE (exit 1)' ../evidence/invalid-fixtures.stdout.txt)\" -eq 29",
            ".github/workflows/r7e-full-history-reconciled-verification.yml | tee evidence/builder-infrastructure.sha256": ".github/workflows/r7e-portable-json-schema-verification.yml | tee evidence/builder-infrastructure.sha256",
            "'schema':'R7E_FULL_HISTORY_RECONCILED_CANDIDATE_IDENTITY_V1'": "'schema':'R7E_PORTABLE_JSON_SCHEMA_CANDIDATE_IDENTITY_V1'",
            "'workflowSha256':sha('.github/workflows/r7e-full-history-reconciled-verification.yml')": "'workflowSha256':sha('.github/workflows/r7e-portable-json-schema-verification.yml')",
            "'sourceCorrectionLayer':'NONE — full-history reconciliation folded into canonical packed source'": "'sourceCorrectionLayer':'NONE — full-history reconciliation and portable Draft 2020-12 contract folded into canonical packed source'",
            "printf 'R7E FULL-HISTORY RECONCILED BUILD EVIDENCE COMPLETE — READY FOR INDEPENDENT R7F\\n'": "printf 'R7E PORTABLE JSON SCHEMA BUILD EVIDENCE COMPLETE — READY FOR INDEPENDENT R7F\\n'",
            "printf 'R7E FULL-HISTORY RECONCILED BUILD EVIDENCE INCOMPLETE — DO NOT START R7F\\n'": "printf 'R7E PORTABLE JSON SCHEMA BUILD EVIDENCE INCOMPLETE — DO NOT START R7F\\n'",
            "=='R7E FULL-HISTORY RECONCILED BUILD EVIDENCE COMPLETE — READY FOR INDEPENDENT R7F'": "=='R7E PORTABLE JSON SCHEMA BUILD EVIDENCE COMPLETE — READY FOR INDEPENDENT R7F'",
            "identity.get('schema')=='R7E_FULL_HISTORY_RECONCILED_CANDIDATE_IDENTITY_V1'": "identity.get('schema')=='R7E_PORTABLE_JSON_SCHEMA_CANDIDATE_IDENTITY_V1'",
            "'schema':'R7E_FULL_HISTORY_RECONCILED_PACKAGE_VALIDATION_V1'": "'schema':'R7E_PORTABLE_JSON_SCHEMA_PACKAGE_VALIDATION_V1'",
            'Upload full-history reconciled R7E evidence': 'Upload portable JSON Schema R7E evidence',
            'name: r7e-full-history-reconciled-evidence-${{ github.sha }}': 'name: r7e-portable-json-schema-evidence-${{ github.sha }}',
          }
          for old,new in exact_replacements.items():
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'authoritative workflow replacement mismatch: {old!r} count={count}')
              text=text.replace(old,new,1)

          old_required="for required in package.json package-lock.json .node-version .nvmrc astro.config.mjs src/content.config.ts docs/R7_HISTORY_RECONCILIATION.md src/components/HomepageRecordPreview.astro src/components/WritingRecordPreview.astro src/lib/profile-copy.ts scripts/build-axe-fingerprint-adjudication.mjs; do"
          new_required="for required in package.json package-lock.json .node-version .nvmrc astro.config.mjs src/content.config.ts src/content-schemas.ts docs/R7_HISTORY_RECONCILIATION.md docs/PORTABLE_JSON_SCHEMA.md schemas/index.json schemas/canonical-content.schema.json src/components/HomepageRecordPreview.astro src/components/WritingRecordPreview.astro src/lib/profile-copy.ts scripts/build-axe-fingerprint-adjudication.mjs scripts/generate-json-schemas.mjs scripts/validate-json-schema.mjs scripts/verify-json-schema-drift.mjs; do"
          if text.count(old_required)!=1:
              raise SystemExit('required-path anchor mismatch')
          text=text.replace(old_required,new_required,1)

          old_lock="const ok=p.packageManager==='npm@11.19.0' && p.engines?.node==='24.20.0' && p.engines?.npm==='11.19.0' && l.lockfileVersion===3 && count>=500 && !l.r7eBootstrapStatus && axeScript.includes('build-axe-fingerprint-adjudication.mjs');"
          new_lock="const ok=p.packageManager==='npm@11.19.0' && p.engines?.node==='24.20.0' && p.engines?.npm==='11.19.0' && l.lockfileVersion===3 && count>=500 && !l.r7eBootstrapStatus && axeScript.includes('build-axe-fingerprint-adjudication.mjs') && p.devDependencies?.ajv==='8.20.0' && l.packages?.['node_modules/ajv']?.version==='8.20.0' && ['schema:generate','schema:check','schema:contract','schema:validate:stress'].every((name)=>typeof p.scripts?.[name]==='string');"
          if text.count(old_lock)!=1:
              raise SystemExit('toolchain lock anchor mismatch')
          text=text.replace(old_lock,new_lock,1)

          freeze_anchor='      - name: Freeze source and deterministic transport\n'
          portable_step="""      - name: Verify portable Draft 2020-12 schema contract
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci --audit=false --fund=false > ../evidence/portable-schema-npm-ci.stdout.txt 2> ../evidence/portable-schema-npm-ci.stderr.txt
          rm -rf public/assets/portrait public/assets/js public/artifacts src/data/generated dist .astro .r7e-tmp
          npm run schema:check > ../evidence/portable-schema-check.stdout.txt 2> ../evidence/portable-schema-check.stderr.txt
          npm run schema:contract > ../evidence/portable-schema-contract.stdout.txt 2> ../evidence/portable-schema-contract.stderr.txt
          test \"$(find schemas -maxdepth 1 -type f -name '*.json' | wc -l)\" -eq 9
          jq -e '.contractVersion==\"1.0.0\" and .dialect==\"https://json-schema.org/draft/2020-12/schema\" and (.schemas|length)==8' schemas/index.json >/dev/null
          for file in schemas/*.schema.json; do
            jq -e '.\"$schema\"==\"https://json-schema.org/draft/2020-12/schema\" and .\"x-contract-version\"==\"1.0.0\"' \"$file\" >/dev/null
          done
          cp schemas/index.json ../evidence/portable-schema-index.json
          find schemas -maxdepth 1 -type f -name '*.json' -print0 | sort -z | xargs -0 sha256sum > ../evidence/portable-schema-files.sha256
          rm -rf node_modules public/assets/portrait public/assets/js public/artifacts src/data/generated dist .astro .r7e-tmp

"""
          if text.count(freeze_anchor)!=1:
              raise SystemExit('freeze-step anchor mismatch')
          text=text.replace(freeze_anchor,portable_step+freeze_anchor,1)

          run1_anchor="          /usr/bin/time -v -o ../evidence/run1-check.time.txt npm run check > ../evidence/run1-check.stdout.txt 2> ../evidence/run1-check.stderr.txt\n"
          run1_insert="          npm run schema:check > ../evidence/run1-schema-check.stdout.txt 2> ../evidence/run1-schema-check.stderr.txt\n          npm run schema:contract > ../evidence/run1-schema-contract.stdout.txt 2> ../evidence/run1-schema-contract.stderr.txt\n"
          if text.count(run1_anchor)!=1:
              raise SystemExit('run1 schema anchor mismatch')
          text=text.replace(run1_anchor,run1_insert+run1_anchor,1)

          run2_anchor="          /usr/bin/time -v -o ../evidence/run2-check.time.txt npm run check > ../evidence/run2-check.stdout.txt 2> ../evidence/run2-check.stderr.txt\n"
          run2_insert="          npm run schema:check > ../evidence/run2-schema-check.stdout.txt 2> ../evidence/run2-schema-check.stderr.txt\n          npm run schema:contract > ../evidence/run2-schema-contract.stdout.txt 2> ../evidence/run2-schema-contract.stderr.txt\n"
          if text.count(run2_anchor)!=1:
              raise SystemExit('run2 schema anchor mismatch')
          text=text.replace(run2_anchor,run2_insert+run2_anchor,1)

          stress_anchor="          /usr/bin/time -v -o ../evidence/stress.time.txt npm run test:stress > ../evidence/stress.stdout.txt 2> ../evidence/stress.stderr.txt\n"
          stress_insert="          npm run schema:validate:stress > ../evidence/stress-schema.stdout.txt 2> ../evidence/stress-schema.stderr.txt\n"
          if text.count(stress_anchor)!=1:
              raise SystemExit('stress schema anchor mismatch')
          text=text.replace(stress_anchor,stress_anchor+stress_insert,1)

          identity_anchor="            'axeIncompleteNodeCount':axe['metrics']['totalIncompleteNodes'],\n"
          identity_insert="""            'portableSchemaContractVersion':'1.0.0',
            'portableSchemaDialect':'https://json-schema.org/draft/2020-12/schema',
            'portableSchemaIndexSha256':sha('frozen/schemas/index.json'),
            'portableSchemaSetSha256':sha('evidence/portable-schema-files.sha256'),
"""
          if text.count(identity_anchor)!=1:
              raise SystemExit('identity schema anchor mismatch')
          text=text.replace(identity_anchor,identity_anchor+identity_insert,1)

          package_anchor="            'historyReconciliationPresent':(root/'BEARING_PRODUCTION_SOURCE/docs/R7_HISTORY_RECONCILIATION.md').is_file(),\n"
          package_insert="""            'portableSchemaDocumentationPresent':(root/'BEARING_PRODUCTION_SOURCE/docs/PORTABLE_JSON_SCHEMA.md').is_file(),
            'portableSchemaIndexPresent':(root/'BEARING_PRODUCTION_SOURCE/schemas/index.json').is_file(),
            'portableSchemaCanonicalPresent':(root/'BEARING_PRODUCTION_SOURCE/schemas/canonical-content.schema.json').is_file(),
            'portableSchemaEvidencePresent':(root/'R7E_EVIDENCE/portable-schema-index.json').is_file() and (root/'R7E_EVIDENCE/portable-schema-files.sha256').is_file(),
"""
          if text.count(package_anchor)!=1:
              raise SystemExit('package schema anchor mismatch')
          text=text.replace(package_anchor,package_anchor+package_insert,1)

          if text.count("'wrangler':'R7E_EVIDENCE/wrangler-files.txt'}")!=1:
              raise SystemExit('evidence-index anchor mismatch')
          text=text.replace("'wrangler':'R7E_EVIDENCE/wrangler-files.txt'}", "'wrangler':'R7E_EVIDENCE/wrangler-files.txt','portableSchemaIndex':'R7E_EVIDENCE/portable-schema-index.json','portableSchemaHashes':'R7E_EVIDENCE/portable-schema-files.sha256'}",1)

          if 'R7E FULL-HISTORY RECONCILED' in text or 'r7e-full-history-reconciled' in text:
              raise SystemExit('legacy full-history workflow identity remains')
          target.write_text(text,encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/r7e-portable-json-schema-verification.yml').read_text()
          required=(
              'R7E portable JSON Schema native Astro verification',
              'r7e-portable-json-schema-verification-20260831',
              'R7E_PORTABLE_JSON_SCHEMA_CANDIDATE_IDENTITY_V1',
              'R7E PORTABLE JSON SCHEMA BUILD EVIDENCE COMPLETE',
              'portable-schema-index.json',
              'schema:contract',
              'len(actual) != 146',
              '-eq 29',
          )
          missing=[token for token in required if token not in text]
          if missing:
              raise SystemExit(f'generated workflow missing contracts: {missing}')
          PY

      - name: Commit immutable authoritative workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/r7e-portable-json-schema-verification.yml
          test -n "$(git diff --cached --name-only)"
          git diff --cached --check
          git commit -m 'R7E: materialize authoritative portable JSON Schema verifier'
          git push origin HEAD:r7e-portable-json-schema-verification-20260831
