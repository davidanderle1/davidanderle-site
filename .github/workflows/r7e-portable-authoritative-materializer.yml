name: Materialize authoritative portable-schema R7E workflow

on:
  push:
    branches:
      - r7e-portable-json-schema-verification-20260831
    paths:
      - '.github/workflows/r7e-portable-authoritative-materializer.yml'
      - '.github/scripts/materialize-portable-r7e-workflow.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r7e-portable-authoritative-materializer
  cancel-in-progress: false

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout frozen portable source branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Generate and correct authoritative workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/materialize-portable-r7e-workflow.py
          python3 .github/scripts/materialize-portable-r7e-workflow.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/r7e-portable-json-schema-verification.yml')
          text = path.read_text(encoding='utf-8')
          replacements = (
              (
                  'scripts/validate-json-schema.mjs scripts/verify-json-schema-drift.mjs',
                  'scripts/validate-json-schemas.mjs scripts/run-portable-schema-contract.mjs',
                  'portable verifier required paths',
              ),
              (
                  '.contractVersion=="1.0.0" and .dialect=="https://json-schema.org/draft/2020-12/schema" and (.schemas|length)==8',
                  '.contractVersion=="1.0.0" and ."$schema"=="https://json-schema.org/draft/2020-12/schema" and (.schemas|length)==8',
                  'portable schema index dialect assertion',
              ),
          )
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} correction count={count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          test -s .github/workflows/r7e-portable-json-schema-verification.yml
          ! grep -q 'scripts/validate-json-schema.mjs' .github/workflows/r7e-portable-json-schema-verification.yml
          ! grep -q 'scripts/verify-json-schema-drift.mjs' .github/workflows/r7e-portable-json-schema-verification.yml
          ! grep -q '\.dialect=="https://json-schema.org/draft/2020-12/schema"' .github/workflows/r7e-portable-json-schema-verification.yml
          grep -q 'scripts/validate-json-schemas.mjs' .github/workflows/r7e-portable-json-schema-verification.yml
          grep -q 'scripts/run-portable-schema-contract.mjs' .github/workflows/r7e-portable-json-schema-verification.yml
          grep -q '\."\$schema"=="https://json-schema.org/draft/2020-12/schema"' .github/workflows/r7e-portable-json-schema-verification.yml
          sha256sum .github/scripts/materialize-portable-r7e-workflow.py .github/workflows/r7e-portable-json-schema-verification.yml > authoritative-workflow.sha256
          git hash-object .github/workflows/r7e-portable-json-schema-verification.yml > authoritative-workflow.git-blob-sha1

      - name: Publish corrected blob object without moving authoritative ref
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/r7e-portable-json-schema-verification.yml
          git commit -m 'R7E: stage corrected authoritative portable verifier'
          set +e
          git push origin HEAD:r7e-portable-json-schema-verification-20260831 > workflow-push.stdout.txt 2> workflow-push.stderr.txt
          status=$?
          set -e
          printf '%s\n' "$status" > workflow-push.status.txt
          test "$status" -ne 0
          grep -q 'without `workflows` permission' workflow-push.stderr.txt

      - name: Export corrected workflow for separate write authority
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7e-portable-corrected-authoritative-workflow-${{ github.sha }}
          path: |
            .github/workflows/r7e-portable-json-schema-verification.yml
            authoritative-workflow.sha256
            authoritative-workflow.git-blob-sha1
            workflow-push.stdout.txt
            workflow-push.stderr.txt
            workflow-push.status.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          include-hidden-files: true
