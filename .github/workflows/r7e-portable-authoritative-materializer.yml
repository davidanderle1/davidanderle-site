name: Materialize authoritative portable-schema R7E workflow

on:
  push:
    branches:
      - r7e-portable-json-schema-verification-20260831
    paths:
      - '.github/workflows/r7e-portable-authoritative-materializer.yml'
      - '.github/scripts/materialize-portable-r7e-workflow.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r7e-portable-authoritative-materializer
  cancel-in-progress: false

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout frozen portable source branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Validate and generate authoritative workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/materialize-portable-r7e-workflow.py
          python3 .github/scripts/materialize-portable-r7e-workflow.py
          test -s .github/workflows/r7e-portable-json-schema-verification.yml
          ! grep -q 'r7e-full-history-reconciled' .github/workflows/r7e-portable-json-schema-verification.yml

      - name: Commit immutable authoritative workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/r7e-portable-json-schema-verification.yml
          test -n "$(git diff --cached --name-only)"
          git diff --cached --check
          git commit -m 'R7E: materialize authoritative portable JSON Schema verifier'
          git push origin HEAD:r7e-portable-json-schema-verification-20260831
