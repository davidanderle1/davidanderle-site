<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc"><title id="title">Merkle Poseidon prototype flow</title><desc id="desc">Four value and randomness pairs are hashed into commitments. The commitments form Merkle leaves, then internal nodes and a root. A membership proof is verified separately from a native sum threshold check.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2e7d7e"/></marker></defs><style>text{font:13px system-ui,sans-serif;fill:#10233a}.box{fill:#fffdf7;stroke:#bfc4c7;stroke-width:1.5}.commit{fill:#e3f0ed;stroke:#2e7d7e;stroke-width:2}.node{fill:#e9f0f6;stroke:#2b5c82;stroke-width:2}.root{fill:#10233a;stroke:#10233a;stroke-width:2}.roottext{fill:white;font-weight:700}.arrow{stroke:#2e7d7e;stroke-width:2;fill:none;marker-end:url(#a)}.dash{stroke:#9a6914;stroke-width:2;stroke-dasharray:6 5;fill:none}.label{font-weight:700}.small{fill:#5d6772;font-size:11px}</style><rect width="100%" height="100%" fill="#fffdf7" rx="8"/><text x="40" y="38" class="label" font-size="17">Commitments, Merkle membership, and a separate native sum check</text><g><rect class="box" x="42" y="95" width="155" height="64" rx="6"/><rect class="box" x="42" y="185" width="155" height="64" rx="6"/><rect class="box" x="42" y="275" width="155" height="64" rx="6"/><rect class="box" x="42" y="365" width="155" height="64" rx="6"/><text x="119" y="121" text-anchor="middle" class="label">value + randomness</text><text x="119" y="141" text-anchor="middle" class="small">10, 111</text><text x="119" y="211" text-anchor="middle" class="label">value + randomness</text><text x="119" y="231" text-anchor="middle" class="small">20, 222</text><text x="119" y="301" text-anchor="middle" class="label">value + randomness</text><text x="119" y="321" text-anchor="middle" class="small">30, 333</text><text x="119" y="391" text-anchor="middle" class="label">value + randomness</text><text x="119" y="411" text-anchor="middle" class="small">40, 444</text></g><g><rect class="commit" x="270" y="95" width="165" height="64" rx="6"/><rect class="commit" x="270" y="185" width="165" height="64" rx="6"/><rect class="commit" x="270" y="275" width="165" height="64" rx="6"/><rect class="commit" x="270" y="365" width="165" height="64" rx="6"/><text x="352" y="126" text-anchor="middle" class="label">Poseidon interface</text><text x="352" y="146" text-anchor="middle" class="small">commitment leaf</text><text x="352" y="216" text-anchor="middle" class="label">Poseidon interface</text><text x="352" y="236" text-anchor="middle" class="small">commitment leaf</text><text x="352" y="306" text-anchor="middle" class="label">Poseidon interface</text><text x="352" y="326" text-anchor="middle" class="small">commitment leaf</text><text x="352" y="396" text-anchor="middle" class="label">Poseidon interface</text><text x="352" y="416" text-anchor="middle" class="small">commitment leaf</text></g><path class="arrow" d="M197 127H266M197 217H266M197 307H266M197 397H266"/><g><circle class="node" cx="580" cy="172" r="46"/><circle class="node" cx="580" cy="352" r="46"/><circle class="root" cx="760" cy="262" r="58"/><text x="580" y="168" text-anchor="middle" class="label">internal</text><text x="580" y="187" text-anchor="middle" class="small">hash</text><text x="580" y="348" text-anchor="middle" class="label">internal</text><text x="580" y="367" text-anchor="middle" class="small">hash</text><text x="760" y="258" text-anchor="middle" class="roottext">Merkle</text><text x="760" y="279" text-anchor="middle" class="roottext">root</text></g><path class="arrow" d="M435 127L535 159M435 217L535 185M435 307L535 339M435 397L535 365M626 172L707 236M626 352L707 288"/><path class="dash" d="M119 445C300 498 640 498 788 345"/><text x="410" y="492" text-anchor="middle" class="small">Native sum &gt; threshold check — not a zero-knowledge proof</text></svg>