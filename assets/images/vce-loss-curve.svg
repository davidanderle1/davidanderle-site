<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
<title id="title">Initial shock versus final system equity loss</title><desc id="desc">The deterministic synthetic sweep rises from 1.6 percent loss at a 2 percent shock to 34.3 percent loss at a 30 percent shock. The first distressed fund appears at a 16 percent shock.</desc>
