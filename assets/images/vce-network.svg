<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc"><title id="title">Synthetic fund and asset network</title><desc id="desc">Six synthetic funds on the left connect to five shared assets on the right, illustrating overlapping exposures.</desc><rect width="760" height="420" rx="24" fill="#fffdf8"/><g stroke="#cad2cf" stroke-width="2" opacity=".9"><path d="M180 80 C350 70,410 70,580 70"/><path d="M180 80 C350 200,410 200,580 200"/><path d="M180 132 C350 135,410 135,580 135"/><path d="M180 132 C350 265,410 265,580 265"/><path d="M180 184 C350 200,410 200,580 200"/><path d="M180 184 C350 330,410 330,580 330"/><path d="M180 236 C350 265,410 265,580 265"/><path d="M180 236 C350 70,410 70,580 70"/><path d="M180 288 C350 330,410 330,580 330"/><path d="M180 288 C350 135,410 135,580 135"/><path d="M180 340 C350 70,410 70,580 70"/><path d="M180 340 C350 200,410 200,580 200"/></g><g font-family="system-ui,sans-serif"><rect x="70" y="57" width="150" height="40" rx="20" fill="#eef4f1" stroke="#2e7477"/><text x="145" y="82" text-anchor="middle" font-size="14" fill="#11243d">Fund 1</text><rect x="70" y="109" width="150" height="40" rx="20" fill="#eef4f1" stroke="#2e7477"/><text x="145" y="134" text-anchor="middle" font-size="14" fill="#11243d">Fund 2</text><rect x="70" y="161" width="150" height="40" rx="20" fill="#eef4f1" stroke="#2e7477"/><text x="145" y="186" text-anchor="middle" font-size="14" fill="#11243d">Fund 3</text><rect x="70" y="213" width="150" height="40" rx="20" fill="#eef4f1" stroke="#2e7477"/><text x="145" y="238" text-anchor="middle" font-size="14" fill="#11243d">Fund 4</text><rect x="70" y="265" width="150" height="40" rx="20" fill="#eef4f1" stroke="#2e7477"/><text x="145" y="290" text-anchor="middle" font-size="14" fill="#11243d">Fund 5</text><rect x="70" y="317" width="150" height="40" rx="20" fill="#eef4f1" stroke="#2e7477"/><text x="145" y="342" text-anchor="middle" font-size="14" fill="#11243d">Fund 6</text>