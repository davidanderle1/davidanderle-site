<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc"><title id="title">Synthetic fund-asset exposure network</title><desc id="desc">Six fund nodes connect to five asset nodes. Overlapping exposures create a channel through which forced selling can transmit losses.</desc><style>text{font:13px system-ui,sans-serif;fill:#10233a}.edge{stroke:#b8c4c7;stroke-width:2;opacity:.78}.asset{fill:#e3f0ed;stroke:#2e7d7e;stroke-width:2}.fund{fill:#e9f0f6;stroke:#2b5c82;stroke-width:2}.distress{fill:#fbf1d5;stroke:#9a6914;stroke-width:3}.label{font-weight:700}.small{fill:#5d6772;font-size:11px}</style><rect width="100%" height="100%" fill="#fffdf7" rx="8"/><text x="42" y="40" class="label" font-size="17">Exposure overlap creates a propagation channel</text><text x="42" y="62" class="small">Schematic of the six-fund, five-asset synthetic system</text><g class="edges"><path class="edge" d="M185 130L450 105M185 130L450 190M185 130L450 275M185 130L450 360M185 230L450 105M185 230L450 275M185 230L450 360M185 230L450 445M185 330L450 190M185 330L450 275M185 330L450 360M735 130L470 105M735 130L470 190M735 130L470 360M735 230L470 105M735 230L470 275M735 230L470 445M735 330L470 190M735 330L470 275M735 330L470 360"/></g><g><circle class="fund" cx="170" cy="130" r="50"/><circle class="fund" cx="170" cy="230" r="50"/><circle class="fund" cx="170" cy="330" r="50"/><circle class="fund" cx="750" cy="130" r="50"/><circle class="distress" cx="750" cy="230" r="54"/><circle class="fund" cx="750" cy="330" r="50"/><text x="170" y="126" text-anchor="middle" class="label">Fund 1</text><text x="170" y="144" text-anchor="middle" class="small">3.8×</text><text x="170" y="226" text-anchor="middle" class="label">Fund 2</text><text x="170" y="244" text-anchor="middle" class="small">4.1×</text><text x="170" y="326" text-anchor="middle" class="label">Fund 3</text><text x="170" y="344" text-anchor="middle" class="small">3.4×</text><text x="750" y="126" text-anchor="middle" class="label">Fund 4</text><text x="750" y="144" text-anchor="middle" class="small">3.9×</text><text x="750" y="226" text-anchor="middle" class="label">Fund 5</text><text x="750" y="244" text-anchor="middle" class="small">distressed</text><text x="750" y="326" text-anchor="middle" class="label">Fund 6</text><text x="750" y="344" text-anchor="middle" class="small">4.3×</text></g><g><rect class="asset" x="405" y="80" width="110" height="50" rx="25"/><rect class="asset" x="405" y="165" width="110" height="50" rx="25"/><rect class="distress" x="405" y="250" width="110" height="50" rx="25"/><rect class="asset" x="405" y="335" width="110" height="50" rx="25"/><rect class="asset" x="405" y="420" width="110" height="50" rx="25"/><text x="460" y="111" text-anchor="middle" class="label">AERO</text><text x="460" y="196" text-anchor="middle" class="label">GRID</text><text x="460" y="281" text-anchor="middle" class="label">CHIP</text><text x="460" y="366" text-anchor="middle" class="label">PORT</text><text x="460" y="451" text-anchor="middle" class="label">RAIL</text></g></svg>